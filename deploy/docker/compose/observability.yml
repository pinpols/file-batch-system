# 观测栈：Prometheus / Grafana / Loki / Jaeger / OTel Collector / Alertmanager / Exporters
# 本地开发栈；依赖根 docker-compose.yml 的服务名和 batch-network，不是生产部署 overlay。
# Web/OTLP 宿主机端口默认只绑定回环地址；远程访问应通过受控反向代理显式配置。
x-observability-logging: &observability-logging
  driver: local
  options:
    max-size: ${BATCH_DOCKER_LOG_MAX_SIZE:-50m}
    max-file: ${BATCH_DOCKER_LOG_MAX_FILES:-3}

services:
  console-api:
    logging: *observability-logging
    environment:
      SPRING_CONFIG_IMPORT: optional:configtree:/run/secrets/
    secrets:
      - source: alertmanager-bearer-token
        target: batch.console.alertmanager.bearer-token

  # ── 指标 ──────────────────────────────────────────────────────────
  prometheus:
    logging: *observability-logging
    image: prom/prometheus:${PROMETHEUS_IMAGE_TAG:-v3.11.3}
    container_name: batch-prometheus
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/etc/prometheus/entrypoint.sh"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=15GB
      - --web.enable-lifecycle
    environment:
      BATCH_DEPLOY_MODE: ${BATCH_DEPLOY_MODE:-container}
      PROMETHEUS_HOST_TARGET: ${PROMETHEUS_HOST_TARGET:-host.docker.internal}
      CONSOLE_API_PORT: ${CONSOLE_API_PORT:-18080}
      TRIGGER_PORT: ${TRIGGER_PORT:-18081}
      ORCHESTRATOR_PORT: ${ORCHESTRATOR_PORT:-18082}
      WORKER_IMPORT_PORT: ${WORKER_IMPORT_PORT:-18083}
      WORKER_EXPORT_PORT: ${WORKER_EXPORT_PORT:-18084}
      WORKER_DISPATCH_PORT: ${WORKER_DISPATCH_PORT:-18085}
      WORKER_PROCESS_PORT: ${WORKER_PROCESS_PORT:-18086}
      WORKER_ATOMIC_PORT: ${WORKER_ATOMIC_PORT:-18087}
      PROMETHEUS_ENABLE_HOST_METRICS: ${PROMETHEUS_ENABLE_HOST_METRICS:-false}
      PROMETHEUS_ENABLE_CONTAINER_METRICS: ${PROMETHEUS_ENABLE_CONTAINER_METRICS:-false}
    volumes:
      - ./deploy/docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/docker/observability/prometheus-batch-rules.yml:/etc/prometheus/rules/batch.yml:ro
      - ./deploy/docker/observability/prometheus-entrypoint.sh:/etc/prometheus/entrypoint.sh:ro
      - prometheus-data:/prometheus
    ports:
      - "${OBSERVABILITY_BIND_IP:-127.0.0.1}:${PROMETHEUS_PORT:-19090}:9090"
    networks:
      - batch-network

  alertmanager:
    logging: *observability-logging
    image: prom/alertmanager:${ALERTMANAGER_IMAGE_TAG:-v0.28.1}
    container_name: batch-alertmanager
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/usr/local/bin/render-alertmanager-config.sh"]
    environment:
      BATCH_CONSOLE_ALERTMANAGER_BEARER_TOKEN: ${BATCH_CONSOLE_ALERTMANAGER_BEARER_TOKEN:-}
    volumes:
      - ./deploy/docker/observability/alertmanager-batch-template.yml:/etc/alertmanager/alertmanager-template.yml:ro
      - ./scripts/ops/render-alertmanager-config.sh:/usr/local/bin/render-alertmanager-config.sh:ro
    secrets:
      - source: alertmanager-bearer-token
        target: alertmanager-bearer-token
    ports:
      - "${OBSERVABILITY_BIND_IP:-127.0.0.1}:${ALERTMANAGER_PORT:-19093}:9093"
    networks:
      - batch-network

  # ── 链路 ──────────────────────────────────────────────────────────
  jaeger:
    logging: *observability-logging
    image: jaegertracing/jaeger:${JAEGER_IMAGE_TAG:-2.7.0}
    container_name: batch-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${OBSERVABILITY_BIND_IP:-127.0.0.1}:${JAEGER_UI_PORT:-16686}:16686" # UI
    expose:
      - "4317"
    networks:
      - batch-network

  tempo-init:
    logging: *observability-logging
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.volume-init
    container_name: batch-tempo-init
    restart: "no"
    user: "10001:10001"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: ["test -w /volume/tempo || { echo 'Tempo volume must be owned by 10001:10001' >&2; exit 1; }"]
    volumes:
      - tempo-data:/volume/tempo

  tempo:
    logging: *observability-logging
    image: grafana/tempo:${TEMPO_IMAGE_TAG:-2.6.1}
    container_name: batch-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yml"]
    user: "10001:10001"
    volumes:
      - ./deploy/docker/observability/tempo.yml:/etc/tempo/tempo.yml:ro
      - type: volume
        source: tempo-data
        target: /var/tempo
        volume:
          nocopy: true
    ports:
      - "${OBSERVABILITY_BIND_IP:-127.0.0.1}:${TEMPO_HTTP_PORT:-13200}:3200" # 查询 API
    expose:
      - "4317"
    networks:
      - batch-network
    depends_on:
      tempo-init:
        condition: service_completed_successfully

  # ── 日志 ──────────────────────────────────────────────────────────
  loki:
    logging: *observability-logging
    image: grafana/loki:${LOKI_IMAGE_TAG:-3.5.0}
    container_name: batch-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./deploy/docker/observability/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    ports:
      - "${OBSERVABILITY_BIND_IP:-127.0.0.1}:${LOKI_PORT:-13100}:3100"
    networks:
      - batch-network

  # ── OTel Collector ────────────────────────────────────────────────
  otel-collector-init:
    logging: *observability-logging
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.volume-init
    container_name: batch-otel-collector-init
    restart: "no"
    user: "10001:10001"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: ["test -w /volume/otel || { echo 'Collector volume must be owned by 10001:10001' >&2; exit 1; }"]
    volumes:
      - otel-collector-data:/volume/otel

  otel-collector:
    logging: *observability-logging
    image: otel/opentelemetry-collector-contrib:${OTEL_COLLECTOR_IMAGE_TAG:-0.127.0}
    container_name: batch-otel-collector
    restart: unless-stopped
    user: "10001:10001"
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-local}
    volumes:
      - ./deploy/docker/observability/otel-collector.yml:/etc/otelcol/config.yaml:ro
      - type: volume
        source: otel-collector-data
        target: /var/lib/otelcol
        volume:
          nocopy: true
    ports:
      - "${OBSERVABILITY_BIND_IP:-127.0.0.1}:${OTEL_GRPC_PORT:-4317}:4317"
      - "${OBSERVABILITY_BIND_IP:-127.0.0.1}:${OTEL_HTTP_PORT:-4318}:4318"
    networks:
      - batch-network
    depends_on:
      otel-collector-init:
        condition: service_completed_successfully
      jaeger:
        condition: service_started
      tempo:
        condition: service_started
      loki:
        condition: service_started

  # ── 仪表盘 ───────────────────────────────────────────────────────
  grafana:
    logging: *observability-logging
    image: grafana/grafana:${GRAFANA_IMAGE_TAG:-11.6.0}
    container_name: batch-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # 本地默认复用已显式提供的数据库密码；部署环境应单独设置 GRAFANA_ADMIN_PASSWORD。
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./deploy/docker/observability/grafana-provisioning:/etc/grafana/provisioning:ro
      - ./deploy/docker/observability/grafana-dashboard-batch.json:/var/lib/grafana/dashboards/batch.json:ro
      - ./deploy/docker/observability/grafana-dashboard-batch-coverage.json:/var/lib/grafana/dashboards/batch-coverage.json:ro
      - ./deploy/docker/observability/grafana-dashboard-batch-mainline.json:/var/lib/grafana/dashboards/batch-mainline.json:ro
      - ./deploy/docker/observability/grafana-dashboard-batch-sre.json:/var/lib/grafana/dashboards/batch-sre.json:ro
      - ./deploy/docker/observability/grafana-dashboard-batch-capacity.json:/var/lib/grafana/dashboards/batch-capacity.json:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${OBSERVABILITY_BIND_IP:-127.0.0.1}:${GRAFANA_PORT:-13000}:3000"
    networks:
      - batch-network
    depends_on:
      - prometheus
      - loki
      - tempo

  # ── 基础设施 Exporters ───────────────────────────────────────────
  redis-exporter:
    logging: *observability-logging
    image: oliver006/redis_exporter:${REDIS_EXPORTER_IMAGE_TAG:-v1.84.0}
    container_name: batch-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: valkey:6379
    networks:
      - batch-network
    ports:
      - "${OBSERVABILITY_BIND_IP:-127.0.0.1}:${REDIS_EXPORTER_PORT:-19121}:9121"
    depends_on:
      valkey:
        condition: service_healthy

  postgres-exporter:
    logging: *observability-logging
    image: prometheuscommunity/postgres-exporter:${POSTGRES_EXPORTER_IMAGE_TAG:-v0.19.1}
    container_name: batch-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${BATCH_PLATFORM_DB_USERNAME:-batch_user}:${BATCH_PLATFORM_DB_PASSWORD:?BATCH_PLATFORM_DB_PASSWORD is required}@postgres-primary:5432/${BATCH_PLATFORM_DB_NAME:-batch_platform}?sslmode=disable"
      # 挂自定义 query 暴露锁等待指标(pg_lock_waits_*),供 BatchPostgresLockWaitStuck 告警。
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres_exporter/queries.yaml
    volumes:
      - ./deploy/docker/observability/postgres-exporter-queries.yaml:/etc/postgres_exporter/queries.yaml:ro
    networks:
      - batch-network
    ports:
      - "${OBSERVABILITY_BIND_IP:-127.0.0.1}:${POSTGRES_EXPORTER_PORT:-19187}:9187"
    depends_on:
      postgres-primary:
        condition: service_healthy

  kafka-exporter:
    logging: *observability-logging
    image: danielqsj/kafka-exporter:${KAFKA_EXPORTER_IMAGE_TAG:-v1.9.0}
    container_name: batch-kafka-exporter
    restart: unless-stopped
    command: ["--kafka.server=kafka:29092"]
    networks:
      - batch-network
    ports:
      - "${OBSERVABILITY_BIND_IP:-127.0.0.1}:${KAFKA_EXPORTER_PORT:-19308}:9308"
    depends_on:
      kafka:
        condition: service_healthy

  node-exporter:
    logging: *observability-logging
    image: prom/node-exporter:${NODE_EXPORTER_IMAGE_TAG:-v1.11.1}
    container_name: batch-node-exporter
    restart: unless-stopped
    profiles: [host-metrics]
    pid: host
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
    volumes:
      - /:/host:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    ports:
      - "${OBSERVABILITY_BIND_IP:-127.0.0.1}:${NODE_EXPORTER_PORT:-19100}:9100"
    networks:
      - batch-network

  cadvisor:
    logging: *observability-logging
    image: gcr.io/cadvisor/cadvisor:${CADVISOR_IMAGE_TAG:-v0.52.1}
    container_name: batch-cadvisor
    restart: unless-stopped
    profiles: [container-metrics]
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "${OBSERVABILITY_BIND_IP:-127.0.0.1}:${CADVISOR_PORT:-19101}:8080"
    networks:
      - batch-network

volumes:
  prometheus-data:
  loki-data:
  tempo-data:
  otel-collector-data:
  grafana-data:

secrets:
  alertmanager-bearer-token:
    file: ${BATCH_CONSOLE_ALERTMANAGER_BEARER_TOKEN_FILE:?Set BATCH_CONSOLE_ALERTMANAGER_BEARER_TOKEN_FILE to the shared bearer-token file}

networks:
  batch-network:
    name: ${COMPOSE_PROJECT_NAME:-batch-platform}_batch-network
    external: true
