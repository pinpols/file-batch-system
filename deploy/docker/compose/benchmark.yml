# 只叠加到隔离的本地容量压测栈：COMPOSE_BENCHMARK=1 ./scripts/docker/up-apps.sh
# HTTP admission、连接池、队列和等待时间只在本 Compose benchmark 中提高，避免把
# 10w 容量画像预算带入普通 local 或 production 启动。
services:
  kafka-init:
    environment:
      # 容量画像显式扩展 dispatch/direct topic，避免 broker 自动创建的 3 分区限制
      # Atomic worker 消费并发。Kafka 分区只能增加，普通 local profile 仍可用较低并发消费。
      KAFKA_PARTITIONS_DISPATCH: "24"
      # launch topic 必须先扩到 12 再启动 Trigger producer。压测脚本会核对每个分区
      # 的消息增量，避免 producer 缓存旧的 3 分区拓扑后产生虚假的控制面瓶颈。
      KAFKA_PARTITIONS_TRIGGER_LAUNCH: "12"
  orchestrator:
    environment:
      # 容量画像使用 2 个 orchestrator × 6 consumer，对齐 launch topic 的 12 个分区。
      # 单实例写 24 只会留下 12 个空闲线程，不能证明横向扩展能力。
      BATCH_TRIGGER_CONSUMER_CONCURRENCY: "6"
      BATCH_ORCHESTRATOR_PLATFORM_DB_MAX_POOL_SIZE: "50"
      # 轻任务洪峰下超过 worker 即时槽位的任务会进入 WAITING。容量画像缩短重派周期并
      # 扩大单批扫描，避免生产保守默认 100 条/10 秒主导压测尾部。
      BATCH_RESOURCE_SCHEDULER_WAITING_DISPATCH_BATCH_SIZE: "1000"
      BATCH_RESOURCE_SCHEDULER_WAITING_DISPATCH_INTERVAL_MILLIS: "1000"
      BATCH_REPLAY_DISPATCH_POLL_INTERVAL_MILLIS: ${BATCH_REPLAY_DISPATCH_POLL_INTERVAL_MILLIS:-1000}
      BATCH_REPLAY_DISPATCH_SESSION_BATCH_SIZE: ${BATCH_REPLAY_DISPATCH_SESSION_BATCH_SIZE:-20}
      BATCH_REPLAY_DISPATCH_ENTRY_BATCH_SIZE: ${BATCH_REPLAY_DISPATCH_ENTRY_BATCH_SIZE:-500}
      BATCH_REPLAY_DISPATCH_LOCK_AT_LEAST_FOR: ${BATCH_REPLAY_DISPATCH_LOCK_AT_LEAST_FOR:-PT1S}
      BATCH_REPLAY_DISPATCH_LOCK_AT_MOST_FOR: ${BATCH_REPLAY_DISPATCH_LOCK_AT_MOST_FOR:-PT30S}
      BATCH_REPLAY_DISPATCH_CLAIM_TIMEOUT_MILLIS: ${BATCH_REPLAY_DISPATCH_CLAIM_TIMEOUT_MILLIS:-300000}
  orchestrator-benchmark-replica:
    extends:
      file: deploy/docker/compose/app.yml
      service: orchestrator
    container_name: batch-orchestrator-benchmark-replica
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.app
      args:
        MODULE: batch-orchestrator
    # 第二实例只参与 Kafka consumer group 和后台调度，不暴露重复的宿主机端口。
    ports: !reset []
    volumes:
      - ./logs/current/docker:/app/logs
    environment:
      BATCH_TRIGGER_CONSUMER_CONCURRENCY: "6"
      BATCH_ORCHESTRATOR_PLATFORM_DB_MAX_POOL_SIZE: "50"
      BATCH_RESOURCE_SCHEDULER_WAITING_DISPATCH_BATCH_SIZE: "1000"
      BATCH_RESOURCE_SCHEDULER_WAITING_DISPATCH_INTERVAL_MILLIS: "1000"
      BATCH_REPLAY_DISPATCH_POLL_INTERVAL_MILLIS: ${BATCH_REPLAY_DISPATCH_POLL_INTERVAL_MILLIS:-1000}
      BATCH_REPLAY_DISPATCH_SESSION_BATCH_SIZE: ${BATCH_REPLAY_DISPATCH_SESSION_BATCH_SIZE:-20}
      BATCH_REPLAY_DISPATCH_ENTRY_BATCH_SIZE: ${BATCH_REPLAY_DISPATCH_ENTRY_BATCH_SIZE:-500}
      BATCH_REPLAY_DISPATCH_LOCK_AT_LEAST_FOR: ${BATCH_REPLAY_DISPATCH_LOCK_AT_LEAST_FOR:-PT1S}
      BATCH_REPLAY_DISPATCH_LOCK_AT_MOST_FOR: ${BATCH_REPLAY_DISPATCH_LOCK_AT_MOST_FOR:-PT30S}
      BATCH_REPLAY_DISPATCH_CLAIM_TIMEOUT_MILLIS: ${BATCH_REPLAY_DISPATCH_CLAIM_TIMEOUT_MILLIS:-300000}
      LOGGING_FILE_NAME: /app/logs/batch-orchestrator-benchmark-replica.log
  trigger:
    environment:
      SPRING_PROFILES_ACTIVE: local,benchmark
      # 200 RPS 持续入口在较小许可数下会因 PG 写入尾延迟填满 128 个等待槽。
      # 80 个入口许可配 88 条平台连接，固定保留 8 条给 relay、健康检查和管理路径。
      BATCH_TRIGGER_PLATFORM_DB_MAX_POOL_SIZE: "88"
      BATCH_TRIGGER_API_LAUNCH_MAX_CONCURRENCY: "80"
      BATCH_TRIGGER_API_LAUNCH_MIN_CONCURRENCY: "20"
      BATCH_TRIGGER_API_LAUNCH_QUEUE_CAPACITY: "128"
      BATCH_TRIGGER_API_LAUNCH_QUEUE_WAIT_MILLIS: "15000"
      BATCH_TRIGGER_API_LAUNCH_DB_RESERVE_CONNECTIONS: "8"
      # 容量画像同时提升隔离 benchmark 的 outbox 释放预算；生产默认仍为 40/s。
      BATCH_TRIGGER_OUTBOX_BATCH_SIZE: "512"
      BATCH_TRIGGER_OUTBOX_MAX_PUBLISH_EVENTS_PER_SECOND: "400"
  worker-atomic:
    mem_limit: 768m
    environment:
      # 本地容量画像没有 Kubernetes Service，显式轮转两个 Orchestrator，验证 claim、renew、report
      # 不再集中到主实例。普通 Compose 和 Helm 的单 Service 配置不受影响。
      BATCH_WORKER_TASK_CLIENT_BASE_URLS: ${BATCH_WORKER_TASK_CLIENT_BASE_URLS:-http://orchestrator:18082,http://orchestrator-benchmark-replica:18082}
      # Atomic 轻任务的实测瓶颈在 claim/report 排队而非任务执行。隔离容量画像启用已完成
      # 契约和 SIM 验证的 5 条 claim-batch，把认领 HTTP/事务往返从 O(N) 降为 O(N/5)。
      # 24 个 listener 每次仍只持有 5 条；480 是调度准入窗口，让短任务积压留在 Kafka 而
      # 不是退化到 WAITING 低频扫描。执行池按启动守卫同步设置，但 listener 实际同时提交
      # 不超过 24 条；普通 local / production 默认仍关闭 batch-claim，不继承这些实验参数。
      BATCH_WORKER_ATOMIC_KAFKA_CONCURRENCY: "24"
      BATCH_WORKER_ATOMIC_KAFKA_MAX_POLL_RECORDS: "5"
      BATCH_WORKER_BATCH_CLAIM_ENABLED: "true"
      BATCH_WORKER_BATCH_CLAIM_MAX_BATCH_SIZE: "5"
      BATCH_WORKER_ATOMIC_MAX_CONCURRENT_TASKS: "480"
      BATCH_WORKER_EXECUTION_POOL_SIZE: "480"
