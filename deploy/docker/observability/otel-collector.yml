# ============================================================
# OpenTelemetry 采集器（Collector）— batch-platform 流水线配置
#
# 数据流：
#   应用（OTLP HTTP/gRPC）→ Collector → Tempo（链路，主后端 + Grafana 内嵌查询）
#                                     → Jaeger（链路，UI 兼容）
#                                     → Loki（日志，OTLP /otlp/v1/logs）
#   指标：仍由 Prometheus 抓取（/actuator/prometheus），保持不变
#
# 本文件挂载到 Collector 容器的 /etc/otelcol/config.yaml
# ============================================================

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  pprof:
    endpoint: 0.0.0.0:1777
  file_storage:
    directory: /var/lib/otelcol/storage
    create_directory: true
    timeout: 10s

# ── 接收器（Receivers）──────────────────────────────────────────
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317   # 应用 → Collector（gRPC）
      http:
        endpoint: 0.0.0.0:4318   # 应用 → Collector（HTTP）；Spring Boot 默认走此端口

# ── 处理器（Processors）──────────────────────────────────────────
processors:
  # 内存保护：超出 384MiB 触发 GC，超出 512MiB 开始丢弃（优先丢低优先级数据）
  memory_limiter:
    limit_mib: 512
    spike_limit_mib: 128
    check_interval: 1s

  # 批量发送，降低下游写入压力
  batch:
    timeout: 5s
    send_batch_size: 1024
    send_batch_max_size: 2048

  # 为所有遥测数据注入部署环境标签
  resource:
    attributes:
      - key: deployment.environment
        value: ${env:DEPLOYMENT_ENVIRONMENT:-local}
        action: upsert
      - key: service.namespace
        value: batch-platform
        action: upsert

  # 错误和慢链路全量保留，普通成功链路采样 10%。应用端需设为 100%
  # 上报，否则在 head sampling 阶段丢弃的错误链路无法被这里挽回。
  tail_sampling:
    decision_wait: 10s
    num_traces: 50000
    expected_new_traces_per_sec: 1000
    policies:
      - name: errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: slow
        type: latency
        latency:
          threshold_ms: 5000
      - name: baseline
        type: probabilistic
        probabilistic:
          sampling_percentage: 10

  # 遥测属性是第二道脱敏防线；业务代码仍不得主动记录密钥。
  redaction:
    allow_all_keys: true
    blocked_key_patterns:
      - "(?i).*(authorization|password|passwd|secret|token|api[_-]?key|credential).*"
    summary: silent

# ── 导出器（Exporters）────────────────────────────────────────────
exporters:
  # 链路 → Tempo（OTLP gRPC 4317）；Grafana 直查 Tempo 出 service graph + span metrics
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
    sending_queue: &durable_queue
      enabled: true
      num_consumers: 8
      queue_size: 10000
      storage: file_storage
    retry_on_failure: &retry_policy
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 10m

  # 链路 → Jaeger（Jaeger 1.35+ 原生支持 OTLP gRPC 4317），保留 UI 兼容
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
    sending_queue: *durable_queue
    retry_on_failure: *retry_policy

  # 日志 → Loki（Loki 2.9+ 原生支持 OTLP HTTP /otlp/v1/logs）
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true
    sending_queue: *durable_queue
    retry_on_failure: *retry_policy

# ── 服务（Service）────────────────────────────────────────────────
service:
  extensions: [health_check, pprof, file_storage]
  telemetry:
    logs:
      level: warn
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, redaction, tail_sampling, batch]
      exporters: [otlp/tempo, otlp/jaeger]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, redaction, batch]
      exporters: [otlphttp/loki]
