# 模拟器:SFTP + MockServer,跑在主 compose 同 network 下,跟主服务联调。
#
# 启动:
#   docker compose -f docker-compose.yml -f scripts/sim/compose.yml --env-file .env.local up -d sftp mockserver
#
# 或用包装脚本(更可读):
#   bash scripts/sim/02-start-sim.sh
#
# 网络:复用主 compose 的 batch-network(由 .env.local COMPOSE_PROJECT_NAME 派生)。
# Docker 容器使用 batch-sim-* 前缀；服务网络别名仍为 sftp / mockserver，
# 与 ta/tb/tc tenant config 的 channel_config.target_endpoint 保持一致。

x-sim-runtime-env: &sim-runtime-env
  BATCH_LOCALE: ${BATCH_LOCALE:-C.UTF-8}
  LANG: ${BATCH_LOCALE:-C.UTF-8}
  LC_ALL: ${BATCH_LOCALE:-C.UTF-8}

services:
  sftp:
    image: atmoz/sftp:${SFTP_IMAGE_TAG:-alpine}
    container_name: batch-sim-sftp
    restart: unless-stopped
    environment:
      <<: *sim-runtime-env
    # 3 个 tenant 各一账号(对齐 ta/tb/tc channel_config config_json.username/password)。
    # atmoz/sftp 命令格式:user:pass:uid:gid:dir1,dir2(5 段,GID 空表 fallback)。
    # 每个账号 chroot 到 /home/<user>,业务文件投到 /home/<user>/inbound(对齐 remotePath)。
    command: >-
      ta:ta_pass_123:1001::inbound,outbound
      tb:tb_pass_123:1002::inbound,outbound
      tc:tc_pass_123:1003::inbound,outbound
    ports:
      - "${SFTP_HOST_PORT:-12222}:22"
    volumes:
      - sftp-data:/home
    networks:
      - batch-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 22 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6

  mockserver:
    image: mockserver/mockserver:${MOCKSERVER_IMAGE_TAG:-5.15.0}
    container_name: batch-sim-mockserver
    restart: unless-stopped
    environment:
      <<: *sim-runtime-env
      MOCKSERVER_LOG_LEVEL: WARN
      # 启动期载 stub(下面 volume 挂的 expectations.json)
      MOCKSERVER_INITIALIZATION_JSON_PATH: /config/expectations.json
    ports:
      - "${MOCKSERVER_HOST_PORT:-11080}:1080"
    volumes:
      - ./scripts/sim/mockserver-stubs:/config:ro
    networks:
      - batch-network
    healthcheck:
      # 镜像没有 /bin/sh，不能使用 CMD-SHELL；HTTP readiness 由 02-start-sim.sh
      # 从宿主机真实调用 /mockserver/status 负责，这里只做 JVM 存活检查。
      test: ["CMD", "java", "-version"]
      interval: 10s
      timeout: 3s
      retries: 6

volumes:
  sftp-data:
    name: batch-sim-sftp-data

networks:
  batch-network:
    external: true
    name: ${COMPOSE_PROJECT_NAME:-batch-platform}_batch-network
