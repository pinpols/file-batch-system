      properties:
        tenantId: {type: string}
        calendarCode: {type: string}
        bizDate: {type: string, format: date}
        scope:
          type: string
          enum: [ALL, ALL_FAILED, SUBSET_JOB_CODES, OUTPUTS_ONLY]
        executionMode:
          type: string
          enum: [REPLAY, DRY_RUN]
          default: REPLAY
        candidateSource:
          type: string
          enum: [EXISTING_INSTANCES, SCHEDULE_PLAN]
          default: EXISTING_INSTANCES
        jobCodes:
          type: array
          items: {type: string}
          description: SUBSET_JOB_CODES 时必填。
        versionIds:
          type: array
          items: {type: integer, format: int64}
          description: OUTPUTS_ONLY 时必填。
        resultPolicy:
          type: string
          enum: [CREATE_NEW_VERSION, KEEP_BOTH, MANUAL_CONFIRM_EFFECTIVE, DRY_RUN_ONLY]
        configVersionPolicy:
          type: string
          enum: [USE_ORIGINAL_CONFIG, USE_LATEST_CONFIG, USE_SPECIFIED_VERSION, USE_CURRENT_CONFIG, USE_SPECIFIC_VERSION]
          description: 后两个旧值仅用于入站兼容，服务端分别归一为 USE_LATEST_CONFIG、USE_SPECIFIED_VERSION
        configVersion: {type: integer, format: int32}
        reason: {type: string}
        requestedBy: {type: string}
