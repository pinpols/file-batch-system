          description: RUNNING / DRAINING / OFFLINE
        hostName:
          type: string
          nullable: true
        hostIp:
          type: string
          nullable: true
        processId:
          type: string
          nullable: true
        port:
          type: integer
          nullable: true
          description: Worker 实际监听 HTTP 端口(V221);内置 worker 上报 Spring 运行时绑定端口;缺失=老 worker / 老 SDK / 非 web 上下文
        buildId:
          type: string
          nullable: true
          description: SDK-P5-3 运行指纹:租户应用构建标识;仅 register 上报
        sdkVersion:
          type: string
          nullable: true
          description: SDK-P5-3 运行指纹:worker 链接的 batch-worker-sdk 库版本;仅 register 上报
        heartbeatAt:
          type: string
          format: date-time
        capabilityTags:
          type: array
          items:
            type: string
          description: Worker 注册时上报支持的 taskType 列表
          nullable: true
        currentLoad:
          type: integer
          description: in-flight 任务数;null/负值平台 normalize 为 0
          nullable: true
        maxConcurrent:
          type: integer
          minimum: 1
          description: Worker 本地实际执行许可上限;内置 worker 在 register 时上报。缺失时沿用平台已有值或数据库默认值
          nullable: true
        taskTypes:
          type: array
          items:
            $ref: '#/components/schemas/WorkerTaskTypeDescriptorDto'
          description: SDK Phase 3 M3.1 自定义 taskType 描述符;仅 register 上报,heartbeat 不带(null)
          nullable: true
        protocolVersion:
          type: string
          nullable: true
          description: SDK wire 协议 schema 主版本(v1/v2);仅 register 上报。缺=legacy 放行,不支持的版本(如 v3)register 拒绝(400 error.worker.unsupported_protocol_version)
        pipelineProgress:
          type: array
          nullable: true
          description: 内置 Worker 活跃任务快照；实时查询只接收认领身份及阶段执行ID匹配数据库当前有效认领的样本。空心跳不删除带身份样本，防止同名旧进程影响新认领；失租、终态立即停止投影，缓存最长保留5分钟。缺身份的旧样本不对外补值，仅观测，不代替 checkpoint。
          items:
            type: object
            properties:
              taskId:
                type: integer
                format: int64
              pipelineInstanceId:
                type: integer
                format: int64
              stageCode:
                type: string
              rowsProcessed:
                type: integer
                format: int64
              totalRowsHint:
                type: integer
                format: int64
                nullable: true
              partitionInvocationId:
                type: string
                nullable: true
                description: 执行上下文原始分区认领身份；缺失时不进入实时聚合。
              pipelineStepRunId:
                type: integer
                format: int64
                nullable: true
                description: 原始阶段执行记录ID；缺失或非当前运行尝试时不进入实时聚合。
            required:
            - taskId
            - pipelineInstanceId
            - stageCode
            - rowsProcessed
        taskCapabilities:
          type: array
          nullable: true
          description: Atomic Worker 注册时上报的执行器能力摘要；仅供 Console 运维展示，不参与调度路由；心跳不带。
          maxItems: 128
          items:
            $ref: '#/components/schemas/WorkerTaskCapabilityDto'
        replayCapabilities:
          type: array
          items:
            $ref: '#/components/schemas/ReplayCapabilityDeclaration'
          nullable: true
          maxItems: 128
          description: Worker 注册时上报的插件 Replay 能力声明；不参与普通 Worker 路由。缺失/未知或同组不一致不构成安全重放依据。
      required:
      - tenantId
      - workerCode
      - status
      - heartbeatAt

