        traceId: {type: string}
        executionMode: {type: string, enum: [REPLAY, DRY_RUN], default: REPLAY}
        candidateSource: {type: string, enum: [EXISTING_INSTANCES, SCHEDULE_PLAN], default: EXISTING_INSTANCES}
