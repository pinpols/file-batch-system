      summary: 逐项认领；仅执行 claimed=true 的项，批量只优化 HTTP 传输。
      operationId: claimTaskBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskClaimBatchRequest'
      responses:
        '200':
          description: 逐项处理结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskClaimBatchResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        5XX:
          $ref: '#/components/responses/ServerError'
  /internal/tasks/report-batch:
    x-protocol-stability: stable
    post:
      tags:
      - tasks
      summary: 逐项独立事务上报；部分失败不回滚成功项，只重报 ok=false 的项。
      operationId: reportTaskBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskReportBatchRequest'
      responses:
        '200':
          description: 逐项处理结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskReportBatchResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        5XX:
          $ref: '#/components/responses/ServerError'
  /internal/tasks/{taskId}/non-idempotent-started:
    x-protocol-stability: stable
    post:
      tags:
      - tasks
      summary: 在产生非幂等副作用前登记开始证据；未知结果的恢复不据超时自动重发。
      operationId: markTaskNonIdempotentStarted
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskNonIdempotentStartRequest'
      responses:
        '200':
          description: 开始证据已登记
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        5XX:
          $ref: '#/components/responses/ServerError'
      parameters:
      - in: path
        name: taskId
        required: true
        schema:
          type: integer
          format: int64

components:
  responses:
    Unauthorized:
      description: 凭据无效 / 缺失;BYO SDK 必须 fail-fast,不重试(对照 wire-protocol §B/§C)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Forbidden:
      description: tenantId 越权 / workerCode 不属本租户;BYO SDK 必须 fail-fast
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    NotFound:
      description: workerCode / taskId 不存在(可能被运维清掉或 lease 失效)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Conflict:
      description: 状态冲突 / 幂等冲突 / 存储对象状态不满足操作前置条件
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    ServerError:
      description: 平台侧 5xx;BYO SDK 应指数退避(200ms 基,默认 3 次)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'

  schemas:
    FileGroupExpectationConfig:
      type: object
      required: [tenantId, calendarCode, workflowDefinitionId, fileGroupCode, expectedLocalTime, enabled]
      properties:
        tenantId: {type: string, maxLength: 64}
        calendarCode: {type: string, maxLength: 128}
        workflowDefinitionId: {type: integer, format: int64}
        fileGroupCode: {type: string, maxLength: 128}
        expectedLocalTime: {type: string, format: partial-time}
        dueLocalTime: {type: string, format: partial-time, nullable: true}
        enabled: {type: boolean}
    FileGroupExpectationConfigResult:
      type: object
      required: [configured, fileGroupCode]
      properties:
        configured: {type: boolean}
        fileGroupCode: {type: string}
    ExternalEventExpectationConfig:
      type: object
      required: [tenantId, calendarCode, workflowDefinitionId, eventCode, expectedLocalTime, enabled]
      properties:
        tenantId: {type: string, maxLength: 64}
        calendarCode: {type: string, maxLength: 128}
        workflowDefinitionId: {type: integer, format: int64}
        eventCode: {type: string, maxLength: 128}
        expectedLocalTime: {type: string, format: partial-time}
        dueLocalTime: {type: string, format: partial-time, nullable: true}
        enabled: {type: boolean}
    ExternalEventExpectationSatisfaction:
      type: object
      required: [tenantId, calendarCode, workflowDefinitionId, eventCode, bizDate, triggerRequestId]
      properties:
        tenantId: {type: string, maxLength: 64}
        calendarCode: {type: string, maxLength: 128}
        workflowDefinitionId: {type: integer, format: int64}
        eventCode: {type: string, maxLength: 128}
        bizDate: {type: string, format: date}
        triggerRequestId: {type: string, maxLength: 128}
    ExpectedWorkflowFileGroupRegistration:
      type: object
      required: [tenantId, calendarCode, workflowDefinitionId, fileGroupCode, bizDate, expectedAt]
      properties:
        tenantId: {type: string, maxLength: 64}
        calendarCode: {type: string, maxLength: 128}
        workflowDefinitionId: {type: integer, format: int64}
        fileGroupCode: {type: string, maxLength: 256}
        bizDate: {type: string, format: date}
        expectedAt: {type: string, format: date-time}
        dueAt: {type: string, format: date-time, nullable: true}
    ExpectedWorkflowFileGroupRegistrationResult:
      type: object
      required: [inserted, fileGroupCode]
      properties:
        inserted: {type: boolean}
        fileGroupCode: {type: string}
    CommonResponseObject:
      type: object
      properties:
        success: {type: boolean}
        code: {type: string}
        message: {type: string}
        data:
          type: object
          additionalProperties: true
      required: [success, code, message]

