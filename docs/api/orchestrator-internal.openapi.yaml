        tenantId: {type: string}
        taskId: {type: integer, format: int64}
        workerId: {type: string}
        partitionInvocationId: {type: string, nullable: true}

    TaskLeaseRenewBatchResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TaskLeaseRenewResultPayload'

    TaskLeaseRenewResultPayload:
      type: object
      properties:
        taskId: {type: integer, format: int64}
        success: {type: boolean}
        message: {type: string, nullable: true}

    ErrorBody:
      type: object
      description: 平台统一错误回包(对应 CommonResponse 失败态;BYO SDK 用 code + message 分类)
      properties:
        code: {type: string, nullable: true, description: "业务错误码(可选)"}
        message: {type: string, nullable: true}
        traceId: {type: string, nullable: true}

    ReadinessResult:
      type: object
      description: 上游 JOB asset partition 就绪结果;ready/reason 是兼容字段,其余字段用于日志和运维 drill-down。
      properties:
        ready: {type: boolean}
        reason: {type: string, nullable: true, description: "未就绪原因码;ready=true 时为 null"}
        assetCode: {type: string, nullable: true, description: "JOB asset 编码;当前等于 jobCode"}
        bizDate: {type: string, format: date, nullable: true}
        partitionKey: {type: string, nullable: true, description: "JOB 类型第一阶段为 bizDate ISO 字符串"}
        businessKey: {type: string, nullable: true, description: "result_version.business_key"}
        freshnessStatus: {type: string, nullable: true, description: "当前只返回 EFFECTIVE 或 null"}
        versionNo: {type: integer, nullable: true, description: "当前 EFFECTIVE result_version.version_no"}
        jobInstanceId: {type: integer, format: int64, nullable: true}
        payloadStorage: {type: string, nullable: true}
        payloadRef: {type: string, nullable: true}
      required: [ready]

    TaskHeartbeatRequest:
      type: object
      description: renew 请求体(ORCH-P4-1);旧版仅 tenantId/workerId/partitionInvocationId,新增可选 details(进度 / checkpoint 快照,严禁放敏感凭据)
      properties:
        tenantId: {type: string}
        workerId: {type: string}
        partitionInvocationId: {type: string, nullable: true}
        details:
          type: object
          additionalProperties: true
          nullable: true
          description: "进度与检查点 JSON，禁止包含凭据。保留字段 executionStarted 仅接受布尔 true：执行线程进入适配器前，携带当前 workerId 和 partitionInvocationId 确认首次执行入口；取消或租约失效时不得进入业务。该信号不替代非幂等副作用开始标记。"
          properties:
            executionStarted:
              type: boolean
              description: "仅在执行线程即将进入业务适配器时提交 true；认领、派发、执行池排队和普通续租均不得提前提交。"
      required: [tenantId, workerId]

    TaskHeartbeatResponse:
      type: object
      description: renew 响应体;BYO SDK 必须解析 cancelRequested(true 时通过 CancellationSignal 等价机制中止 handler)
      properties:
        cancelRequested:
          type: boolean
          description: "平台已请求取消本 task;BYO SDK 必须在 handler 长循环中检测并主动停"
      required: [cancelRequested]

    TaskCancelRequest:
      type: object
      properties:
        tenantId: {type: string}
        reason: {type: string, nullable: true, description: "审计 / 日志用"}
      required: [tenantId]

    WorkerDrainRequest:
      type: object
      properties:
        tenantId: {type: string}
        timeoutSeconds: {type: integer, nullable: true, description: "drain 超时上限(秒);null=平台默认"}
      required: [tenantId]

    WorkerTenantRequest:
      type: object
      properties:
        tenantId: {type: string}
      required: [tenantId]

    FileUploadRequest:
      type: object
      properties:
        tenantId: {type: string}
        channelCode: {type: string}
        fileName: {type: string}
        operatorId: {type: string, nullable: true}
        traceId: {type: string, nullable: true}
      required: [tenantId, channelCode, fileName]

    FileUploadSessionResponse:
      type: object
      properties:
        fileId: {type: integer, format: int64}
        status: {type: string, description: "当前返回 RECEIVED"}
        uploadMode: {type: string, description: "当前返回 APP_MANAGED"}
        uploadMethod: {type: string, description: "当前返回 PUT"}
        contentField: {type: string, description: "multipart 字段名,当前为 file"}
        uploadUrl: {type: string, description: "console-api 相对路径"}
        storageBucket: {type: string, nullable: true}
        storagePath: {type: string}
        fileName: {type: string}
      required: [fileId, status, uploadMode, uploadMethod, contentField, uploadUrl, storagePath, fileName]

    FileOperationRequest:
      type: object
      properties:
        tenantId: {type: string}
        operatorId: {type: string, nullable: true}
        reason: {type: string, nullable: true}
        traceId: {type: string, nullable: true}
      required: [tenantId]

    FileOperationResponse:
      type: object
      properties:
        status: {type: string}
      required: [status]

    TaskDispatchMessage:
      type: object
      description: >
        Kafka 派单消息(平台 producer → SDK consumer)。Phase 0 起携带 schemaVersion(默认 "v1",当前
        平台发 "v2");SDK 收到未知 major(非 v1/v2) 直接 reject 防错乱。
      properties:
        schemaVersion:
          type: string
          description: "v1 / v2 / v2-rc;缺字段当 v1 解析"
          default: "v1"
        tenantId: {type: string}
        jobInstanceId: {type: integer, format: int64, nullable: true}
        jobPartitionId: {type: integer, format: int64, nullable: true}
        taskId: {type: integer, format: int64}
        instanceNo: {type: string, nullable: true}
        jobCode: {type: string}
        workerType: {type: string, description: "等同 task_type;消费端按此过滤"}
        selectedWorkerId: {type: string, nullable: true, description: "非空走 direct dispatch topic"}
        priorityBand: {type: string, description: "HIGH / MEDIUM / LOW"}
        traceId: {type: string, nullable: true}
        idempotencyKey: {type: string}
        dispatchAt: {type: string, format: date-time}
      required: [tenantId, taskId, jobCode, workerType, idempotencyKey, dispatchAt]

    ReplayCapabilityDeclaration:
      type: object
      properties:
        pluginId:
          type: string
        pluginVersion:
          type: string
        externalEffectCategories:
          type: array
          items:
            type: string
        idempotencyCapability:
          type: string
          enum:
          - IDEMPOTENT_BY_UNIQUE_CONSTRAINT
          - IDEMPOTENT_BY_PLUGIN_LOGIC
          - NONE
          - UNKNOWN
        idempotencyKeyScope:
          type: string
        recoveryProtocolId:
          type: string
        contractVersion:
          type: integer
          format: int32
          enum:
          - 1
      required:
      - pluginId
      - pluginVersion
      - externalEffectCategories
      - idempotencyCapability
      - idempotencyKeyScope
      - recoveryProtocolId
      - contractVersion
      description: 插件版本、外部副作用类别、幂等及恢复协议声明；UNKNOWN/NONE不能授权安全重放。

    ReplayExecutionGuard:
      type: object
      properties:
        replayOperationId:
          type: integer
          format: int64
          minimum: 1
        declaration:
          $ref: '#/components/schemas/ReplayCapabilityDeclaration'
      required:
      - replayOperationId
      - declaration
      description: 执行前核对实际插件配置与已批准的能力声明；不一致时禁止产生副作用。

    TaskClaimItemPayload:
      type: object
      properties:
        tenantId:
          type: string
        taskId:
          type: integer
          format: int64
        workerId:
          type: string
        partitionInvocationId:
          type: string
          nullable: true

    TaskClaimBatchRequest:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TaskClaimItemPayload'

    TaskClaimResultPayload:
      type: object
      properties:
        taskId:
          type: integer
          format: int64
        claimed:
          type: boolean
        config:
          $ref: '#/components/schemas/EffectiveTaskConfig'
          description: 只有 claimed=true 的项可执行；未认领时无可执行配置。

    TaskClaimBatchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/TaskClaimResultPayload'

    TaskReportBatchRequest:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TaskExecutionReportDto'

    TaskReportResultPayload:
      type: object
      properties:
        taskId:
          type: integer
          format: int64
        ok:
          type: boolean
        error:
          type: string
          nullable: true

    TaskReportBatchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/TaskReportResultPayload'

    TaskNonIdempotentStartRequest:
      type: object
      properties:
        tenantId:
          type: string
        workerId:
          type: string
        partitionInvocationId:
          type: string
          nullable: true
      description: 非幂等执行器调用外部副作用前，按租户、Worker和当前invocation登记开始证据；不是任意任务跳过围栏的入口。
