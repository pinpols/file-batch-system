openapi: 3.1.0
info:
  title: Orchestrator Internal API (SDK ↔ Orch protocol)
  version: 1.0.0
  x-last-updated: "2026-10-24"
  x-changelog:
    - date: "2026-10-24"
      summary: "按当前 Controller/DTO 补录批量 claim/report、非幂等开始标记、完整 EffectiveTaskConfig、Replay 能力/执行围栏与整图预览凭证；仅修正文档，不新增运行接口。"
    - date: "2026-10-23"
      summary: "[ADR-049] 整 Workflow 只读预览返回完整冻结图、逐节点配置版本、Worker 插件声明及阻塞原因；暂不签发提交凭证。"
    - date: "2026-10-04"
      summary: "[Pipeline Progress] 心跳增加可选任务级 pipelineProgress；仅保留按 pipeline 查询进度；移除 workerCode 查询与 Java/Python SDK 标量上报。"
    - date: "2026-10-13"
      summary: "内部 HTTP 响应改用独立 Response DTO，保持历史 JSON 字段；补齐 Worker 与 Console BFF 实际消费端点契约。"
    - date: "2026-10-15"
      summary: "文件组与外部事件预期、逐日文件预期登记改用 workflowDefinitionId，统一每日义务归属。"
    - date: "2026-06-30"
      summary: "[Batch Day Replay] 登记 /internal/orchestrator/batch-day-replay/sessions 与 /sessions/preview,供 Console BFF 提交和只读影响预览。"
    - date: "2026-06-30"
      summary: "[Readiness] 登记 /internal/readiness/job,响应在 ready/reason 兼容字段之外追加 asset partition 与 result_version 明细。"
    - date: "2026-06-09"
      summary: "[File Governance] 补充 APP_MANAGED 上传会话与确认到达 internal-only 端点,供 console BFF 走对象存储托管上传。"
    - date: "2026-06-02"
      summary: "[Lane N] 补全 worker drain/force-offline/takeover/warmup/claimed-tasks 与 tasks/cancel 端点;每端点加 401/404/409/5xx error responses;顶层 paths 加 x-protocol-stability 标注(stable / beta / internal-only),作为 BYO SDK 实现门禁;version 跟根 pom revision。"
    - date: "2026-05-31"
      summary: "[Phase 0] 初版立 yaml(plan §2 决策 #2)。覆盖 /internal/workers/* 和 /internal/tasks/* 给 SDK / 准客户消费;不含管理面 console-api 路径(见 console-api.openapi.yaml)。"
  description: >
    Orchestrator `/internal/*` 协议的精选契约：包括 self-hosted SDK/worker、Trigger，以及 Console BFF
    实际调用的内部路径；不是全部 internal controller 的镜像。SDK wire DTOs
    (`io.github.pinpols.batch.sdk.wire.*`) 的字段演进仍走 `docs/runbook/sdk-dual-rollout.md` 双向滚动纪律。

    Console 面向前端的 `/api/console/**` 契约仍以 `console-api.openapi.yaml` 为准。本文件列出的 Console BFF
    上游路径用于同步其实际调用的 Orchestrator 响应 DTO；内部契约漂移检查见
    `orchestrator-internal-openapi-sync.md`。

servers:
  - url: http://orchestrator-internal:8081
    description: 内部网络 only(不走 ingress)

tags:
  - name: workers
    description: Worker 注册 / 心跳 / 下线 / 状态管理(`WorkerController`)
  - name: tasks
    description: 任务认领 / 上报 / 续租(`TaskController`)
  - name: file-governance
    description: Console BFF 调用的内部文件治理接口(`FileGovernanceController`)
  - name: readiness
    description: Trigger 调用的上游 asset partition 就绪查询(`OrchestratorReadinessController`)
  - name: batch-day-replay
    description: Console BFF 调用的批次日重放内部接口(`BatchDayReplayController`)
  - name: workflow-replay
    description: 历史 Workflow 完整图及重放证据预览；不属于 Worker HTTP 协议
  - name: batch-day-obligations
    description: Workflow 归属的文件/事件输入义务及逐日登记
  - name: console-bff
    description: Console BFF 实际调用的内部查询与治理接口；不是 BYO Worker SDK 的接入清单

paths:
  /internal/file-group-expectations:
    x-protocol-stability: internal-only
    put:
      tags: [batch-day-obligations]
      summary: 配置 Workflow 的每日文件组预期
      operationId: configureFileGroupExpectation
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FileGroupExpectationConfig'}
      responses:
        '200':
          description: 配置结果
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FileGroupExpectationConfigResult'}
        '422': {description: Workflow 不存在、未启用或日历不匹配}
        '5XX': {$ref: '#/components/responses/ServerError'}

  /internal/event-expectations:
    x-protocol-stability: internal-only
    put:
      tags: [batch-day-obligations]
      summary: 配置 Workflow 的每日外部事件预期
      operationId: configureExternalEventExpectation
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExternalEventExpectationConfig'}
      responses:
        '200': {description: 返回新增或更新的记录数, content: {application/json: {schema: {type: integer}}}}
        '422': {description: Workflow 不存在、未启用或日历不匹配}
        '5XX': {$ref: '#/components/responses/ServerError'}
  /internal/event-expectations/satisfied:
    x-protocol-stability: internal-only
    post:
      tags: [batch-day-obligations]
      summary: 由已启动的 Workflow EVENT 请求结清输入预期
      operationId: satisfyExternalEventExpectation
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExternalEventExpectationSatisfaction'}
      responses:
        '200': {description: 是否完成状态转换, content: {application/json: {schema: {type: boolean}}}}
        '409': {description: 关联请求未启动或事件/Workflow/业务日不匹配}
        '422': {description: Workflow 不存在、未启用或日历不匹配}
        '5XX': {$ref: '#/components/responses/ServerError'}

  /internal/expected-work-occurrences/file-groups:
    x-protocol-stability: internal-only
    post:
      tags: [batch-day-obligations]
      summary: 到达前幂等登记 Workflow 的文件组预期
      operationId: registerExpectedWorkflowFileGroup
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExpectedWorkflowFileGroupRegistration'}
      responses:
        '200':
          description: 幂等登记结果
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExpectedWorkflowFileGroupRegistrationResult'}
        '422': {description: Workflow 不存在、未启用或日历不匹配}
        '5XX': {$ref: '#/components/responses/ServerError'}

  /internal/pipeline-progress/by-pipeline:
    x-protocol-stability: internal-only
    get:
      tags: [workers]
      summary: 按 pipeline 聚合节点本地实时阶段进度
      operationId: queryPipelineStageProgress
      description: 仅用于展示，不用于续跑或业务终态判定；同一阶段的当前活跃分片合计。多 Orchestrator 节点之间不共享缓存。
      parameters:
        - in: query
          name: tenantId
          required: true
          schema: {type: string}
        - in: query
          name: pipelineInstanceId
          required: true
          schema: {type: integer, format: int64}
      responses:
        '200':
          description: 活跃阶段进度，TTL 五分钟
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    stageCode: {type: string}
                    rowsProcessed: {type: integer, format: int64}
                    totalRowsHint: {type: integer, format: int64, nullable: true}
                    heartbeatAt: {type: string, format: date-time}
                    stepRunIds:
                      type: array
                      items: {type: integer, format: int64}
                      description: 本次聚合实际采用的阶段执行ID；Console仅在包含自身持久步骤ID时补值。
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '5XX': {$ref: '#/components/responses/ServerError'}

  # ─── x-protocol-stability 含义 ────────────────────────────────────────────────
  # stable        : BYO SDK 必须实现;字段语义冻结,只能加 nullable optional 字段
  # beta          : BYO SDK 可选实现;字段集仍可能演进(走 sdk-dual-rollout 双轨)
  # internal-only : 平台运维 / Java SDK 内部用,不要求 BYO SDK 实现
  # ─────────────────────────────────────────────────────────────────────────────
  /internal/workers/register:
    x-protocol-stability: stable
    post:
      tags: [workers]
      summary: Worker 注册(idempotent on workerCode)
      operationId: registerWorker
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerHeartbeatDto'
      responses:
        '200':
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerRegistryResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '5XX': {$ref: '#/components/responses/ServerError'}

  /internal/workers/{workerCode}/heartbeat:
    x-protocol-stability: stable
    post:
      tags: [workers]
      summary: Worker 周期心跳(默认 30s 一次)
      operationId: workerHeartbeat
      parameters:
        - in: path
          name: workerCode
          required: true
          schema: {type: string}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerHeartbeatDto'
      responses:
        '200':
          description: 心跳成功,回包为 platform directive(SDK Phase 2 §2.3)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerHeartbeatResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '5XX': {$ref: '#/components/responses/ServerError'}

  /internal/workers/{workerCode}/deactivate:
    x-protocol-stability: stable
    post:
      tags: [workers]
      summary: Worker 主动下线(优雅停)
      operationId: deactivateWorker
      parameters:
        - in: path
          name: workerCode
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerHeartbeatDto'
      responses:
        '200': {description: 下线成功}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '5XX': {$ref: '#/components/responses/ServerError'}

  /internal/workers/{workerCode}/status:
    x-protocol-stability: internal-only
    post:
      tags: [workers]
      summary: 更新 worker status(平台运维用)
      operationId: updateWorkerStatus
      parameters:
        - in: path
          name: workerCode
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerHeartbeatDto'
      responses:
        '200':
          description: 状态更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerRegistryResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '5XX': {$ref: '#/components/responses/ServerError'}

  /internal/workers/{workerCode}/drain:
    x-protocol-stability: internal-only
    post:
      tags: [workers]
      summary: 平台运维触发 worker 优雅排空(WorkerDrainGovernanceService)
      operationId: drainWorker
      parameters:
        - in: path
          name: workerCode
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerDrainRequest'
      responses:
        '200':
          description: 已置 DRAINING
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerRegistryResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '5XX': {$ref: '#/components/responses/ServerError'}

  /internal/workers/{workerCode}/force-offline:
    x-protocol-stability: internal-only
    post:
      tags: [workers]
      summary: 平台运维强制下线(不等 drain)
      operationId: forceOfflineWorker
      parameters:
        - in: path
          name: workerCode
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerTenantRequest'
      responses:
        '200':
          description: 已置 OFFLINE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerRegistryResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '5XX': {$ref: '#/components/responses/ServerError'}

  /internal/workers/{workerCode}/takeover:
    x-protocol-stability: internal-only
    post:
      tags: [workers]
      summary: 平台运维接管 worker(把 OFFLINE 拉回认领)
      operationId: takeoverWorker
      parameters:
        - in: path
          name: workerCode
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerTenantRequest'
      responses:
        '200':
          description: 接管成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerRegistryResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '5XX': {$ref: '#/components/responses/ServerError'}

  /internal/workers/{workerCode}/warmup:
    x-protocol-stability: internal-only
    post:
      tags: [workers]
      summary: 平台运维热身(DRAINING → RUNNING 撤销)
      operationId: warmupWorker
      parameters:
        - in: path
          name: workerCode
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerTenantRequest'
      responses:
        '200':
          description: 已回滚至 RUNNING
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerRegistryResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '5XX': {$ref: '#/components/responses/ServerError'}

  /internal/workers/{workerCode}/claimed-tasks:
    x-protocol-stability: internal-only
    get:
      tags: [workers]
      summary: 查询 worker 当前持有的 claim(运维查活,非 SDK 接入路径)
      operationId: listClaimedTasks
      parameters:
        - in: path
          name: workerCode
          required: true
          schema: {type: string}
        - in: query
          name: tenantId
          required: true
          schema: {type: string}
      responses:
        '200':
          description: claim 列表(JobTaskResponse 字段集)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobTaskResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '5XX': {$ref: '#/components/responses/ServerError'}

  /internal/tasks/{taskId}/claim:
    x-protocol-stability: stable
    post:
      tags: [tasks]
      summary: 认领任务(返回 EffectiveTaskConfig)
      operationId: claimTask
      parameters:
        - in: path
          name: taskId
          required: true
          schema: {type: integer, format: int64}
        - in: header
          name: Idempotency-Key
          required: false
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskClaimRequest'
      responses:
        '200':
          description: 认领成功;body 为 EffectiveTaskConfig（任务身份与实例冻结执行配置）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectiveTaskConfig'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: 任务已被其他 worker 认领(BYO SDK 必须当幂等成功处理,不报告失败)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '5XX': {$ref: '#/components/responses/ServerError'}

  /internal/tasks/{taskId}/report:
    x-protocol-stability: stable
    post:
      tags: [tasks]
      summary: 上报任务执行结果
      operationId: reportTask
      parameters:
        - in: path
          name: taskId
          required: true
          schema: {type: integer, format: int64}
        - in: header
          name: Idempotency-Key
          required: false
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskExecutionReportDto'
      responses:
        '200': {description: 上报成功}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: lease 已失效 / task 被回收;BYO SDK 应放弃报告,log warn 即可
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '5XX': {$ref: '#/components/responses/ServerError'}

  /internal/tasks/{taskId}/renew:
    x-protocol-stability: stable
    post:
      tags: [tasks]
      summary: lease 续约 + 进度上报 + cancel 感知(ORCH-P4-1)
      operationId: renewTaskLease
      parameters:
        - in: path
          name: taskId
          required: true
          schema: {type: integer, format: int64}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskHeartbeatRequest'
      responses:
        '200':
          description: 续租成功;cancelRequested=true 时 BYO SDK 应通过 CancellationSignal 中止 handler
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskHeartbeatResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: lease 已被回收(orch 视为僵尸 claim);BYO SDK 应停 handler 并放弃 report
        '5XX': {$ref: '#/components/responses/ServerError'}

  /internal/tasks/{taskId}/cancel:
    x-protocol-stability: internal-only
    post:
      tags: [tasks]
      summary: 运维 / 平台请求取消 RUNNING task(ORCH-P4-1)
      description: >
        被 console-api 或 timeout scheduler 调;BYO SDK 不主动调本端点,而是通过 renew 响应里的
        cancelRequested 标志感知。本端点幂等。
      operationId: cancelTask
      parameters:
        - in: path
          name: taskId
          required: true
          schema: {type: integer, format: int64}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCancelRequest'
      responses:
        '200': {description: 已置 cancel_requested=true(或重复调,语义幂等)}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '5XX': {$ref: '#/components/responses/ServerError'}

  /internal/tasks/leases/renew-batch:
    x-protocol-stability: stable
    post:
      tags: [tasks]
      summary: 批量续租(ADR-016)
      operationId: renewTaskLeaseBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskLeaseRenewBatchRequest'
      responses:
        '200':
          description: 批量续租结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskLeaseRenewBatchResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '5XX': {$ref: '#/components/responses/ServerError'}

  /internal/files/presign-upload:
    x-protocol-stability: internal-only
    post:
      tags: [file-governance]
      summary: 创建 APP_MANAGED 文件上传会话
      description: >
        Console BFF 用该端点创建对象存储托管的 file_record,返回 console 侧 PUT 上传 URL。
        不是 BYO SDK 协议面。
      operationId: createFileUploadSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileUploadRequest'
      responses:
        '200':
          description: 上传会话创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUploadSessionResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '5XX': {$ref: '#/components/responses/ServerError'}

  /internal/files/{fileId}/confirm-arrival:
    x-protocol-stability: internal-only
    post:
      tags: [file-governance]
      summary: 确认文件内容已到达对象存储
      description: >
        Console BFF 上传内容后调用;orchestrator 校验对象存在、回填 size 与 arrival metadata,
        并追加文件审计。
      operationId: confirmFileArrival
      parameters:
        - in: path
          name: fileId
          required: true
          schema: {type: integer, format: int64}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileOperationRequest'
      responses:
        '200':
          description: 确认成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileOperationResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '5XX': {$ref: '#/components/responses/ServerError'}

  /internal/readiness/job:
    x-protocol-stability: internal-only
    get:
      tags: [readiness]
      summary: 查上游 JOB 在指定 bizDate 的 asset partition 是否已 EFFECTIVE
      operationId: checkJobReadiness
      parameters:
        - in: query
          name: tenantId
          required: true
          schema: {type: string}
        - in: query
          name: jobCode
          required: true
          schema: {type: string}
        - in: query
          name: bizDate
          required: true
          schema: {type: string, format: date}
      responses:
        '200':
          description: 就绪查询结果;trigger 只要求解析 ready/reason,其它字段为运维定位明细
          content:
