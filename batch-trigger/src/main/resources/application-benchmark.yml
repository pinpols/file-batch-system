# 仅用于本地或隔离压测环境；必须与 local 一起显式启用：local,benchmark。
# 不允许将本文件的容量数据复制到 application-local.yml、.env.local 或 Helm 默认值。
spring:
  config:
    activate:
      on-profile: benchmark
  datasource:
    hikari:
      # 入口执行 32，保留 8 条给 outbox relay、健康检查和管理操作。
      maximum-pool-size: ${BATCH_TRIGGER_PLATFORM_DB_MAX_POOL_SIZE:40}
      connection-timeout: ${BATCH_TRIGGER_PLATFORM_DB_CONNECTION_TIMEOUT_MS:5000}

batch:
  trigger:
    runtime:
      api-launch-max-concurrency: ${BATCH_TRIGGER_API_LAUNCH_MAX_CONCURRENCY:32}
      api-launch-adaptive-enabled: ${BATCH_TRIGGER_API_LAUNCH_ADAPTIVE_ENABLED:false}
      api-launch-min-concurrency: ${BATCH_TRIGGER_API_LAUNCH_MIN_CONCURRENCY:8}
      api-launch-slow-request-threshold-millis: ${BATCH_TRIGGER_API_LAUNCH_SLOW_REQUEST_THRESHOLD_MILLIS:1000}
      # 128 个请求有界等待。100k/40 RPS 的短暂下游抖动可达约 11 秒，因此预算为 15 秒。
      api-launch-queue-capacity: ${BATCH_TRIGGER_API_LAUNCH_QUEUE_CAPACITY:128}
      api-launch-queue-wait-millis: ${BATCH_TRIGGER_API_LAUNCH_QUEUE_WAIT_MILLIS:15000}
      api-launch-db-reserve-connections: ${BATCH_TRIGGER_API_LAUNCH_DB_RESERVE_CONNECTIONS:8}
