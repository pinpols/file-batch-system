server:
  # Trigger 服务端口：优先读取环境变量 BATCH_TRIGGER_PORT
  port: ${BATCH_TRIGGER_PORT:18081}

spring:
  application:
    # Spring 应用名（用于日志/链路追踪/注册等）
    name: batch-trigger
  datasource:
    hikari:
      # Trigger 的 HTTP 接收与 outbox relay 使用此平台业务连接池。
      # Quartz JobStore 使用下方声明的独立小池，但二者仍连接同一平台 PostgreSQL。
      # 默认 10 保持 Spring Boot 基线；生产扩容必须结合实例数和 PostgreSQL 连接预算调整，
      # 不能只提高 API admission 上限而让请求长时间排在隐式默认池前。
      maximum-pool-size: ${BATCH_TRIGGER_PLATFORM_DB_MAX_POOL_SIZE:10}
      connection-timeout: ${BATCH_TRIGGER_PLATFORM_DB_CONNECTION_TIMEOUT_MS:5000}
      # Hikari 的初始化 SQL 放在公共 pg-session SQL 之后，保护 HTTP/outbox 的业务事务。
      # Quartz 元数据事务由 JobStoreTX 自己管理，不继承此业务池的 10 分钟超时。
      connection-init-sql: "SET idle_in_transaction_session_timeout TO ${BATCH_PG_TRIGGER_IDLE_IN_TX_TIMEOUT_MS:600000}"
  config:
    # noinspection SpringBootApplicationYaml
    # 资源来自 batch-common 依赖；Qodana 的单模块索引无法解析依赖 JAR 的 classpath 资源。
    # 引入共享默认配置基线（来自 batch-common 的 resources）
    import: "classpath:batch-defaults.yml"
  autoconfigure:
    # trigger 仅做调度触发（fire → orchestrator launch），不使用对象存储。
    # 排除 batch-common 的 S3/storage 自动配置，避免构建无用的 S3Client——
    # AWS SDK v2 的 AwsBasicCredentials 构造即校验 secret 非空，缺凭据会导致启动失败。
    exclude:
      - io.github.pinpols.batch.common.config.S3AutoConfiguration
      - io.github.pinpols.batch.common.config.BatchObjectStoreAutoConfiguration
  quartz:
    # Quartz 调度器配置（使用 JDBC JobStore，支持集群）
    job-store-type: jdbc
    jdbc:
      # 不自动建表：由 Flyway 迁移统一管理
      initialize-schema: never
    properties:
      org:
        quartz:
          scheduler:
            # 调度器实例名（便于识别）
            instanceName: BatchTriggerScheduler
          jobStore:
            # Spring LocalDataSourceJobStore 在当前 JDBC/Hikari 组合下会留下空闲事务，
            # 导致下一轮 QRTZ_LOCKS 获取被自己阻塞。固定使用 Quartz 自己管理提交/回滚的 JobStoreTX；
            # 仍连接同一平台库，不是已废弃的“独立 Quartz 数据库”方案。
            class: org.quartz.impl.jdbcjobstore.JobStoreTX
            dataSource: quartzJobstoreDs
            # Quartz 表前缀（这里在 quartz schema 下）
            tablePrefix: quartz.QRTZ_
            # PostgreSQL 方言
            driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
            # 集群模式：多实例共同抢占/执行触发任务
            isClustered: true
          dataSource:
            quartzJobstoreDs:
              driver: org.postgresql.Driver
              provider: hikaricp
              URL: ${spring.datasource.url}
              user: ${spring.datasource.username}
              password: ${spring.datasource.password}
              # Quartz 元数据只需短事务；此池不承载 Job 执行业务 SQL。
              maxConnections: ${BATCH_TRIGGER_QUARTZ_DB_MAX_POOL_SIZE:5}
  flyway:
    # 迁移脚本：与 orchestrator 同源（POM 复制其 db/migration 至 classpath:db/migration）
    enabled: true
    locations: classpath:db/migration
    # 默认 schema
    default-schema: batch
    # 需要管理的 schema 列表
    schemas:
      - batch
      - quartz
    # 与 orchestrator 同源：docker init 预置空 batch + quartz schema，必须 baseline-on-migrate=true
    # 才能在 trigger 与 orchestrator 并行启动时不抢着抛 "non-empty schema but no history table"。
    baseline-on-migrate: true
    baseline-version: 1
    postgresql:
      # V198 使用 CREATE INDEX CONCURRENTLY；PG 事务级 advisory lock 会持有旧快照并让并发建索引等待自身。
      # 改为 session lock 仍保持多实例迁移互斥，同时允许非事务性索引迁移完成。
      transactional-lock: false

batch:
  # 注：batch.security.internal-secret 已抽到 batch-defaults.yml 统一管理
  datasource:
    pg-session:
      platform:
        # Trigger 的 HTTP/outbox 业务事务沿用全局平台池 60s 会被 PostgreSQL 提前终止时，
        # 单独放宽至 10 分钟；Quartz 元数据事务已由独立 JobStoreTX 小池管理。
        idle-in-transaction-timeout: ${BATCH_PG_TRIGGER_IDLE_IN_TX_TIMEOUT:10m}
  startup-self-check:
    enabled: true
    context-name: trigger
    flyway-validate: false
    schemas:
      - quartz
    quartz-standard-tables: true
    quartz-schema: quartz
  trigger:
    # Quartz JobStore 与业务表共用同一 PG 实例、不同 schema，但使用独立 JobStoreTX 小池。
    runtime:
      # misfire 追赶阈值（秒）：当触发错过时间超过该阈值时进行 catch-up
      misfire-catch-up-threshold-seconds: ${BATCH_TRIGGER_MISFIRE_CATCH_UP_THRESHOLD_SECONDS:60}
      # 上游未就绪时使用 Quartz one-shot trigger 重检，期间固定原始 fire 时间，避免 bizDate 漂移。
      readiness-window-seconds: ${BATCH_TRIGGER_READINESS_WINDOW_SECONDS:7200}
      readiness-recheck-interval-seconds: ${BATCH_TRIGGER_READINESS_RECHECK_INTERVAL_SECONDS:30}
      # 手工 API launch 的本实例并发闸门；超过后立即返回 429，避免请求堆积到 Servlet 线程和连接池。
      api-launch-max-concurrency: ${BATCH_TRIGGER_API_LAUNCH_MAX_CONCURRENCY:64}
      # 可选 AIMD 准入：慢请求时收缩并发、正常请求逐步恢复。默认关闭，先用指标和压测确定阈值再启用。
      api-launch-adaptive-enabled: ${BATCH_TRIGGER_API_LAUNCH_ADAPTIVE_ENABLED:false}
      api-launch-min-concurrency: ${BATCH_TRIGGER_API_LAUNCH_MIN_CONCURRENCY:16}
      api-launch-slow-request-threshold-millis: ${BATCH_TRIGGER_API_LAUNCH_SLOW_REQUEST_THRESHOLD_MILLIS:1000}
    outbox:
      # 同批事件先异步发往 Kafka，再一次性回写 PUBLISHED；保持有界，避免 Kafka 故障时过多行停在 PUBLISHING。
      poll-interval-millis: ${BATCH_TRIGGER_OUTBOX_POLL_INTERVAL_MILLIS:200}
      batch-size: ${BATCH_TRIGGER_OUTBOX_BATCH_SIZE:256}
      publishing-timeout-seconds: ${BATCH_TRIGGER_OUTBOX_PUBLISHING_TIMEOUT_SECONDS:120}
      max-publish-attempts: ${BATCH_TRIGGER_OUTBOX_MAX_PUBLISH_ATTEMPTS:10}
      # 入口突发先可靠地积压在 outbox；按单进程已验证的持续执行能力限速释放，避免压垮 orchestrator / worker / PG。
      # 当前计数在 JVM 内存；Helm 默认单 Trigger 副本，扩副本前必须下调每副本值或改为共享预算。
      max-publish-events-per-second: ${BATCH_TRIGGER_OUTBOX_MAX_PUBLISH_EVENTS_PER_SECOND:40}
