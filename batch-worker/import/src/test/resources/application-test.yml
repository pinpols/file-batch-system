spring:
  config:
    import: classpath:batch-test-defaults.yml
  flyway:
    locations: classpath:db/migration

batch:
  rls:
    startup-fail-fast: false
  worker:
    graceful-shutdown:
      timeout-seconds: 1
    import:
      heartbeat-interval-millis: 600000
      scanner:
        enabled: false
        poll-interval-millis: 600000
