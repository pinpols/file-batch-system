[package]
name = "batch-worker-sdk"
version = "1.1.0"
edition = "2021"
# 核心 crate(默认 feature、零运行时依赖)的最低支持 Rust 版本。当前 HTTP/Kafka
# 当前锁定的可选依赖树要求 Rust 1.88+，生产适配器 CI 因此使用 stable；详见 README。
rust-version = "1.75"
description = "BYO worker SDK decision core + conformance runner (Rust reference impl)"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/pinpols/file-batch-system"
homepage = "https://github.com/pinpols/file-batch-system/tree/main/sdk/rust"
keywords = ["batch", "worker", "sdk", "kafka", "conformance"]
categories = ["api-bindings"]
# Keep the publishable crate lean: tests/ are conformance harnesses that read
# repo-relative fixtures and are not needed by downstream crates.
exclude = ["tests/"]

[lib]
name = "batch_worker_sdk"
path = "src/lib.rs"

# 默认构建保持运行时逻辑轻量:决策核心、契约 runner、常量对齐测试和最小 JSON / YAML 解析器
# 仍不依赖框架；仅直接引入 `getrandom` 用于生成安全的幂等键和签名 nonce。HTTP/Kafka
# 生产适配器继续通过 feature gate 启用。
[features]
# ADR-037 checkpoint 类型(`SdkCheckpointState`、`JsonValue`)的 serde derive 为显式 opt-in。
# 默认关闭,核心构建不直接依赖 serde；`kafka`/`http` 会传递启用。启用后 `JsonValue`
# 以普通 JSON 往返,与 Java `Map<String,Object>` 断点位置线协议兼容。
serde = ["dep:serde", "dep:serde_json"]
# Real Kafka consumer adapter (rdkafka). Off by default → default build stays
# std-only and the phase-1/2 tests are unaffected. Pulls the lightweight `log`
# facade so the adapter emits real warn/error records (withheld / dropped /
# poison / handler-panic messages) instead of silently skipping them.
kafka = ["dep:rdkafka", "dep:log", "serde", "dep:serde_json"]
# Real blocking control-plane HTTP transport (reqwest). Off by default → the
# core crate stays dependency-light. `rustls-tls` avoids OpenSSL; `serde` +
# `serde_json` are pulled for ergonomic JSON (de)serialize with ignore-unknown.
http = ["dep:reqwest", "serde", "dep:serde_json"]

[dependencies]
# All optional + behind a feature. `default-features = true` on rdkafka keeps
# the upstream runtime defaults; `cmake-build` avoids librdkafka's legacy
# configure/make path misdetecting Apple Silicon as x86_64.
rdkafka = { version = "0.36", optional = true, default-features = true, features = ["cmake-build"] }
# reqwest behind `http`: blocking client, JSON helpers, rustls (no OpenSSL).
# Cargo.lock makes repository tests reproducible; downstream crates resolve their own
# SemVer-compatible tree, so the dual-address regression test must run on lock updates.
reqwest = { version = "0.12", optional = true, default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", optional = true, features = ["derive"] }
serde_json = { version = "1", optional = true }
getrandom = "0.2"
# `log` facade behind `kafka`: warn/error records for withheld / dropped / poison
# / handler-panic messages. A tiny, dependency-light facade — no logger backend is
# forced on downstream crates (they pick their own: env_logger, tracing, ...).
log = { version = "0.4", optional = true }

[dev-dependencies]
futures-executor = "0.3"
