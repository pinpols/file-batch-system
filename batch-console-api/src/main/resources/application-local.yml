server:
  port: 18080

spring:
  main:
    lazy-initialization: true
  autoconfigure:
    exclude:
    - org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration
    - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
    - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
    - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
    - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
    - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
    - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
  datasource:
    url: ${BATCH_PLATFORM_DB_URL:jdbc:postgresql://localhost:15432/batch_platform}
    username: ${BATCH_PLATFORM_DB_USERNAME:batch_user}
    password: ${BATCH_PLATFORM_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: localhost
      port: 16379
      # 勿删：本段会覆盖基线里整个 spring.data.redis；缺少时 repositories.enabled 会回到默认 true，触发 Redis Repository 扫描 INFO
      repositories:
        enabled: false
  ai:
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: io.github.pinpols.batch.console.domain

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

batch:
  security:
    bypass-mode: true
  console:
    instance-id: ${BATCH_CONSOLE_INSTANCE_ID:batch-console-api-local}
    security:
      enabled: true
      tenant-header: X-Tenant-Id
      user-header: X-Console-User
      role-header: X-Console-Roles
      default-tenant-id: ""
      allowed-tenants: []
      default-authorities:
      - ROLE_ADMIN
      - ROLE_AUDITOR
      - ROLE_CONFIG_ADMIN
      # 本地/测试环境关掉单点登录,允许 e2e harness 共享 storageState (BE-ISSUE-3)。
      # 生产由 application.yml 的环境变量 BATCH_CONSOLE_SINGLE_SESSION_ENABLED 控制,默认仍 true。
      single-session-enabled: false
      jwt-issuer: batch-console-api
      jwt-secret: console-jwt-secret-change-me
      jwt-ttl: PT8H
      session-state-ttl: P30D
      # R7-A1-P2：本地 HTTP 调试关掉 cookie Secure（默认 true，生产 HTTPS 强制）。
      cookie-secure: false
      # 本地不在仓库内保存 RSA 私钥；未通过环境变量注入时由 ConsoleLoginKeyPairService 生成临时密钥。
      # 如需跨重启保持公钥指纹，请在本机通过 Secret/env 注入以下两个变量。
      login-encryption:
        enabled: true
        required: false
        private-key-pem: ${BATCH_CONSOLE_LOGIN_ENCRYPTION_PRIVATE_KEY_PEM:}
        public-key-pem: ${BATCH_CONSOLE_LOGIN_ENCRYPTION_PUBLIC_KEY_PEM:}
    ai:
      enabled: false
      model: ${BATCH_CONSOLE_AI_MODEL:gpt-4o-mini}
      max-prompt-length: 4000
      max-response-length: 3000
      allowed-users:
      - admin
      allowed-authorities:
      - ROLE_ADMIN
      - ROLE_AUDITOR
    trigger:
      base-url: ${BATCH_TRIGGER_BASE_URL:http://localhost:18081}
    orchestrator:
      base-url: ${BATCH_ORCHESTRATOR_BASE_URL:http://localhost:18082}
  # 对象存储配置统一走 batch-defaults.yml 的 batch.storage.s3.*；secret-key 从 .env 的
  # BATCH_S3_SECRET_KEY 单点注入,不在各模块 application-local.yml 重复(避免扩散)。
