# 控制台侧边栏菜单(外置配置 · 绑定 ConsoleMenuProperties)
#
# 改菜单 = 改本文件 + 重启 console-api(不重编译、不走 DB)。
# 部署侧可用外置文件覆盖:见 application.yml 的 spring.config.import
#   optional:file:${BATCH_CONSOLE_MENU_FILE:config/menu.yml}
#
# 字段:
#   groups[].key/title/icon/minRole/authorities —— 组
#   groups[].children[].title/path/icon/minRole/authorities —— 菜单项
# minRole 取值:VIEWER < TENANT_ADMIN < ADMIN(未知/缺失 fail-secure 当 ADMIN)。
# authorities 可选；配置后按真实 Spring authority 精确匹配，并覆盖 minRole。
# 组未配置 authorities 时，由过滤后仍有可见子项决定是否展示，不用组 minRole 阻断子项。
# icon 为 @element-plus/icons-vue 图标名。path 必须是 FE 已存在的路由(配置化不能新增页面)。
#
# 分组说明(2026-07 redesign IA v3):
#   - 组 key 对齐 FE `src/constants/navigation.ts`,后端菜单同时作为路由 allowlist。
#   - 分组名称与前端展示一致；前端可按用户任务重排条目，不改变后端授权路径。
#   - 前端可将低频项标记 hidden,后端仍完整返回 path,保证 Command Palette 和页面内深链可达。
batch:
  console:
    menu:
      groups:
        - key: workspace
          title: 工作台
          icon: Histogram
          minRole: VIEWER
          children:
            - { title: 控制面板, path: /ops/summary, icon: TrendCharts, minRole: VIEWER }
            - { title: 审批中心, path: /approvals, icon: Stamp, minRole: TENANT_ADMIN, authorities: [ROLE_ADMIN, ROLE_TENANT_ADMIN] }
            - { title: 报表中心, path: /reports, icon: Download, minRole: VIEWER }
            - { title: 自助服务, path: /self-service, icon: Tickets, minRole: VIEWER, authorities: [ROLE_ADMIN, ROLE_TENANT_ADMIN, ROLE_TENANT_USER] }
            - { title: 容量画像, path: /ops/capacity-profile, icon: PieChart, minRole: VIEWER }
            - { title: 新鲜度策略, path: /ops/asset-freshness, icon: Timer, minRole: TENANT_ADMIN }
        - key: monitor
          title: 运行监控
          icon: Monitor
          minRole: VIEWER
          children:
            - { title: 作业运行, path: /monitor/job-instances, icon: Aim, minRole: VIEWER }
            - { title: 作业步骤, path: /monitor/job-steps, icon: Timer, minRole: VIEWER }
            - { title: 工作流运行, path: /monitor/workflow-runs, icon: Promotion, minRole: VIEWER }
            - { title: 全部运行, path: /runs, icon: List, minRole: VIEWER }
            - { title: 综合查询, path: /observability/queries, icon: Reading, minRole: VIEWER }
            - { title: 链路诊断, path: /observability/trace, icon: Search, minRole: VIEWER }
            - { title: 使用统计, path: /observability/usage, icon: DataAnalysis, minRole: VIEWER, authorities: [ROLE_ADMIN, ROLE_AUDITOR, ROLE_TENANT_ADMIN] }
            - { title: 运维诊断, path: /ops/diagnostic, icon: Tools, minRole: ADMIN }
            - { title: 血缘证据, path: /observability/lineage, icon: DataLine, minRole: VIEWER }
        - key: alerting
          title: 告警投递
          icon: Bell
          minRole: VIEWER
          children:
            - { title: 告警事件, path: /observability/alerts, icon: WarningFilled, minRole: VIEWER }
            - { title: 监控策略, path: /observability/job-monitoring-policies, icon: Timer, minRole: TENANT_ADMIN }
            - { title: 告警路由（预留）, path: /observability/alert-routings, icon: Promotion, minRole: TENANT_ADMIN }
            - { title: 通知投递, path: /system/notifications, icon: Bell, minRole: TENANT_ADMIN }
            - { title: Outbox, path: /observability/outbox, icon: Box, minRole: TENANT_ADMIN }
        - key: definitions
          title: 准备作业
          icon: Management
          minRole: VIEWER
          children:
            - { title: 作业定义, path: /jobs/definitions, icon: List, minRole: VIEWER }
            - { title: 工作流定义, path: /workflow/definitions, icon: Collection, minRole: VIEWER }
            - { title: 编排设计器, path: /workflow/designer, icon: Guide, minRole: TENANT_ADMIN }
            - { title: 配置导入, path: /config/tenant-package, icon: Box, minRole: TENANT_ADMIN }
        - key: files
          title: 文件管理
          icon: FolderOpened
          minRole: VIEWER
          children:
            - { title: 文件列表, path: /files/list, icon: Files, minRole: VIEWER }
            - { title: 到达组治理, path: /files/arrival-groups, icon: CollectionTag, minRole: VIEWER }
            - { title: 流水线观测, path: /files/pipeline-obs, icon: DataAnalysis, minRole: VIEWER }
            - { title: 文件模板, path: /files/templates, icon: Document, minRole: VIEWER, authorities: [ROLE_ADMIN, ROLE_TENANT_ADMIN, ROLE_AUDITOR] }
            - { title: 文件渠道, path: /files/channels, icon: Connection, minRole: VIEWER, authorities: [ROLE_ADMIN, ROLE_TENANT_ADMIN, ROLE_AUDITOR] }
        - key: scheduling
          title: 调度资源
          icon: DataAnalysis
          minRole: VIEWER
          children:
            - { title: Worker 管理, path: /workers/management, icon: Cpu, minRole: TENANT_ADMIN }
            - { title: 触发器, path: /system/triggers, icon: Timer, minRole: TENANT_ADMIN }
            - { title: 调度快照, path: /scheduler/snapshot, icon: TrendCharts, minRole: VIEWER }
            - { title: 批次日与窗口, path: /scheduler/batch-days, icon: Calendar, minRole: VIEWER }
            - { title: 批次日重放, path: /ops/batch-day-replay, icon: RefreshRight, minRole: TENANT_ADMIN }
            - { title: 业务日历, path: /governance/calendars, icon: Calendar, minRole: TENANT_ADMIN }
            - { title: 批次窗口, path: /governance/windows, icon: Clock, minRole: ADMIN }
            - { title: 租户配额, path: /governance/quota, icon: Briefcase, minRole: TENANT_ADMIN }
            - { title: 资源队列, path: /governance/queues, icon: Tools, minRole: ADMIN }
            - { title: 自定义任务类型, path: /ops/custom-task-types, icon: Grid, minRole: TENANT_ADMIN }
            - { title: Worker 指纹看板, path: /ops/worker-fingerprints, icon: Monitor, minRole: TENANT_ADMIN }
            - { title: 分片目录, path: /ops/shard-catalog, icon: Coin, minRole: ADMIN }
            - { title: 租户分片, path: /ops/tenant-placements, icon: Collection, minRole: ADMIN }
        - key: system
          title: 平台管理
          icon: Setting
          minRole: VIEWER
          children:
            - { title: 租户实例, path: /system/tenants, icon: Briefcase, minRole: TENANT_ADMIN }
            - { title: 登录账户, path: /system/user-accounts, icon: Tickets, minRole: ADMIN, authorities: [ROLE_ADMIN, ROLE_TENANT_ADMIN] }
            - { title: 权限自查, path: /system/users, icon: Tickets, minRole: VIEWER, authorities: [ROLE_ADMIN, ROLE_AUDITOR, ROLE_TENANT_ADMIN, ROLE_TENANT_USER] }
            - { title: 发布管理, path: /config/releases, icon: DocumentChecked, minRole: TENANT_ADMIN, authorities: [ROLE_ADMIN, ROLE_TENANT_ADMIN, ROLE_AUDITOR] }
            - { title: 变更与同步, path: /config/management, icon: Memo, minRole: TENANT_ADMIN, authorities: [ROLE_ADMIN, ROLE_TENANT_ADMIN, ROLE_AUDITOR] }
            - { title: 审计日志, path: /observability/audits, icon: Memo, minRole: VIEWER, authorities: [ROLE_ADMIN, ROLE_TENANT_ADMIN, ROLE_AUDITOR] }
            - { title: 操作审计, path: /observability/operation-audits, icon: Document, minRole: VIEWER, authorities: [ROLE_ADMIN, ROLE_TENANT_ADMIN, ROLE_AUDITOR] }
            - { title: 事件目录, path: /system/event-catalog, icon: Collection, minRole: VIEWER }
            - { title: 标签管理, path: /system/tags, icon: PriceTag, minRole: TENANT_ADMIN }
            - { title: AI 助手, path: /system/ai-chat, icon: Document, minRole: VIEWER, authorities: [ROLE_ADMIN, ROLE_AUDITOR] }
            - { title: API Key, path: /system/api-keys, icon: Key, minRole: VIEWER, authorities: [ROLE_ADMIN, ROLE_TENANT_ADMIN, ROLE_TENANT_USER] }
            - { title: 系统参数, path: /system/parameters, icon: Setting, minRole: ADMIN }
            - { title: 原子节点配置中心, path: /system/atomic-task-types, icon: Box, minRole: TENANT_ADMIN }
