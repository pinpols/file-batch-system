version: 2
updates:
  # ==== Maven ====
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Shanghai"
    # 保留有限队列，避免正常版本更新永久停摆；major 仍由下方规则人工评审。
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    labels:
      - "dependencies"
      - "auto-update"
    # 忽略 major bump(major 升级牵涉 CVE 抑制等,需人工评审)
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      maven-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ==== GitHub Actions ====
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Shanghai"
    # 保留有限的版本更新队列；安全更新不受该上限影响。
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ==== Docker base image ====
  - package-ecosystem: "docker"
    directory: "/deploy/docker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(docker)"
    labels:
      - "dependencies"
      - "docker"
    ignore:
      # Maven 镜像 tag 同时携带 JDK 主版本；Dependabot 会把 21 变成 26，
      # 无法按普通 semver major 可靠识别，因此由维护者随 Java 基线人工升级。
      - dependency-name: "maven"
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      docker-minor-patch:
        patterns: ["*"]
