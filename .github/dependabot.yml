version: 2
multi-ecosystem-groups:
  quarterly-dependency-inventory:
    schedule:
      interval: "quarterly"
      time: "03:00"
      timezone: "Asia/Shanghai"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"

updates:
  # ==== Maven ====
  - package-ecosystem: "maven"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "quarterly-dependency-inventory"
    # 仅保留 Dependabot 版本解析能力；升级由季度人工批次统一建一张 PR。
    open-pull-requests-limit: 0
    # 忽略 major bump(major 升级牵涉 CVE 抑制等,需人工评审)
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ==== GitHub Actions ====
  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "quarterly-dependency-inventory"
    open-pull-requests-limit: 0
    # Action major 版本可能改变权限、输入或 Node 运行时，继续人工升级。
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ==== Docker base image ====
  - package-ecosystem: "docker"
    directory: "/deploy/docker"
    schedule:
      interval: "quarterly"
      time: "03:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(docker)"
    labels:
      - "dependencies"
      - "docker"
    ignore:
      # Maven 镜像 tag 同时携带 JDK 主版本；Dependabot 会把 21 变成 26，
      # 无法按普通 semver major 可靠识别，因此由维护者随 Java 基线人工升级。
      - dependency-name: "maven"
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    # Docker tag/digest 不具有统一的 semver 语义，仅参与季度盘点并由人工集中处理。
