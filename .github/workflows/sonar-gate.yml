name: SonarQube CI

# Community Build 仅分析 main；完整 Git 历史用于 30 天新代码基线。
# 夜间只在最近 24 小时有相关代码/构建变更时扫描。
on:
  workflow_call:
    inputs:
      reuse_coverage:
        description: Reuse JaCoCo reports uploaded by the calling Full Gate run
        required: false
        type: boolean
        default: false
  # BYO Java SDK 不触发 full-ci-gate；它保留独立 Sonar 全量构建与测试。
  push:
    branches: [main]
    paths:
      - 'sdk/java/**'
  schedule:
    - cron: '23 18 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: sonar-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sonar:
    name: Sonar analysis and quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Require main branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo '❌ 不通过 | code=SONAR_MAIN_BRANCH_ONLY | gate=Sonar Community Build 仅支持 main 分支分析' >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Check for recent code changes
        id: nightly
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          set -euo pipefail
          changed_files="$(git log --since='24 hours ago' --name-only --format= HEAD | sort -u)"
          if printf '%s\n' "$changed_files" | grep -Eq '(^|/)([^/]+\.java|pom\.xml)$|^\.mvn/|^mvnw$|^scripts/dev/sonar-.*|^scripts/dev/sql/sonar-.*|^scripts/lib/(process|python-runtime)\.sh$|^\.github/workflows/sonar-gate\.yml$'; then
            echo '最近 24 小时存在 Java、构建或 Sonar CI 变更，将执行夜间扫描。'
          else
            echo '最近 24 小时没有 Java、构建或 Sonar CI 变更，跳过夜间扫描。'
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Download Full Gate JaCoCo reports
        id: coverage-download
        if: inputs.reuse_coverage && steps.nightly.outputs.skip != 'true'
        # non-gate-failure-policy: 缺少优化制品时回退独立测试，Sonar 门禁仍保持阻断。
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: full-ci-sonar-input-unit-it-a
          path: .

      - name: Download remaining Full Gate JaCoCo reports
        id: coverage-download-rest
        if: inputs.reuse_coverage && steps.nightly.outputs.skip != 'true'
        # non-gate-failure-policy: 缺少优化制品时回退独立测试，Sonar 门禁仍保持阻断。
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: full-ci-sonar-input-unit-it-b1
          path: .

      - name: Download worker JaCoCo reports
        id: coverage-download-workers
        if: inputs.reuse_coverage && steps.nightly.outputs.skip != 'true'
        # non-gate-failure-policy: 缺少优化制品时回退独立测试，Sonar 门禁仍保持阻断。
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: full-ci-sonar-input-unit-it-b2-workers
          path: .

      - name: Download Console JaCoCo report
        id: coverage-download-console
        if: inputs.reuse_coverage && steps.nightly.outputs.skip != 'true'
        # non-gate-failure-policy: 缺少优化制品时回退独立测试，Sonar 门禁仍保持阻断。
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: full-ci-sonar-input-unit-it-b2-console
          path: batch-console-api/target/site/jacoco

      - name: Select coverage source
        id: coverage-source
        if: always()
        shell: bash
        run: |
          reuse=false
          if [[ "${{ inputs.reuse_coverage }}" == "true" && \
                "${{ steps.coverage-download.outcome }}" == "success" && \
                "${{ steps.coverage-download-rest.outcome }}" == "success" && \
                "${{ steps.coverage-download-workers.outcome }}" == "success" && \
                "${{ steps.coverage-download-console.outcome }}" == "success" ]]; then
            modules=(
              batch-common batch-test-support batch-console-api batch-orchestrator batch-trigger
              batch-worker/core batch-worker/import batch-worker/export batch-worker/process
              batch-worker/dispatch batch-worker/atomic sdk/java/core sdk/java/spring sdk/java/testkit
            )
            reuse=true
            for module in "${modules[@]}"; do
              report="$module/target/site/jacoco/jacoco.xml"
              if [[ ! -s "$report" ]]; then
                echo "Missing Full Gate coverage report: $report" >&2
                reuse=false
                break
              fi
            done
          fi
          echo "reuse=$reuse" >> "$GITHUB_OUTPUT"
          echo "Sonar coverage source: $([[ "$reuse" == true ]] && echo Full Gate artifact || echo independent Maven test run)"

      - name: Run Maven tests and generate JaCoCo reports
        if: steps.nightly.outputs.skip != 'true' && steps.coverage-source.outputs.reuse != 'true'
        run: ./mvnw -B clean test org.jacoco:jacoco-maven-plugin:0.8.15:report --projects '!batch-e2e-tests'

      - name: Compile sources for Sonar using Full Gate coverage
        if: steps.nightly.outputs.skip != 'true' && steps.coverage-source.outputs.reuse == 'true'
        run: ./mvnw -B test-compile -DskipTests --projects '!batch-e2e-tests'

      - name: Start ephemeral SonarQube container
        if: steps.nightly.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo sysctl -w vm.max_map_count=524288
          docker run -d --rm --name sonarqube-batch \
            --memory=6g --cpus=3 \
            --ulimit nofile=131072:131072 --ulimit nproc=8192:8192 \
            -p 127.0.0.1:9001:9000 \
            sonarqube@sha256:d4899d380ad9d7b63ebaa751e047f5a4f064f8902cdf7c1a3c3c96f7d71600ed
          attempt=0
          while (( attempt < 120 )); do
            if curl -fsS http://127.0.0.1:9001/api/system/status | grep -q '"status":"UP"'; then
              echo '✅ 通过 | code=SONAR_CONTAINER_READY | gate=临时SonarQube服务'
              exit 0
            fi
            attempt=$((attempt + 1))
            sleep 5
          done
          docker logs sonarqube-batch --tail 80
          echo '❌ 不通过 | code=SONAR_CONTAINER_STARTUP | gate=临时SonarQube服务 | timeout=600s' >&2
          exit 1

      - name: Analyze and enforce Sonar Quality Gate
        if: steps.nightly.outputs.skip != 'true'
        env:
          SONAR_PORT: '9001'
          SONAR_ANONYMOUS_ACCESS: 'false'
          SONAR_PUBLIC_PROJECT: 'false'
        run: bash scripts/dev/sonar-scan.sh --full --skip-build --quality-gate

      - name: Upload Sonar report
        if: always() && steps.nightly.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sonar-report-${{ github.run_id }}
          path: reports/sonar/*/sonar-report.*
          if-no-files-found: warn
          retention-days: 7

      - name: Remove ephemeral SonarQube container
        if: always()
        shell: bash
        run: docker rm -f sonarqube-batch >/dev/null 2>&1 || true
