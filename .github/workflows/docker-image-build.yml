name: docker-image-build

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Push immutable sha images to GHCR and emit a backend image set
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      publish:
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: docker-image-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      BUILD_REVISION: ${{ github.sha }}
      APP_IMAGE_TAG: sha-${{ github.sha }}
      APP_IMAGE_PREFIX: ${{ inputs.publish && 'ghcr.io/pinpols/' || 'batch-' }}
      OPS_TOOLBOX_IMAGE_TAG: sha-${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        if: inputs.publish
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build application and operations images
        id: bake
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7
        with:
          files: |
            docker-bake.hcl
            docker-bake.ci.hcl
          targets: ci
          load: false
          push: ${{ inputs.publish }}

      - name: Save immutable backend image set
        if: inputs.publish
        env:
          BAKE_METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          mkdir -p build/release
          printf '%s' "$BAKE_METADATA" > build/release/bake-metadata.json
          docker buildx bake \
            -f docker-bake.hcl \
            -f docker-bake.ci.hcl \
            --print ci > build/release/bake-plan.json
          python3 scripts/deploy/release_manifest.py backend-fragment \
            --metadata build/release/bake-metadata.json \
            --plan build/release/bake-plan.json \
            --git-sha "$GITHUB_SHA" \
            --output build/release/backend-image-set.json

      - name: Upload backend image set
        if: inputs.publish
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-image-set-${{ github.sha }}
          path: build/release/backend-image-set.json
          if-no-files-found: error
          retention-days: 30
