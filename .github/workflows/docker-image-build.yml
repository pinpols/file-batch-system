name: docker-image-build

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Push immutable sha images to GHCR and emit a backend image set
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      publish:
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUILD_REVISION: ${{ github.sha }}
      APP_IMAGE_TAG: sha-${{ github.sha }}
      APP_IMAGE_PREFIX: ${{ inputs.publish && 'ghcr.io/pinpols/' || 'batch-' }}
      OPS_TOOLBOX_IMAGE_TAG: sha-${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: inputs.publish
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build application and operations images
        id: bake
        uses: docker/bake-action@v7
        with:
          files: |
            docker-bake.hcl
            docker-bake.ci.hcl
          targets: ci
          load: false
          push: ${{ inputs.publish }}

      - name: Save immutable backend image set
        if: inputs.publish
        env:
          BAKE_METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          mkdir -p build/release
          printf '%s' "$BAKE_METADATA" > build/release/bake-metadata.json
          docker buildx bake \
            -f docker-bake.hcl \
            -f docker-bake.ci.hcl \
            --print ci > build/release/bake-plan.json
          python3 scripts/deploy/release_manifest.py backend-fragment \
            --metadata build/release/bake-metadata.json \
            --plan build/release/bake-plan.json \
            --git-sha "$GITHUB_SHA" \
            --output build/release/backend-image-set.json

      - name: Upload backend image set
        if: inputs.publish
        uses: actions/upload-artifact@v7
        with:
          name: backend-image-set-${{ github.sha }}
          path: build/release/backend-image-set.json
          if-no-files-found: error
          retention-days: 30
