name: strict-verify

# 严格模式真实数据验证(scripts/local/strict-verify.sh)的 CI 接入。
#
# 两种模式:
#   1) dry-run smoke(默认,自动触发):仅校验脚本前置依赖(docker / curl / Python 3),
#      ~1s,不连 PG / console-api。作用是保证脚本本身没语法 / 参数解析腐烂。
#      paths 触发限定到该脚本 + run-full-regression 自身改动。
#
#   2) full live(手动 workflow_dispatch):本地 docker compose 起 PG,把 console-api
#      jar 跑起来,等 readiness 后跑完整 6 类真实数据验证(~30s + jar 启动 ~90s)。
#      时延高且需 seed 数据(否则 cursor 翻页项会 SKIP),目前不接 push 自动跑。
#
# **非阻断**:整个 workflow 与 pr-gate / full-ci-gate 解耦,即使失败也不挡 PR merge。
# 想升级为阻断 → 把 pr-gate 加一个 needs: strict-verify-dry-run job。

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run = 只校验依赖(快); live = 起 PG + console-api 跑真实数据(慢)'
        required: true
        default: 'dry-run'
        type: choice
        options:
          - dry-run
          - live
  # PR 驱动:去掉 feature-branch 的 push 触发(2026-06-22 CI 优化),与 pr-gate 一致,
  # 消除 push + pull_request 对 strict-verify-dry-run 的双跑。live 仍仅 workflow_dispatch。
  pull_request:
    branches: [main]
    paths:
      - 'scripts/local/strict-verify.sh'
      - 'scripts/ci/run-full-regression.sh'
      - '.github/workflows/strict-verify.yml'

permissions:
  contents: read

concurrency:
  group: strict-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # Job 1: dry-run smoke。push / pr 触发自动跑;workflow_dispatch 默认也跑。
  # ~1s 真实执行(加 checkout / setup 总共 ~30s)。
  # =========================================================================
  strict-verify-dry-run:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.mode == 'dry-run'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate script syntax
        shell: bash
        run: |
          bash -n scripts/local/strict-verify.sh
          bash -n scripts/ci/run-full-regression.sh

      - name: strict-verify --dry-run (prerequisites smoke)
        shell: bash
        # 走 run-full-regression 入口,确保 CI 通道真的能调起;CI=1 由 wrapper 注入
        run: bash scripts/ci/run-full-regression.sh --strict-verify-dry-run --skip-default-tests --skip-it-suite --skip-static-gates

  # =========================================================================
  # Job 2: live full run。仅 workflow_dispatch mode=live 触发。
  # 起 PG/Valkey → 跑 flyway → 起 console-api → 跑真实数据验证。
  # **non-blocking via continue-on-error**:不挂 PR 状态。
  # 注意:cursor 翻页项需要 seed 数据,空库会 SKIP(脚本设计如此)。
  # =========================================================================
  strict-verify-live:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'live'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /var/run/docker.sock
      CONSOLE_PORT: '18080'
      PG_CONTAINER: batch-postgres-primary
      PG_USER: batch_user
      PG_DB: batch_platform
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env

      - name: Bring up postgres and Valkey (docker compose)
        shell: bash
        # strict-verify 需要 primary PG；Console 的实时 Pub/Sub 是启动必需项，因此同时启动 Valkey。
        # Kafka / MinIO 不在本门禁验证范围内，不为本 job 扩大基础设施集合。
        run: |
          if [[ -f .env.example ]]; then cp .env.example .env.local; fi
          # docker-compose.yml 的 batch-network 声明为 external,本地由 deploy.ps1 创建;
          # CI 干净环境下需先建,否则 compose up 报 "network ... could not be found"。
          docker network inspect batch-platform_batch-network >/dev/null 2>&1 \
            || docker network create batch-platform_batch-network
          docker compose --env-file .env.local up -d postgres-primary valkey
          # 等 PG ready
          postgres_ready=false
          for _ in $(seq 1 60); do
            if docker exec batch-postgres-primary pg_isready -U "$PG_USER" -d "$PG_DB" >/dev/null 2>&1; then
              echo "postgres ready"
              postgres_ready=true
              break
            fi
            sleep 2
          done
          [[ "$postgres_ready" == true ]] || {
            docker logs batch-postgres-primary >&2 || true
            echo "postgres did not become ready" >&2
            exit 1
          }
          valkey_ready=false
          for _ in $(seq 1 60); do
            if docker exec batch-valkey valkey-cli ping 2>/dev/null | grep -Fxq PONG; then
              echo "valkey ready"
              valkey_ready=true
              break
            fi
            sleep 2
          done
          [[ "$valkey_ready" == true ]] || {
            docker logs batch-valkey >&2 || true
            echo "valkey did not become ready" >&2
            exit 1
          }

      - name: Apply platform Flyway migrations
        shell: bash
        run: |
          source scripts/lib/env-common.sh
          batch_configure_local_jvm_database_env
          flyway_classpath="$RUNNER_TEMP/flyway-classpath.txt"
          ./mvnw -q -pl batch-orchestrator -am dependency:build-classpath \
            -Dmdep.outputFile="$flyway_classpath"
          java -cp "$(cat "$flyway_classpath")" scripts/ci/FlywayMigrate.java \
            "$BATCH_PLATFORM_DB_URL" \
            "$BATCH_PLATFORM_DB_USERNAME" \
            "$BATCH_PLATFORM_DB_PASSWORD"

      - name: Build console-api jar (skip tests)
        shell: bash
        run: |
          ./mvnw -DskipTests -pl batch-console-api -am package -B -q

      - name: Start console-api
        shell: bash
        run: |
          source scripts/lib/env-common.sh
          batch_load_default_env
          # 此 job 只启动 primary PG；禁止 local env 把应用指向未启动的 replica。
          export BATCH_CONSOLE_READ_REPLICA_ENABLED=false
          # strict-verify 不验证对象存储；禁用会主动写 MinIO 的启动探针，S3 客户端仍保持装配。
          export BATCH_STORAGE_STARTUP_CHECK_ENABLED=false
          mapfile -t JARS < <(find batch-console-api/target -maxdepth 1 -type f \
            -name 'batch-console-api-*-exec.jar' -print)
          [[ ${#JARS[@]} -eq 1 ]] || {
            echo "expected exactly one executable console-api jar, found ${#JARS[@]}" >&2
            printf 'candidate: %s\n' "${JARS[@]}" >&2
            exit 1
          }
          JAR="${JARS[0]}"
          echo "starting $JAR"
          nohup java -jar "$JAR" --spring.profiles.active=local \
            > /tmp/console-api.log 2>&1 &
          # 本门禁只验证 Console + primary PG/Valkey；MinIO/Kafka 未启动，不能用聚合 health。
          for i in $(seq 1 90); do
            if curl -sf "http://localhost:${CONSOLE_PORT}/actuator/health/liveness" -o /dev/null 2>/dev/null; then
              echo "console-api ready after ${i}*2s"
              exit 0
            fi
            sleep 2
          done
          echo "console-api FAILED to come up; last log tail:" >&2
          tail -100 /tmp/console-api.log >&2 || true
          exit 1

      - name: Run strict-verify (live, non-blocking)
        # soft-gate-id: STRICT_VERIFY_LIVE
        # 报告模式保留真实退出码和统一状态行，但不影响 workflow 结论。
        shell: bash
        run: bash scripts/ci/run-gate.sh --group acceptance --mode report STRICT_VERIFY_LIVE "在线 strict 验证" -- env CI=1 bash scripts/local/strict-verify.sh

      - name: Dump console-api log on failure
        if: always()
        shell: bash
        run: |
          echo "===== /tmp/console-api.log (tail 200) ====="
          tail -200 /tmp/console-api.log || true

      - name: Tear down
        if: always()
        shell: bash
        run: |
          docker compose down -v || true
