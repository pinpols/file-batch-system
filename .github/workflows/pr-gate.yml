name: pr-gate

# C 方案(2026-06-02):PR 只跑 unit + 文档全跳 + Merge Queue 入口。
# 历史背景:Round-1 TOP-7 把 e2e 分级到 smoke(本 workflow)+ regression(staging-gate)。
# C 方案进一步把 IT 也从 PR-gate 移除,IT/E2E 全部交给 full-ci-gate(main push 后回退)+
# staging-gate(nightly)。PR-gate 保留 static-checks 聚合门禁 + unit +
# java-governance + security-scan 四类快速反馈。
# 风险:main 偶尔会被 full-ci-gate 拦,该 PR 作者负责立即 revert + 修复。
# 详见 docs/runbook/ci-speedup-2026-06-02.md。
#
# Job 名(unit-it-a / unit-it-b1 / unit-it-b2)不动,因为 ruleset required check 配置在
# 这 3 个名字上;改名会导致 ruleset 失配。命令从 `mvn verify`(failsafe IT)改成
# `mvn test`(只跑 surefire unit)。
#
# affected 极小化：workflow 始终触发以回报 required check；`pr-gate-scope` job 按文件域路由，
# Java 单测和 static-policy/static-supply-chain/static-java-quality 内的专项步骤只在
# 对应 java/database/scripts/docs/config/api/ci 变更时执行。跨域 secret scan 保持全 PR 执行。

on:
  workflow_dispatch:
  # PR 驱动:去掉 feature-branch 的 push 触发(2026-06-22 CI 优化)。
  # 此前 push + pull_request 双跑同一套 pr-gate(concurrency group 不同不互相取消),
  # 每个 PR 把 static/unit/security-scan 跑两遍。分支保护只认 PR-context run,push run 纯浪费。
  # 现在:PR(pull_request)+ 合并队列(merge_group)覆盖所有门禁场景;main push 由
  # full-ci-gate 接管;想在开 PR 前跑 CI 就开 draft PR。docs-only 跳过由下方 changes job 处理。
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  # GitHub Merge Queue 入口(C 方案 #4):必须 list 在这里,merge queue 才会调用
  # pr-gate 作为 required check;ruleset required check 同时支持 PR 和 merge_group。
  # 启用 Merge Queue 后,合并通过 queue 串行化,可消除 main 被 broken 风险。
  # 启用指引见 docs/runbook/ci-speedup-2026-06-02.md。
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Job 0: pr-gate-scope — 统一范围探测器判定按需门禁
  # 四个 unit 执行分片按模块边界路由；无单元影响的变更跳过执行分片，并保留
  # static-checks、security-scan 和稳定 required context。
  # ===========================================================================
  changes:
    name: pr-gate-scope
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs-only: ${{ steps.scope.outputs.docs-only }}
      unit-required: ${{ steps.scope.outputs.unit-required }}
      unit-a-required: ${{ steps.scope.outputs.unit-a-required }}
      unit-b1-required: ${{ steps.scope.outputs.unit-b1-required }}
      unit-b2-workers-required: ${{ steps.scope.outputs.unit-b2-workers-required }}
      unit-b2-console-required: ${{ steps.scope.outputs.unit-b2-console-required }}
      java: ${{ steps.scope.outputs.java }}
      sql: ${{ steps.scope.outputs.sql }}
      database: ${{ steps.scope.outputs.database }}
      scripts: ${{ steps.scope.outputs.scripts }}
      docs: ${{ steps.scope.outputs.docs }}
      config: ${{ steps.scope.outputs.config }}
      api: ${{ steps.scope.outputs.api }}
      sdk: ${{ steps.scope.outputs.sdk }}
      ci: ${{ steps.scope.outputs.ci }}
      tests: ${{ steps.scope.outputs.tests }}
      docker: ${{ steps.scope.outputs.docker }}
      helm: ${{ steps.scope.outputs.helm }}
      maven: ${{ steps.scope.outputs.maven }}
      unknown: ${{ steps.scope.outputs.unknown }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed scopes
        id: scope
        uses: ./.github/actions/detect-change-scope
        with:
          event-name: ${{ github.event_name }}
          base-sha: ${{ github.event.pull_request.base.sha }}
          head-sha: ${{ github.sha }}

  # ===========================================================================
  # Job 1a: static-policy — Python/Shell/契约/配置等轻量守卫
  # 与供应链和 Java 静态质量分路并发，末尾继续汇总本路所有独立失败。
  # ===========================================================================
  static-policy:
    needs: changes
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BATCH_GATE_COLLECT: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # 0 = 全历史:migration-safety / openapi-breaking 守护要相对 base 做 diff。
          fetch-depth: 0

      - name: Setup Python guard environment
        if: needs.changes.outputs.java == 'true' || needs.changes.outputs.sdk == 'true' || needs.changes.outputs.config == 'true' || needs.changes.outputs.scripts == 'true' || needs.changes.outputs.ci == 'true'
        uses: ./.github/actions/setup-python-guard-env

      - name: Verify repository text encoding
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        shell: bash
        run: bash scripts/ci/run-gate.sh PR_UTF8_ENCODING "变更文件 UTF-8 编码" -- python3 scripts/ci/check-utf8-encoding.py --base "origin/${BASE_REF}"

      - name: Test repository text encoding checker
        shell: bash
        run: bash scripts/ci/run-gate.sh PR_UTF8_ENCODING_TEST "UTF-8 编码门禁测试" -- python3 -m unittest scripts/ci/tests/test_check_utf8_encoding.py

      - name: Test gate failure aggregation
        shell: bash
        run: bash scripts/ci/run-gate.sh PR_GATE_COLLECTION_TEST "门禁失败汇总自测" -- bash scripts/ci/tests/test-gate-result-collection.sh

      - name: Verify runtime UTF-8 configuration
        if: needs.changes.outputs.java == 'true' || needs.changes.outputs.sdk == 'true' || needs.changes.outputs.config == 'true' || needs.changes.outputs.ci == 'true'
        shell: bash
        run: bash scripts/ci/run-gate.sh PR_INFRASTRUCTURE_UTF8 "基础设施 UTF-8 配置" -- python3 scripts/ci/check-infrastructure-utf8.py

      - name: Install squawk + oasdiff (迁移/契约守护工具)
        if: needs.changes.outputs.database == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.ci == 'true'
        shell: bash
        run: |
          npm ci --prefix .github/ci-tools --ignore-scripts --no-audit --no-fund
          echo "$GITHUB_WORKSPACE/.github/ci-tools/node_modules/.bin" >> "$GITHUB_PATH"
          OASDIFF_VERSION=1.32.1
          curl -fsSL "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin oasdiff
          .github/ci-tools/node_modules/.bin/squawk --version && oasdiff --version

      - name: Resolve guard base ref
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          BASE="${BASE_REF}"
          git fetch --no-tags --depth=200 origin "$BASE" || git fetch --no-tags origin "$BASE"
          echo "GUARD_BASE=origin/${BASE}" >> "$GITHUB_ENV"

      - name: Validate KAFKA_TOPICS sync (.env.example ↔ BatchTopics.java)
        if: needs.changes.outputs.java == 'true' || needs.changes.outputs.config == 'true' || needs.changes.outputs.ci == 'true'
        shell: bash
        # CI 没有 .env.prod / .env.local（均 gitignored），使用版本化的
        # .env.example 作为权威模板；本地也默认校验该文件。
        run: bash scripts/ci/run-gate.sh PR_KAFKA_TOPICS "Kafka topic 配置同步" -- bash scripts/ci/validate-kafka-topics.sh .env.example

      - name: Validate Flyway schema (parse + checksum drift detection)
        if: needs.changes.outputs.database == 'true' || needs.changes.outputs.ci == 'true'
        shell: bash
        run: bash scripts/ci/run-gate.sh PR_FLYWAY_SCHEMA "Flyway 迁移静态校验" -- bash scripts/ci/validate-flyway-schema.sh

      - name: Verify generated dicts in sync
        if: needs.changes.outputs.java == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.ci == 'true'
        shell: bash
        run: bash scripts/ci/run-gate.sh PR_ERROR_CODE_DICTIONARY "错误码字典同步" -- python3 scripts/codegen/gen-error-codes-dict.py --check

      - name: Verify yml ↔ docker-compose default sync
        if: needs.changes.outputs.config == 'true' || needs.changes.outputs.ci == 'true'
        shell: bash
        run: bash scripts/ci/run-gate.sh PR_CONFIG_DEFAULTS_SYNC "配置默认值同步" -- python3 scripts/ci/check-config-defaults-sync.py --check

      - name: Verify tracked env files are shell-safe
        if: needs.changes.outputs.config == 'true' || needs.changes.outputs.scripts == 'true' || needs.changes.outputs.ci == 'true'
        shell: bash
        # .env.example 会被 CI 复制成 .env.local 并由本地脚本 source;含空格的值必须加引号。
        run: bash scripts/ci/run-gate.sh PR_ENV_FILE_SHELL_SAFETY "环境文件 Shell 安全" -- python3 scripts/ci/check-env-file-shell-safety.py

      - name: Verify hardcoded runtime configuration boundaries
        if: needs.changes.outputs.java == 'true' || needs.changes.outputs.config == 'true' || needs.changes.outputs.scripts == 'true' || needs.changes.outputs.ci == 'true'
        shell: bash
        run: bash scripts/ci/run-gate.sh PR_RUNTIME_CONFIG_BOUNDARIES "运行时配置集中管理" -- bash scripts/ci/check-hardcoded-runtime-config.sh

      - name: Verify repository hygiene
        shell: bash
        run: bash scripts/ci/run-gate.sh PR_REPOSITORY_HYGIENE "仓库卫生" -- python3 scripts/ci/check-repository-hygiene.py

      - name: Set up Python for LOC snapshot
        if: needs.changes.outputs.java == 'true' || needs.changes.outputs.database == 'true' || needs.changes.outputs.scripts == 'true' || needs.changes.outputs.config == 'true' || needs.changes.outputs.ci == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: .python-version

      - name: Verify LOC snapshot
        if: needs.changes.outputs.java == 'true' || needs.changes.outputs.database == 'true' || needs.changes.outputs.scripts == 'true' || needs.changes.outputs.config == 'true' || needs.changes.outputs.ci == 'true'
        shell: bash
        run: bash scripts/ci/run-gate.sh PR_LOC_SNAPSHOT "代码量快照同步" -- python3 scripts/ci/check-loc-snapshot.py

      - name: Verify script governance and zero ShellCheck warnings
        if: needs.changes.outputs.scripts == 'true' || needs.changes.outputs.ci == 'true'
        shell: bash
        run: |
          source scripts/lib/gate-result.sh
          gate_run PR_SCRIPT_GOVERNANCE "脚本治理" python3 scripts/ci/check-script-governance.py
          gate_run PR_SHELL_SCRIPTS "Shell 语法与 ShellCheck" bash scripts/ci/check-shell-scripts.sh
          gate_run PR_SHELL_LINUX_PORTABILITY "Shell Linux 兼容性" python3 scripts/ci/check-shell-linux-portability.py
          gate_run PR_TESTCONTAINERS_REUSE_LABEL "Testcontainers 复用标签判定" python3 scripts/ci/check-testcontainers-reuse-label.py
          gate_run PR_POSTGRES_CLIENT_FALLBACK "PostgreSQL 客户端 fallback" bash scripts/ci/check-postgres-client-fallback.sh

      - name: Verify GitHub Actions SHA pinning
        if: needs.changes.outputs.scripts == 'true' || needs.changes.outputs.ci == 'true'
        shell: bash
        run: |
          source scripts/lib/gate-result.sh
          gate_run PR_ACTION_PINNING "GitHub Actions SHA 固定" python3 scripts/ci/check-github-action-pinning.py
          gate_run PR_ACTION_PINNING_TEST "GitHub Actions SHA 固定门禁测试" python3 -m unittest scripts/ci/tests/test_check_github_action_pinning.py

      - name: Verify CI quality governance guards
        if: needs.changes.outputs.ci == 'true'
        shell: bash
        run: |
          source scripts/lib/gate-result.sh
          gate_run PR_SOFT_GATES "软门禁治理" python3 scripts/ci/check-soft-gate-governance.py
          gate_run PR_FLAKY_QUARANTINE "flaky 测试隔离治理" python3 scripts/ci/check-flaky-test-governance.py
          gate_run PR_CI_QUALITY_GUARD_TESTS "CI 质量治理门禁测试" python3 -m unittest \
            scripts/ci/tests/test_check_flaky_test_governance.py \
            scripts/ci/tests/test_check_soft_gate_governance.py \
            scripts/ci/tests/test_check_diff_coverage.py \
            scripts/ci/tests/test_check_java_governance_test_coverage.py \
            scripts/ci/tests/test_daily_validation_workflow.py \
            scripts/ci/tests/test_pre_push_module_selection.py \
            scripts/ci/tests/test_report_ci_quality_trends.py

      - name: Verify module dependency boundaries
        if: needs.changes.outputs.java == 'true' || needs.changes.outputs.ci == 'true'
        shell: bash
        run: bash scripts/ci/run-gate.sh PR_DEPENDENCY_BOUNDARIES "模块依赖边界" -- python3 scripts/ci/check-dependency-boundaries.py

      - name: Verify infrastructure abstraction boundaries
        if: needs.changes.outputs.java == 'true' || needs.changes.outputs.ci == 'true'
        shell: bash
        run: bash scripts/ci/run-gate.sh PR_INFRA_ABSTRACTION_BOUNDARIES "基础设施抽象边界" -- python3 scripts/ci/check-infrastructure-abstraction-boundaries.py --base "$GUARD_BASE"

      - name: Verify direct client boundaries
        if: needs.changes.outputs.java == 'true' || needs.changes.outputs.ci == 'true'
        shell: bash
        run: bash scripts/ci/run-gate.sh PR_DIRECT_CLIENT_BOUNDARIES "业务层直连客户端边界" -- python3 scripts/ci/check-direct-client-boundaries.py

      - name: Verify changelog synchronization
        shell: bash
        run: bash scripts/ci/run-gate.sh PR_CHANGELOG_SYNC "Changelog 同步" -- python3 scripts/ci/check-changelog-sync.py --base "$GUARD_BASE"

      - name: Verify documentation structure and internal links
        if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.ci == 'true'
        shell: bash
        run: bash scripts/ci/run-gate.sh PR_DOCS_STRUCTURE "文档结构与内部链接" -- python3 scripts/ci/check-docs-structure.py

      - name: Verify terminology documentation sync
        if: needs.changes.outputs.java == 'true' || needs.changes.outputs.docs == 'true' || needs.changes.outputs.ci == 'true'
        shell: bash
        run: bash scripts/ci/run-gate.sh PR_TERMINOLOGY_DOC_SYNC "核心术语文档同步" -- python3 scripts/ci/check-terminology-doc-sync.py

      - name: Test terminology documentation sync guard
        if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.ci == 'true'
        shell: bash
        run: bash scripts/ci/run-gate.sh PR_TERMINOLOGY_DOC_SYNC_TEST "核心术语文档同步门禁测试" -- python3 -m unittest scripts/ci/tests/test_check_terminology_doc_sync.py

      - name: Verify documentation timestamp policy
        if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.ci == 'true'
        shell: bash
        run: bash scripts/ci/run-gate.sh PR_DOC_TIMESTAMP_POLICY "文档日期命名策略" -- python3 scripts/ci/check-doc-timestamp-policy.py

      - name: Validate feature switch registry
        if: needs.changes.outputs.java == 'true' || needs.changes.outputs.config == 'true' || needs.changes.outputs.docs == 'true' || needs.changes.outputs.ci == 'true'
        shell: bash
        run: bash scripts/ci/run-gate.sh PR_FEATURE_SWITCH_REGISTRY "功能开关注册表" -- python3 scripts/ci/check-feature-switch-registry.py

      - name: Verify environment variable governance
        if: needs.changes.outputs.config == 'true' || needs.changes.outputs.docs == 'true' || needs.changes.outputs.ci == 'true'
        shell: bash
        run: bash scripts/ci/run-gate.sh PR_ENV_VARIABLE_GOVERNANCE "环境变量治理" -- python3 scripts/ci/check-env-variable-governance.py

      - name: Verify configuration governance registry
        if: needs.changes.outputs.java == 'true' || needs.changes.outputs.config == 'true' || needs.changes.outputs.docs == 'true' || needs.changes.outputs.ci == 'true'
        shell: bash
        run: bash scripts/ci/run-gate.sh PR_CONFIG_GOVERNANCE "配置治理注册表" -- python3 scripts/ci/check-config-governance.py

      - name: Enforce no new direct config key access (baseline)
        if: needs.changes.outputs.java == 'true' || needs.changes.outputs.ci == 'true'
        shell: bash
        # 阶段 1（CFGKEY-3）：只拦截新增高风险 PROJECT_CONFIG / SECRET_CONFIG 直接读取；
        # 历史存量走 docs/governance/direct-config-key-access-baseline.txt，不因已有命中阻断无关 PR。
        # 新增违规应改用 @ConfigurationProperties，口径见 docs/runbook/config-key-access-governance.md。
        run: bash scripts/ci/run-gate.sh PR_DIRECT_CONFIG_KEY_BASELINE "直接配置 Key 增量拦截" -- python3 scripts/ci/check-direct-config-key-access.py --check-baseline docs/governance/direct-config-key-access-baseline.txt

      - name: Verify Helm env switch sync
        if: needs.changes.outputs.java == 'true' || needs.changes.outputs.config == 'true' || needs.changes.outputs.ci == 'true'
        shell: bash
        run: bash scripts/ci/run-gate.sh PR_HELM_ENV_SYNC "Helm 环境变量同步" -- python3 scripts/ci/check-helm-env-sync.py

      - name: Verify production Helm overlay safety
        if: needs.changes.outputs.config == 'true' || needs.changes.outputs.ci == 'true'
        shell: bash
        run: bash scripts/ci/run-gate.sh PR_PRODUCTION_HELM_OVERLAY "生产 Helm overlay 安全" -- python3 scripts/ci/check-production-overlay-safety.py

      - name: Verify production capacity governance automation
        if: needs.changes.outputs.database == 'true' || needs.changes.outputs.scripts == 'true' || needs.changes.outputs.docs == 'true' || needs.changes.outputs.config == 'true' || needs.changes.outputs.ci == 'true'
        shell: bash
        run: bash scripts/ci/run-gate.sh PR_PRODUCTION_CAPACITY_GOVERNANCE "生产容量治理自动化" -- python3 scripts/ci/check-production-capacity-governance.py

      - name: Verify application governance contract
        if: needs.changes.outputs.java == 'true' || needs.changes.outputs.config == 'true' || needs.changes.outputs.ci == 'true'
        shell: bash
        run: bash scripts/ci/run-gate.sh PR_APPLICATION_GOVERNANCE "应用治理契约" -- python3 scripts/ci/check-application-governance.py

      - name: Verify code documentation references
        if: needs.changes.outputs.java == 'true' || needs.changes.outputs.docs == 'true' || needs.changes.outputs.ci == 'true'
        shell: bash
        run: bash scripts/ci/run-gate.sh PR_CODE_DOC_REFERENCES "代码文档引用" -- python3 scripts/ci/check-code-doc-references.py

      - name: Verify Java readability conventions
        if: needs.changes.outputs.java == 'true' || needs.changes.outputs.ci == 'true'
        shell: bash
        run: bash scripts/ci/run-gate.sh PR_JAVA_READABILITY "Java 可读性约定" -- python3 scripts/ci/check-java-readability.py

      - name: Verify Java Lombok and injection conventions
        if: needs.changes.outputs.java == 'true' || needs.changes.outputs.ci == 'true'
        shell: bash
        run: bash scripts/ci/run-gate.sh PR_JAVA_LOMBOK_INJECTION "Java Lombok 与依赖注入规约" -- python3 scripts/ci/check-java-lombok-injection.py --base-ref "$GUARD_BASE"

      - name: Test Java Lombok and injection checker
        if: needs.changes.outputs.java == 'true' || needs.changes.outputs.ci == 'true'
        shell: bash
        run: bash scripts/ci/run-gate.sh PR_JAVA_LOMBOK_INJECTION_TEST "Java Lombok 与依赖注入门禁测试" -- python3 -m unittest scripts/ci/tests/test_check_java_lombok_injection.py

      - name: Verify Java logging governance
        if: needs.changes.outputs.java == 'true' || needs.changes.outputs.ci == 'true'
        shell: bash
        run: bash scripts/ci/run-gate.sh PR_JAVA_LOGGING "Java 日志与异常输出治理" -- python3 scripts/ci/check-java-logging-governance.py

      - name: Verify Java fixed contracts and protocol values
        if: needs.changes.outputs.java == 'true' || needs.changes.outputs.ci == 'true'
        env:
          CONTRACT_POLICY_RESCAN: ${{ needs.changes.outputs.ci }}
        shell: bash
        run: |
          args=()
          if [[ "$CONTRACT_POLICY_RESCAN" != 'true' ]]; then
            args=(--base-ref "$GUARD_BASE")
          fi
          bash scripts/ci/run-gate.sh PR_JAVA_CONTRACT "Java 固定契约与协议值治理" -- python3 scripts/ci/check-java-contract-governance.py "${args[@]}"

      - name: Test Java contract governance checker
        if: needs.changes.outputs.java == 'true' || needs.changes.outputs.ci == 'true'
        shell: bash
        run: bash scripts/ci/run-gate.sh PR_JAVA_CONTRACT_TEST "Java 契约治理门禁测试" -- python3 -m unittest scripts/ci/tests/test_check_java_contract_governance.py

      - name: Test Java logging governance checker
        if: needs.changes.outputs.java == 'true' || needs.changes.outputs.ci == 'true'
        shell: bash
        run: bash scripts/ci/run-gate.sh PR_JAVA_LOGGING_TEST "Java 日志治理门禁测试" -- python3 -m unittest scripts/ci/tests/test_check_java_logging_governance.py

      - name: Verify Java text block style
        if: needs.changes.outputs.java == 'true' || needs.changes.outputs.ci == 'true'
        shell: bash
        run: bash scripts/ci/run-gate.sh PR_JAVA_TEXT_BLOCK_STYLE "Java 文本块格式" -- python3 scripts/ci/check-java-text-block-style.py

      - name: Verify Java readability inventory
        if: needs.changes.outputs.java == 'true' || needs.changes.outputs.docs == 'true' || needs.changes.outputs.ci == 'true'
        shell: bash
        run: bash scripts/ci/run-gate.sh PR_JAVA_READABILITY_INVENTORY "Java 可读性快照" -- python3 scripts/ci/report-java-readability-inventory.py --check docs/analysis/java-readability-inventory-2026-08-12.md

      - name: Verify Console controller ↔ OpenAPI route sync
        if: needs.changes.outputs.java == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.ci == 'true'
        shell: bash
        # 拦 BE 加 controller 端点但漏更 docs/api/console-api.openapi.yaml 的漂移。
        run: bash scripts/ci/run-gate.sh PR_CONSOLE_OPENAPI_PATHS "Console controller 与 OpenAPI 路由同步" -- python3 scripts/ci/check-console-openapi-paths.py

      - name: Verify SQL/config placement boundaries
        if: needs.changes.outputs.java == 'true' || needs.changes.outputs.database == 'true' || needs.changes.outputs.scripts == 'true' || needs.changes.outputs.config == 'true' || needs.changes.outputs.ci == 'true'
        shell: bash
        run: bash scripts/ci/run-gate.sh PR_SQL_CONFIG_BOUNDARIES "SQL 与配置边界" -- bash scripts/ci/check-sql-config-boundaries.sh

      - name: No positional INSERT...SELECT * in mappers
        if: needs.changes.outputs.java == 'true' || needs.changes.outputs.database == 'true' || needs.changes.outputs.scripts == 'true' || needs.changes.outputs.ci == 'true'
        shell: bash
        # 拦「insert into archive.x_archive select *」位置式归档复制:列顺序漂移会静默错位
        # (ArchiveSchemaDriftCheck 只比对列名集合不比顺序)。必须用显式列名。
        run: bash scripts/ci/run-gate.sh PR_NO_POSITIONAL_INSERT_SELECT_STAR "禁止位置式 INSERT SELECT *" -- python3 scripts/ci/check-no-positional-insert-select-star.py

      - name: Limit MyBatis generated keys to the id column
        if: needs.changes.outputs.java == 'true' || needs.changes.outputs.database == 'true' || needs.changes.outputs.ci == 'true'
        shell: bash
        run: bash scripts/ci/run-gate.sh PR_MYBATIS_GENERATED_KEYS "MyBatis generated key 列限制" -- python3 scripts/ci/check-mybatis-generated-key-columns.py

      - name: No JDK preview flags in prod build/run config
        if: needs.changes.outputs.java == 'true' || needs.changes.outputs.config == 'true' || needs.changes.outputs.scripts == 'true' || needs.changes.outputs.ci == 'true'
        shell: bash
        # 拦 JDK preview 启用标记进入生产构建/运行(load-tests benchmark 豁免)。脚本内有详细说明。
        run: bash scripts/ci/run-gate.sh PR_NO_ENABLE_PREVIEW "禁止生产启用 JDK preview" -- bash scripts/ci/check-no-enable-preview.sh

      - name: No Map/List/Set.of swallowing nullable getMessage()
        if: needs.changes.outputs.java == 'true' || needs.changes.outputs.ci == 'true'
        shell: bash
        # 拦不可变工厂 Map.of/List.of/Set.of 直接吞裸 e.getMessage()(契约可 null)——
        # 值为 null 时 NPE 把干净 4xx 掩盖成 500(实锤 #752 / 388e43e39)。脚本内含自测,
        # 对 #752 修复前代码必报、对 requireNonNullElse 兜底后不误报。
        run: bash scripts/ci/run-gate.sh PR_MAPOF_NULL_VALUES "不可变集合空值风险" -- python3 scripts/ci/check-mapof-null-values.py

      - name: Verify pipeline summary key contract
        if: needs.changes.outputs.java == 'true' || needs.changes.outputs.ci == 'true'
        shell: bash
        # 拦两类「编译通过、CI 全绿、运行时静默」的键漂移:
        #   1) skippedStageCarryForwardKeys() 的回灌键不在 buildOutputSummary() 写入键内
        #      —— 阶段级续跑跳过时水位/计数静默丢失,下周期 INCREMENTAL 重读重发;
        #   2) 契约键(会被本类之外按字符串读的 key)同文件内既写字面量又写常量
        #      —— 常量改名时写方不动,字段名静默分叉。
        # 同时校验 output_summary 计数键与 batch-console pipelineStepSummary.ts 的声明一致。
        run: bash scripts/ci/run-gate.sh PR_PIPELINE_SUMMARY_KEYS "Pipeline 摘要键契约" -- python3 scripts/ci/check-pipeline-summary-keys.py

      - name: Test pipeline summary key contract checker
        if: needs.changes.outputs.java == 'true' || needs.changes.outputs.ci == 'true'
        shell: bash
        run: bash scripts/ci/run-gate.sh PR_PIPELINE_SUMMARY_KEYS_TEST "Pipeline 摘要键契约门禁测试" -- python3 -m unittest scripts/ci/tests/test_check_pipeline_summary_keys.py

      - name: Verify test @DisplayName conventions
        if: needs.changes.outputs.java == 'true' || needs.changes.outputs.ci == 'true'
        shell: bash
        # 口径见 docs/coding-conventions.md §14.5：类级 + 方法级都要中文 @DisplayName。
        # 历史存量走 docs/governance/test-conventions-baseline.txt，只拦新增缺口，不阻断无关 PR。
        run: bash scripts/ci/run-gate.sh PR_TEST_CONVENTIONS "测试 @DisplayName 约定" -- python3 scripts/ci/check-test-conventions.py --check-baseline docs/governance/test-conventions-baseline.txt

      - name: Test test-convention checker
        if: needs.changes.outputs.java == 'true' || needs.changes.outputs.ci == 'true'
        shell: bash
        run: bash scripts/ci/run-gate.sh PR_TEST_CONVENTIONS_TEST "测试 @DisplayName 约定门禁测试" -- python3 -m unittest scripts/ci/tests/test_check_test_conventions.py

      - name: Enforce centralized empty checks
        if: needs.changes.outputs.java == 'true' || needs.changes.outputs.ci == 'true'
        shell: bash
        # 只检查本 PR 新增的生产 Java 行，历史遗留由专项迁移逐步收口；从此禁止新增
        # == null / != null / isEmpty / isBlank 等零散判断，统一使用 EmptyChecks。
        run: bash scripts/ci/run-gate.sh PR_EMPTY_CHECKS "集中式空值检查" -- python3 scripts/ci/check-empty-checks.py --base "$GUARD_BASE"

      - name: Verify readiness contract documentation sync
        if: needs.changes.outputs.java == 'true' || needs.changes.outputs.docs == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.ci == 'true'
        shell: bash
        # readiness 涉及 trigger / asset_partition / result_version / API / 运维文档的跨模块契约。
        # 改实现但漏文档、API 或测试证据时直接 fail。
        run: bash scripts/ci/run-gate.sh PR_READINESS_DOC_SYNC "Readiness 契约文档同步" -- python3 scripts/ci/check-readiness-doc-sync.py --base "$GUARD_BASE"

      - name: Test readiness documentation sync guard
        run: python3 -m unittest scripts/ci/tests/test_check_readiness_doc_sync.py

      - name: Verify e2e shard lists cover all *E2eIT
        if: needs.changes.outputs.java == 'true' || needs.changes.outputs.ci == 'true'
        shell: bash
        # 守护 full-ci-gate / staging-gate 的硬编码 e2e shard 清单与实际 *E2eIT 一致,
        # 防新增 / 重命名后被静默漏跑(2026-06-14 实测漏 5 个)。
        run: bash scripts/ci/run-gate.sh PR_E2E_SHARD_COVERAGE "E2E shard 覆盖" -- bash scripts/ci/check-e2e-shard-coverage.sh

      - name: Verify CI -pl covers all tested reactor modules
        if: needs.changes.outputs.java == 'true' || needs.changes.outputs.ci == 'true'
        shell: bash
        # 守护根 reactor 里有测试的模块都被某 unit shard 的 -pl 覆盖,
        # 防新模块漏进 shard 被静默跳过(2026-06-14 实测 sdk×3 共 ~370 测试从未跑)。
        run: bash scripts/ci/run-gate.sh PR_MODULE_TEST_COVERAGE "Maven 测试模块覆盖" -- bash scripts/ci/check-module-test-coverage.sh

      - name: Verify full-ci covers all integration test modules
        if: needs.changes.outputs.java == 'true' || needs.changes.outputs.ci == 'true'
        shell: bash
        # 守护主 reactor 里含 *IntegrationTest / *IT 的模块都进入 full-ci-gate 的
        # `mvn verify -DskipITs=false` shard,防新增集成测试模块只在 PR unit 中出现、main 回退漏跑。
        run: bash scripts/ci/run-gate.sh PR_INTEGRATION_TEST_COVERAGE "集成测试覆盖" -- python3 scripts/ci/check-integration-test-coverage.py

      - name: Migration safety lint (squawk, diff-only)
        if: needs.changes.outputs.database == 'true' || needs.changes.outputs.ci == 'true'
        shell: bash
        # 只扫本 PR 新增/改动的 db/migration,拦危险 DDL(DROP COLUMN / 改类型 / 加 UNIQUE 长锁等)。
        run: bash scripts/ci/run-gate.sh PR_MIGRATION_SAFETY "数据库迁移安全" -- bash scripts/ci/check-migration-safety.sh "$GUARD_BASE"

      - name: Database comment coverage (diff-only)
        if: needs.changes.outputs.database == 'true' || needs.changes.outputs.ci == 'true'
        shell: bash
        # 新建业务表及状态/策略/载荷/幂等等关键字段必须在同一迁移声明注释；历史基线见审计文档。
        run: bash scripts/ci/run-gate.sh PR_DB_COMMENT_COVERAGE "数据库注释覆盖" -- bash scripts/ci/check-db-comment-coverage.sh "$GUARD_BASE"

      - name: Required Java architecture documentation
        if: needs.changes.outputs.java == 'true' || needs.changes.outputs.ci == 'true'
        shell: bash
        run: bash scripts/ci/run-gate.sh PR_REQUIRED_JAVA_DOCS "Java 架构文档完整性" -- bash scripts/ci/check-required-java-docs.sh

      - name: DB scripts safety lint (scripts/db/** 手工 DDL)
        if: needs.changes.outputs.database == 'true' || needs.changes.outputs.scripts == 'true' || needs.changes.outputs.ci == 'true'
        shell: bash
        # 补 squawk 盲区:batch_business 不走 Flyway,partition-migration / business 下的手工
        # DDL 脚本(改 UNIQUE/PK 列集 / DROP TABLE)不在迁移守护内。本步要求这类危险脚本头部
        # 必带禁令标记,并对 ON CONFLICT 提示核对幂等契约(docs/agent-baseline.md 红线)。
        run: bash scripts/ci/run-gate.sh PR_DB_SCRIPTS_SAFETY "数据库脚本安全" -- bash scripts/ci/check-db-scripts-safety.sh

      - name: Version and infrastructure image alignment
        if: needs.changes.outputs.java == 'true' || needs.changes.outputs.config == 'true' || needs.changes.outputs.ci == 'true'
        shell: bash
        # 校验应用版本落点、环境镜像标签和四项核心 Testcontainers 镜像一致。
        run: bash scripts/ci/run-gate.sh PR_VERSION_ALIGNMENT "应用与基础设施版本对齐" -- bash scripts/ci/check-version-alignment.sh

      - name: SDK and frontend runtime alignment
        shell: bash
        run: bash scripts/ci/run-gate.sh PR_SDK_RUNTIME_ALIGNMENT "SDK 与前端运行时版本对齐" -- python3 scripts/ci/check-sdk-runtime-alignment.py

      - name: Helm PrometheusRule sync (告警规则 chart 副本 ↔ canonical)
        if: needs.changes.outputs.config == 'true' || needs.changes.outputs.ci == 'true'
        shell: bash
        # helm/batch-platform/files/prometheus-batch-rules.yml 是 deploy/docker/observability 下
        # canonical 告警规则的 chart 副本(经 templates/prometheusrule.yaml 下发到 k8s)。
        # 改 canonical 忘同步 chart 副本 → k8s 与 docker 告警漂移(新关键告警生产没下发)。
        run: bash scripts/ci/run-gate.sh PR_HELM_PROMETHEUSRULE_SYNC "Helm 告警规则同步" -- bash scripts/ci/check-helm-prometheusrule-sync.sh

      - name: Logging and telemetry delivery contract
        if: needs.changes.outputs.java == 'true' || needs.changes.outputs.config == 'true' || needs.changes.outputs.scripts == 'true' || needs.changes.outputs.ci == 'true'
        shell: bash
        # 防止 OTLP 管道、Collector 队列/脱敏、Docker 日志上限或 JVM 诊断卷回归。
        run: bash scripts/ci/run-gate.sh PR_OBSERVABILITY_CONTRACT "日志与遥测交付契约" -- python3 scripts/ci/check-observability-contract.py

      - name: Five-worker configuration parity
        if: needs.changes.outputs.java == 'true' || needs.changes.outputs.config == 'true' || needs.changes.outputs.scripts == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.ci == 'true'
        shell: bash
        run: bash scripts/ci/run-gate.sh PR_FIVE_WORKER_PARITY "五类 Worker 配置一致性" -- python3 scripts/ci/check-five-worker-parity.py

      - name: KEDA autoscaling contracts
        if: needs.changes.outputs.config == 'true' || needs.changes.outputs.scripts == 'true' || needs.changes.outputs.ci == 'true'
        shell: bash
        run: bash scripts/ci/run-gate.sh PR_KEDA_AUTOSCALING "KEDA 自动伸缩契约" -- python3 scripts/ci/check-keda-autoscaling.py

      - name: Local log lifecycle contract
        if: needs.changes.outputs.scripts == 'true' || needs.changes.outputs.config == 'true' || needs.changes.outputs.ci == 'true'
        shell: bash
        run: bash scripts/ci/run-gate.sh PR_LOG_LIFECYCLE "本地日志生命周期" -- bash scripts/ci/check-log-lifecycle.sh

      - name: OpenAPI breaking-change (oasdiff)
        if: needs.changes.outputs.api == 'true' || needs.changes.outputs.ci == 'true'
        shell: bash
        # 比 base 的 openapi,删端点/删必填/改类型等 ERR 级破坏即 fail。
        run: bash scripts/ci/run-gate.sh PR_OPENAPI_BREAKING "OpenAPI 破坏性变更" -- bash scripts/ci/check-openapi-breaking.sh "$GUARD_BASE"

      - name: Biz table multi-tenant + RLS guard
        if: needs.changes.outputs.database == 'true' || needs.changes.outputs.ci == 'true'
        shell: bash
        # biz.* 基表必须含 tenant_id 且进 strict RLS tables[] 数组。
        run: bash scripts/ci/run-gate.sh PR_BIZ_TENANT_RLS "业务表多租户与 RLS" -- python3 scripts/ci/check-biz-table-tenant-rls.py

      - name: No silently-disabled tests
        if: needs.changes.outputs.java == 'true' || needs.changes.outputs.ci == 'true'
        shell: bash
        # @Disabled 必须带非空 reason(防覆盖率被静默掏空)。
        run: bash scripts/ci/run-gate.sh PR_NO_SILENT_DISABLED_TESTS "测试禁用原因检查" -- bash scripts/ci/check-no-silent-disabled-tests.sh

      - name: Java suppression registry
        if: needs.changes.outputs.java == 'true' || needs.changes.outputs.ci == 'true'
        shell: bash
        run: |
          bash scripts/ci/run-gate.sh PR_JAVA_SUPPRESSION_REGISTRY "Java 抑制项注册表" -- python3 scripts/ci/check-java-suppression-registry.py
          bash scripts/ci/run-gate.sh PR_JAVA_SUPPRESSION_REGISTRY_TEST "Java 抑制项注册表门禁测试" -- python3 -m unittest scripts/ci/tests/test_check_java_suppression_registry.py

      - name: Report all policy check failures
        if: always()
        shell: bash
        run: |
          source scripts/lib/gate-result.sh
          gate_assert_collected

  # ===========================================================================
  # Job 1b: static-supply-chain — SBOM / Trivy 供应链校验
  # 只在 Maven、镜像、Compose、Helm 或 Trivy 白名单输入变化时做重扫描。
  # ===========================================================================
  static-supply-chain:
    needs: changes
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BATCH_GATE_COLLECT: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve guard base ref
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          BASE="${BASE_REF}"
          git fetch --no-tags --depth=200 origin "$BASE" || git fetch --no-tags origin "$BASE"
          echo "GUARD_BASE=origin/${BASE}" >> "$GITHUB_ENV"

      - name: Detect supply-chain inputs
        id: supply
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "trivy-required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$GUARD_BASE"...HEAD)"
          if printf '%s\n' "$changed" | grep -Eq '(^pom\.xml$|/pom\.xml$|(^|/)Dockerfile[^/]*$|(^|/)docker-bake.*\.hcl$|(^|/)docker-compose.*\.ya?ml$|^deploy/docker/|^helm/|^\.trivyignore(\.yaml)?$)'; then
            echo "trivy-required=true" >> "$GITHUB_OUTPUT"
          else
            echo "trivy-required=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup build environment
        if: needs.changes.outputs.maven == 'true' || needs.changes.outputs.ci == 'true' || steps.supply.outputs.trivy-required == 'true'
        uses: ./.github/actions/setup-build-env
        with:
          cache-testcontainers: 'false'

      - name: Verify Trivy ignore expiry metadata
        if: needs.changes.outputs.config == 'true' || needs.changes.outputs.ci == 'true'
        shell: bash
        run: bash scripts/ci/run-gate.sh PR_TRIVY_IGNORE_EXPIRY "Trivy 忽略项有效期" -- python3 scripts/ci/check-trivy-ignore-expiry.py

      - name: Warm Maven cache for Trivy dependency resolution
        if: steps.supply.outputs.trivy-required == 'true'
        shell: bash
        run: bash scripts/ci/run-gate.sh PR_TRIVY_MAVEN_CACHE "Trivy Maven 依赖缓存预热" -- ./mvnw -B -ntp -DskipTests -Dmaven.test.skip=true -pl '!batch-e2e-tests' install

      - name: Verify tracked SBOM matches Maven dependencies
        if: needs.changes.outputs.maven == 'true' || needs.changes.outputs.ci == 'true'
        shell: bash
        run: bash scripts/ci/run-gate.sh PR_SBOM_SYNC "SBOM 依赖快照同步" -- bash scripts/ci/check-sbom-sync.sh

      - name: Trivy fs scan on supply-chain inputs
        if: steps.supply.outputs.trivy-required == 'true'
        shell: bash
        run: |
          source scripts/lib/gate-result.sh
          run_trivy_fs_scan() {
            local trivy_version=0.74.0
            curl -fsSL -o /tmp/trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${trivy_version}/trivy_${trivy_version}_Linux-64bit.tar.gz"
            tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
            sudo mv /tmp/trivy /usr/local/bin/trivy
            trivy fs --scanners vuln --ignorefile .trivyignore --severity CRITICAL,HIGH --exit-code 1 .
            trivy fs --scanners misconfig --ignorefile .trivyignore.yaml --severity CRITICAL,HIGH --exit-code 1 .
          }
          gate_run PR_TRIVY_FS_SCAN "Trivy 供应链文件扫描" run_trivy_fs_scan

      - name: Report all supply-chain check failures
        if: always()
        shell: bash
        run: |
          source scripts/lib/gate-result.sh
          gate_assert_collected

  # ===========================================================================
  # Job 1c: static-java-quality — 编译、PMD 与 Spotless
  # ===========================================================================
  static-java-quality:
    needs: changes
    if: |
      (needs.changes.outputs.java == 'true' || needs.changes.outputs.ci == 'true') &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BATCH_GATE_COLLECT: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env
        with:
          cache-testcontainers: 'false'

      - name: PMD + Spotless + compile
        shell: bash
        # test-compile 必要(PMD 需要 class 文件分析),不跑 surefire。
        run: bash scripts/ci/run-gate.sh PR_JAVA_STATIC_ANALYSIS "PMD、Spotless 与编译检查" -- ./mvnw -DskipTests test-compile pmd:check spotless:check -fae -B

      - name: Report all Java quality check failures
        if: always()
        shell: bash
        run: |
          source scripts/lib/gate-result.sh
          gate_assert_collected

  # ===========================================================================
  # Job 1d: static-checks — ruleset 绑定的稳定聚合 context
  # ===========================================================================
  static-checks:
    name: static-checks
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    needs:
      - changes
      - static-policy
      - static-supply-chain
      - static-java-quality
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify static check lanes
        shell: bash
        env:
          POLICY_RESULT: ${{ needs.static-policy.result }}
          SUPPLY_CHAIN_RESULT: ${{ needs.static-supply-chain.result }}
          JAVA_QUALITY_RESULT: ${{ needs.static-java-quality.result }}
        run: |
          [[ "$POLICY_RESULT" == "success" ]]
          [[ "$SUPPLY_CHAIN_RESULT" == "success" ]]
          [[ "$JAVA_QUALITY_RESULT" == "success" || "$JAVA_QUALITY_RESULT" == "skipped" ]]

  # ===========================================================================
  # 4 个 Maven unit 执行分片按依赖边界路由；B2 Worker / Console 并行后由
  # 稳定的 unit-it-b2 required context 聚合。
  # C 方案(2026-06-02):只跑 surefire unit(`mvn test -DskipITs`),IT 已搬到
  # full-ci-gate(main push 回退)+ staging-gate(nightly)。
  # required job 名 unit-it-a / unit-it-b1 / unit-it-b2 保留(ruleset context 锁定)。
  #
  # Job 2: unit-shard-1 — orchestrator + worker-core
  # ===========================================================================
  unit-it-a:
    needs: changes
    # 无 A 分片影响的变更跳过；Java SDK 变更属于 A 分片。
    if: |
      needs.changes.outputs.unit-a-required == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env

      - name: Run unit tests (orchestrator + worker-core + sdk×3)
        shell: bash
        # 先安装依赖闭包但不运行上游测试,再只测当前分片;避免 batch-common /
        # batch-test-support 的守卫与 Testcontainers 用例被多分片重复执行。
        run: |
          MODULES="batch-orchestrator,batch-worker/core,sdk/java/core,sdk/java/spring,sdk/java/testkit"
          ./mvnw install -pl "$MODULES" -am -DskipTests \
            -Dspotless.check.skip=true -Dpmd.skip=true -B
          ./mvnw test -pl "$MODULES" \
            -Dtest='!*IntegrationTest,!*ArchTest,!*ConventionTest' \
            -DskipITs=true -Dspotless.check.skip=true -Dpmd.skip=true \
            -fae -B

      - name: Verify changed-line coverage
        shell: bash
        run: |
          ./mvnw jacoco:report -pl batch-orchestrator,batch-worker/core,sdk/java/core,sdk/java/spring,sdk/java/testkit -B
          BASE="${{ github.event.pull_request.base.sha }}"
          [[ -n "$BASE" ]] || BASE="HEAD^"
          python3 scripts/ci/check-diff-coverage.py --base "$BASE" \
            --path batch-orchestrator --path batch-worker/core \
            --path sdk/java/core --path sdk/java/spring --path sdk/java/testkit

      - name: Upload Surefire Reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr-gate-unit-it-a-reports
          path: |
            **/target/surefire-reports/**
          retention-days: 14

  # ===========================================================================
  # Job 3: unit-shard-2 — common + trigger + worker-process + worker-dispatch
  # ===========================================================================
  unit-it-b1:
    needs: changes
    if: |
      needs.changes.outputs.unit-b1-required == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env

      - name: Run unit tests (common + test-support + trigger + worker-process + worker-dispatch)
        shell: bash
        run: |
          MODULES="batch-common,batch-test-support,batch-trigger,batch-worker/process,batch-worker/dispatch"
          ./mvnw install -pl "$MODULES" -am -DskipTests \
            -Dspotless.check.skip=true -Dpmd.skip=true -B
          ./mvnw test -pl "$MODULES" \
            -Dtest='!*IntegrationTest,!*ArchTest,!*ConventionTest' \
            -DskipITs=true -Dspotless.check.skip=true -Dpmd.skip=true \
            -fae -B

      - name: Verify changed-line coverage
        shell: bash
        run: |
          ./mvnw jacoco:report -pl batch-common,batch-trigger,batch-worker/process,batch-worker/dispatch -B
          BASE="${{ github.event.pull_request.base.sha }}"
          [[ -n "$BASE" ]] || BASE="HEAD^"
          python3 scripts/ci/check-diff-coverage.py --base "$BASE" \
            --path batch-common --path batch-trigger \
            --path batch-worker/process --path batch-worker/dispatch

      - name: Upload Surefire Reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr-gate-unit-it-b1-reports
          path: |
            **/target/surefire-reports/**
          retention-days: 14

  # ===========================================================================
  # Job 4a: worker-import + worker-export + worker-atomic
  # ===========================================================================
  unit-it-b2-workers:
    needs: changes
    if: |
      needs.changes.outputs.unit-b2-workers-required == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env

      - name: Run unit tests (worker-import + worker-export + worker-atomic)
        shell: bash
        run: |
          MODULES="batch-worker/import,batch-worker/export,batch-worker/atomic"
          ./mvnw install -pl "$MODULES" -am -DskipTests \
            -Dspotless.check.skip=true -Dpmd.skip=true -B
          ./mvnw test -pl "$MODULES" \
            -Dtest='!*IntegrationTest,!*ArchTest,!*ConventionTest' \
            -DskipITs=true -Dspotless.check.skip=true -Dpmd.skip=true \
            -fae -B

      - name: Verify changed-line coverage
        shell: bash
        run: |
          ./mvnw jacoco:report -pl batch-worker/import,batch-worker/export,batch-worker/atomic -B
          BASE="${{ github.event.pull_request.base.sha }}"
          [[ -n "$BASE" ]] || BASE="HEAD^"
          python3 scripts/ci/check-diff-coverage.py --base "$BASE" \
            --path batch-worker/import --path batch-worker/export \
            --path batch-worker/atomic

      - name: Upload Surefire Reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr-gate-unit-it-b2-workers-reports
          path: |
            **/target/surefire-reports/**
          retention-days: 14

  # ===========================================================================
  # Job 4b: Console API 独立分片，避免与三个 Worker 串成 PR 长尾。
  # ===========================================================================
  unit-it-b2-console:
    needs: changes
    if: |
      needs.changes.outputs.unit-b2-console-required == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env

      - name: Run unit tests (console-api)
        shell: bash
        run: |
          MODULES="batch-console-api"
          ./mvnw install -pl "$MODULES" -am -DskipTests \
            -Dspotless.check.skip=true -Dpmd.skip=true -B
          ./mvnw test -pl "$MODULES" \
            -Dtest='!*IntegrationTest,!*ArchTest,!*ConventionTest' \
            -DskipITs=true -Dspotless.check.skip=true -Dpmd.skip=true \
            -fae -B

      - name: Verify changed-line coverage
        shell: bash
        run: |
          ./mvnw jacoco:report -pl batch-console-api -B
          BASE="${{ github.event.pull_request.base.sha }}"
          [[ -n "$BASE" ]] || BASE="HEAD^"
          python3 scripts/ci/check-diff-coverage.py --base "$BASE" --path batch-console-api

      - name: Upload Surefire Reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr-gate-unit-it-b2-console-reports
          path: |
            **/target/surefire-reports/**
          retention-days: 14

  # ===========================================================================
  # Java 架构/约定守卫独立执行，不与业务 unit/IT 混合；失败仍汇入稳定 required context。
  # ==========================================================================
  java-governance:
    needs: changes
    if: |
      (needs.changes.outputs.unit-required == 'true' || needs.changes.outputs.ci == 'true') &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env
        with:
          cache-testcontainers: 'false'

      - name: Verify governance test inventory
        shell: bash
        run: python3 scripts/ci/check-java-governance-test-coverage.py

      - name: Run Java architecture and convention guards
        shell: bash
        run: bash scripts/ci/run-java-governance-tests.sh

      - name: Upload Java governance reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr-gate-java-governance-reports
          path: '**/target/surefire-reports/**'
          retention-days: 14

  # ===========================================================================
  # Required context 稳定聚合器：Ruleset 继续只依赖 unit-it-b2，
  # 同时将独立 Java 治理守卫的失败纳入必需 context。
  # ===========================================================================
  unit-it-b2:
    name: unit-it-b2
    if: >-
      always() &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    needs: [changes, unit-it-b2-workers, unit-it-b2-console, java-governance]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify split unit shard results
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
          WORKERS_RESULT: ${{ needs.unit-it-b2-workers.result }}
          CONSOLE_RESULT: ${{ needs.unit-it-b2-console.result }}
          GOVERNANCE_RESULT: ${{ needs.java-governance.result }}
        shell: bash
        run: |
          [[ "$SCOPE_RESULT" == "success" ]]
          [[ "$WORKERS_RESULT" == "success" || "$WORKERS_RESULT" == "skipped" ]]
          [[ "$CONSOLE_RESULT" == "success" || "$CONSOLE_RESULT" == "skipped" ]]
          [[ "$GOVERNANCE_RESULT" == "success" || "$GOVERNANCE_RESULT" == "skipped" ]]

  # ===========================================================================
  # NOTE: e2e-smoke 已从 pr-gate 移除(C 方案 #1)。
  # E2E(smoke + regression)全部交给 staging-gate.yml(nightly,6 shard 并发)
  # 和 full-ci-gate.yml(main push 后回退)。
  # 如需 PR 阶段重新引入 smoke,从 git history 恢复 e2e-smoke job。
  # ===========================================================================

  # ===========================================================================
  # Job 5: security-scan — secret scan(并发)
  # ===========================================================================
  security-scan:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env
        with:
          cache-testcontainers: 'false'

      - name: Install gitleaks
        shell: bash
        # security-scan jar 内部 fork 调 gitleaks 二进制(不内嵌),misc job 必须先装
        run: |
          GITLEAKS_VERSION=8.30.1
          curl -fsSL -o /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Security scan — secrets
        shell: bash
        # --skip-tests:绕开 security-scan 子模块单测(纯内部 orchestrator/options 逻辑,
        # 跟 scan 业务正确性无关;Java 25 + mockito javaagent 偶发 JVM crash 会让 PR 误挂)。
        # 单测仍由 main 的 full-ci-gate security-scan job 回退覆盖。
        run: bash scripts/ci/run-gate.sh PR_SECRET_SCAN "密钥泄漏扫描" -- bash scripts/ci/security-scan.sh --skip-tests -- --mode=secret
