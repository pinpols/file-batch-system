name: sdk-python

# Python SDK (sdk/python/) CI.
#
# Triggered ONLY by Python SDK or shared contract-fixture changes — Java
# CI (pr-gate / full-ci-gate) has matching paths-ignore entries for
# sdk/python/** so we never double-fire Maven on a Python-only PR.
#
# Lint and tests run on the minimum supported Python and current stable line.

on:
  pull_request:
    paths:
      - 'sdk/python/**'
      - '!sdk/python/**/*.md'   # 文档/README 改动不触发 python lint/test(2026-06-22)
      - 'docs/api/sdk-contract-fixtures/**'
      - '.github/workflows/sdk-python.yml'
  push:
    branches:
      - main
    paths:
      - 'sdk/python/**'
      - '!sdk/python/**/*.md'   # 文档/README 改动不触发 python lint/test(2026-06-22)
      - 'docs/api/sdk-contract-fixtures/**'
      - '.github/workflows/sdk-python.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-python-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: sdk/python

jobs:
  lint:
    name: lint (ruff + mypy, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
      - name: Install
        run: uv sync --locked --extra dev
      - name: ruff check
        run: uv run --locked ruff check src tests
      - name: ruff format --check
        run: uv run --locked ruff format --check src tests
      - name: mypy
        run: uv run --locked mypy src

  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v10
      - name: Install
        run: uv sync --locked --extra dev
      - name: pytest (excluding contract/)
        # tests/contract 由 sdk-contract-parity 的 "python contract stub + parity stub"
        # 统一跑(跨语言契约对账的权威处),此处不重复(2026-06-22 CI 去重)。
        run: uv run --locked pytest -v --ignore=tests/contract
