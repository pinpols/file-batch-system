name: staging-gate

# 全量 E2E（含 regression）的手动回归 workflow；不执行 staging 集群部署。
# main 代码变更由 full-ci-gate 执行同一 E2E 清单；无变更时不额外每日重复跑。
# workflow_dispatch 用于排障后的复验或维护者主动要求的全量回归。
#
# 与 pr-gate 关系:
#   - PR Gate 按变更范围执行静态检查和测试分片；Full CI Gate 在 main push 后也运行 E2E。
#   - 本 workflow 跑全量 E2E，按 shard 并发；用例清单由治理脚本核对。
#   - Java 架构/约定守卫独立并发执行,不计入 E2E shard 的业务验收结果与耗时。
#
# 与 full-ci-gate 关系:
#   - full-ci-gate(main push/每周回归)已并行跑全量 e2e-shard；本 workflow 仅手动触发，
#     用于独立复验，**不替代** full-ci-gate，也不执行 staging rollout。
#
# 标签策略详见 docs/runbook/e2e-tier-strategy.md。

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Java 架构/约定守卫与 E2E 并发，保证手动全量回归也覆盖治理测试。
  java-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env
        with:
          cache-testcontainers: 'false'

      - name: Verify Console OpenAPI matches controllers
        run: bash scripts/ci/run-gate.sh --group contract STAGING_CONSOLE_OPENAPI "Console controller 与 OpenAPI 路由同步" -- python3 scripts/ci/check-console-openapi-paths.py

      - name: Verify governance test inventory
        shell: bash
        run: bash scripts/ci/run-gate.sh --group governance STAGING_JAVA_GOVERNANCE_INVENTORY "Java 治理测试清单" -- python3 scripts/ci/check-java-governance-test-coverage.py

      - name: Run Java architecture and convention guards
        shell: bash
        run: bash scripts/ci/run-gate.sh --group governance STAGING_JAVA_GOVERNANCE_TESTS "Java 架构与约定检查" -- bash scripts/ci/run-java-governance-tests.sh

      - name: Upload Java governance reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: staging-gate-java-governance-reports
          path: '**/target/surefire-reports/**'
          retention-days: 14

  # ===========================================================================
  # e2e-shard:全量 E2E 并发,无 tag 过滤(smoke + critical + regression 全跑)。
  # 原六片保留历史基线；新增场景独立分片，实际耗时待 CI 测量。
  # ===========================================================================
  e2e-shard-full:
    name: 'E2E ${{ matrix.shard.id }} / ${{ matrix.shard.label }}'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (contains(matrix.shard.tests, 'shouldStopAtomicSparkReplay') || matrix.shard.tests == 'WorkerReportLostAfterBusinessCommitE2eIT') && 45 || 40 }}
    env:
      TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /var/run/docker.sock
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        shard:
          - id: 1
            label: "158s baseline"
            tests: >-
              WorkerProcessRestartRecoveryE2eIT,
              ImportFailureE2eIT,
              FullChainTenantPropagationE2eIT
          - id: 2
            label: "179s baseline"
            tests: >-
              DeadLetterApprovalReplayE2eIT,
              AtomicSeedStrictVerifyE2eIT,
              AtomicTaskPipelineE2eIT,
              ImportFailurePipelineE2eIT,
              DedupJobLaunchE2eIT,
              ImportToExportDeliveryE2eIT
          - id: 3
            label: "177s baseline"
            tests: >-
              ProcessPipelineE2eIT,
              TriggerAsyncLaunchFullChainE2eIT,
              DispatchFailurePipelineE2eIT,
              OutboxForwarderRetryE2eIT,
              SensorWaitFixtureE2eIT
          - id: 4
            label: "176s baseline"
            tests: >-
              AtomicMixedScenarioE2eIT,
              ImportPipelineE2eIT,
              WorkerDrainE2eIT,
              ExportPipelineE2eIT,
              OutboxPollMarginsYamlE2eIT
          - id: 5
            label: "159s baseline"
            tests: >-
              ExportStorageFailureE2eIT,
              ExportFailurePipelineE2eIT,
              ProcessFailurePipelineE2eIT,
              OutboxForwarderE2eIT,
              SdkAgainstStubOrchestratorE2eIT
          - id: 6
            label: "148s baseline"
            tests: >-
              ExportContentVerificationE2eIT,
              MultiTenantConcurrentE2eIT,
              DispatchPipelineE2eIT,
              AtomicTaskLoadE2eIT
          - id: 7
            label: "business commit recovery"
            tests: >-
              WorkerReportLostAfterBusinessCommitE2eIT#shouldRecoverWhenReportAcknowledgementIsLostAfterCommitAndWorkerRestarts+shouldResumeImportCheckpointAfterWorkerProcessIsKilled+shouldCompleteReclaimedAttemptOnReplacementWorker_withoutDuplicateBusinessEffect+shouldReuseProcessCommitAfterReclaim_withoutDuplicateBusinessEffect+shouldReplayProcessPublish_whenCommitResponseIsLostAfterDatabaseCommit
          - id: 8
            label: "workflow catch-up and approval 1"
            tests: >-
              WorkflowOccurrenceCatchUpApprovalE2eIT#shouldConsumePinnedVersion_whenUpstreamVersionPromoted+triggerApiAdmissionRacingBatchDaySettlementShouldConverge+consoleManualAdmissionRacingBatchDaySettlementShouldConverge+dstHolidayQuartzMisfire_completesWorkerBeforeBatchDaySettlement+triggerRestart_resumesBoundedTwoDayCoverageBeforeBatchDaySettlement+manualMisfireApprovalRacingSettlement_completesWorkerBeforeBatchDaySettlement+shouldReconcileAndContinueManualBatchAfterRealApprovalResponseLoss+shouldBlockPersistedBusinessDay_whenDstCutoffOccurrencePending+rejectedManualMisfire_closesOccurrenceBeforeEmptyDaySettlement+shouldKeepCalendarBusinessDate_whenFireCrossesUtcMidnight+duplicateQuartzMisfireCallbacks_createOneRootRunAndBusinessEffect+expiredManualMisfire_closesOccurrenceBeforeEmptyDaySettlement+approvalOfConsoleCatchUp_reconcilesAndLaunchesWorkflowNode+shouldConvergeCoverage_whenPublicationAndSettlementRace+scheduledAdmissionBeforeSettlement_keepsOccurrenceBlocking
          - id: 9
            label: "stale report fence"
            tests: >-
              StaleWorkerReportFenceE2eIT
          - id: 10
            label: "self-service compensation"
            tests: >-
              SelfServiceJobCompensationHttpE2eIT
          - id: 11
            label: "Kafka namespace isolation"
            tests: >-
              KafkaConsumerNamespaceIsolationE2eIT,
              AtomicWorkerKafkaNamespaceIsolationE2eIT,
              DispatchWorkerKafkaNamespaceIsolationE2eIT,
              ExportWorkerKafkaNamespaceIsolationE2eIT,
              ProcessWorkerKafkaNamespaceIsolationE2eIT
          - id: 12
            label: "launch and replay recovery"
            tests: >-
              LaunchProcessCrashRecoveryE2eIT,
              ReadinessHandoverE2eIT,
              ReplayAdmissionRecoveryE2eIT
          - id: 13
            label: "approval and notification"
            tests: >-
              ApprovalSourceReconciliationE2eIT,
              JobSlaAlertmanagerIdentityE2eIT,
              TriggerLaunchRecoveryE2eIT,
              WorkflowTerminalNotificationE2eIT,
              JobPushProcessRecoveryE2eIT
          - id: 14
            label: "export and SDK recovery"
            tests: >-
              ExportPartitionContentE2eIT,
              SdkOrdinaryLeaseRecoveryE2eIT
          - id: 15
            label: "terminal recovery and workflow catch-up"
            tests: >-
              WorkflowTerminalNotificationProcessRecoveryE2eIT,
              WorkflowOccurrenceCatchUpApprovalE2eIT#shouldReconcileBatchDayAutoAfterConsoleProcessCrash+workflowRerunAdmissionRacingBatchDaySettlementShouldConverge+externalEventApiAdmissionRacingBatchDaySettlementShouldConverge+shouldApproveRestartedMisfire_whenConsoleAuthenticated+shouldExposeAuthoritativeAudit_whenEmptyDaySettled+shouldReconcileBatchDayAutoAfterRealTriggerResponseIsDropped+cutoffScheduledFire_completesWorkerBeforeBatchDaySettlement+triggerRestart_recoversOccurrenceCoverageBeforeBatchDaySettlement+cutoffCompositeWorkflow_waitsForBothWorkerJobsBeforeBatchDaySettlement+externalEventApi_fansOutToWorkersAndReportsTargetResults+disabledWorkflow_autoMisfireReconcilesToWorkerBusinessSuccess+crossDayDependencyWait_recoversRootPayloadAndCompletesImportBusinessEffect+consoleManualTrigger_preservesExplicitBizDateThroughWorkerAndSettlement+shouldConvergeCoverage_whenConfigurationAndSettlementRace+shouldPreserveSnapshotsAndObligations_whenDefinitionsChangeAfterOpen+settlementFirstScheduledQuartzCallback_doesNotReviveSkippedOccurrence
          - id: 16
            label: "recovery methods 2"
            tests: >-
              WorkerReportLostAfterBusinessCommitE2eIT#shouldNotDuplicateDispatchSideEffect_whenWorkerIsReclaimedAfterDelivery+shouldNotRedeliverAfterWorkerCrash_whenApiPushAcceptedBeforeOutcomePersisted+shouldReuseOssObjectsAfterReclaim_whenReportWasLostAfterManifestCommit+shouldNotUploadAfterWorkerCrash_whenOssObjectCommittedBeforeAcknowledgement+shouldNotRedeliverAfterWorkerCrash_whenSmtpAcceptedMessageBeforeOutcomePersisted
          - id: 17
            label: "recovery methods 3"
            tests: >-
              WorkerReportLostAfterBusinessCommitE2eIT#shouldDeduplicateAtomicHttpSideEffect_whenWorkerIsReclaimedAfterDelivery+shouldStopAtomicReplayAfterNonIdempotentSideEffect_whenWorkerIsReclaimed+shouldStopAtomicShellReplay_whenWorkerCrashesAfterFilesystemSideEffect+shouldStopAtomicSparkReplay_whenWorkerCrashesAfterSparkOutputCommit+shouldStopAtomicSparkReplay_whenWorkerJvmCrashesDuringActiveSparkAction
          - id: 18
            label: "recovery methods 4"
            tests: >-
              WorkerReportLostAfterBusinessCommitE2eIT#shouldStopAtomicSqlReplay_whenWorkerCrashesAfterDatabaseCommit+shouldStopAtomicStoredProcReplay_whenWorkerCrashesAfterDatabaseCommit+shouldReuseExportArtifactAfterReclaimOnReplacementWorker_withoutDuplicateFileRecord
          - id: 19
            label: "filesystem storage backend"
            tests: >-
              FilesystemBackendPipelineE2eIT
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env

      - name: Setup Python for Spark recovery scenarios
        if: (contains(matrix.shard.tests, 'shouldStopAtomicSparkReplay') || matrix.shard.tests == 'WorkerReportLostAfterBusinessCommitE2eIT')
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      - name: Prepare verified Spark runtime
        if: (contains(matrix.shard.tests, 'shouldStopAtomicSparkReplay') || matrix.shard.tests == 'WorkerReportLostAfterBusinessCommitE2eIT')
        run: python3 scripts/local/spark-e2e-runtime.py --prepare

      - name: Cleanup orphan testcontainers (pre-IT)
        shell: bash
        run: |
          docker ps --filter "label=org.testcontainers=true" \
            --format '{{.ID}} {{.Labels}}' | \
            awk '$0 !~ /reuse-hash/ {print $1}' | \
            xargs -r docker rm -f >/dev/null 2>&1 || true

      - name: Install upstream modules to ~/.m2 (skip tests)
        shell: bash
        # 与 full-ci-gate 共用，避免依赖仓库临时 5xx 误报 staging/E2E 失败。
        run: bash scripts/ci/install-upstream-modules.sh

      - name: Run E2E shard ${{ matrix.shard.id }} (${{ matrix.shard.label }})
        shell: bash
        # **不加** -Pe2e-smoke,本 workflow 故意跑全量(含 regression tag)。
        # `-Dtest=` 指定 IT class 列表;-Dsurefire.failIfNoSpecifiedTests=false 防止
        # 某 shard 上没匹配类时空跑也成功而误报。
        run: |
          TESTS="${{ matrix.shard.tests }}"
          TESTS=$(echo "$TESTS" | tr -d ' \n')
          if [[ "$TESTS" == *shouldStopAtomicSparkReplay* || "$TESTS" == "WorkerReportLostAfterBusinessCommitE2eIT" ]]; then
            python3 scripts/local/spark-e2e-runtime.py -- ./mvnw test -pl batch-e2e-tests \
              -Dtest="$TESTS" -Dsurefire.failIfNoSpecifiedTests=false -B
          elif [[ "$TESTS" == "FilesystemBackendPipelineE2eIT" ]]; then
            ./mvnw test -pl batch-e2e-tests -Dbatch.test.storage.backend=filesystem \
              -Dtest="$TESTS" -Dsurefire.failIfNoSpecifiedTests=false -B
          else
            ./mvnw test -pl batch-e2e-tests \
              -Dtest="$TESTS" -Dsurefire.failIfNoSpecifiedTests=false -B
          fi

      - name: Verify E2E shard ${{ matrix.shard.id }} run completeness
        shell: bash
        # 运行侧闭环:failIfNoSpecifiedTests=false 会把「清单列了但没真跑」吞成绿色。
        # 校验类报告至少有执行用例；方法分片还需逐项匹配，不能仅以文件存在认定通过。
        run: |
          bash scripts/ci/run-gate.sh STAGING_E2E_RUN_COMPLETENESS "E2E shard 实际运行完整性" -- \
            bash scripts/ci/check-e2e-run-completeness.sh \
              "${{ matrix.shard.tests }}" \
              batch-e2e-tests/target/surefire-reports

      - name: Upload E2E shard ${{ matrix.shard.id }} reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: staging-gate-e2e-shard-${{ matrix.shard.id }}-reports
          path: |
            batch-e2e-tests/target/surefire-reports/**
          retention-days: 14

  test-summary:
    name: 'Staging tests / consolidated report'
    if: always()
    needs: [java-governance, e2e-shard-full]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download test reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: staging-gate-*-reports
          path: build/ci-test-reports
      - name: Summarize test results and job states
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p build/ci-quality
          printf '%s' "$JOB_RESULTS" > build/ci-quality/jobs.json
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | .name' > build/ci-quality/artifact-names.txt
          python3 scripts/ci/report-ci-quality-trends.py --reports-root build/ci-test-reports --artifact-names build/ci-quality/artifact-names.txt \
            --artifact-pattern 'staging-gate-*-reports' \
            --jobs-json build/ci-quality/jobs.json --json build/ci-quality/metrics.json \
            --expect-artifact java-governance=staging-gate-java-governance-reports \
            --expect-e2e-workflow .github/workflows/staging-gate.yml \
            --expect-e2e-job e2e-shard-full --expect-e2e-prefix staging-gate \
            --markdown build/ci-quality/summary.md
      - name: Upload consolidated test report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: staging-gate-test-summary
          path: build/ci-quality/
          retention-days: 14
