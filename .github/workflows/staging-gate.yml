name: staging-gate

# 全量 E2E（含 regression）的手动回归 workflow；不执行 staging 集群部署。
# main 代码变更由 full-ci-gate 执行同一 E2E 清单；无变更时不额外每日重复跑。
# workflow_dispatch 用于排障后的复验或维护者主动要求的全量回归。
#
# 与 pr-gate 关系:
#   - PR Gate 按变更范围执行静态检查和测试分片；Full CI Gate 在 main push 后也运行 E2E。
#   - 本 workflow 跑全量 E2E，按 6 个 shard 并发；用例清单由治理脚本核对。
#   - Java 架构/约定守卫独立并发执行,不计入 E2E shard 的业务验收结果与耗时。
#
# 与 full-ci-gate 关系:
#   - full-ci-gate(main push/每周回归)已并行跑全量 e2e-shard；本 workflow 仅手动触发，
#     用于独立复验，**不替代** full-ci-gate，也不执行 staging rollout。
#
# 标签策略详见 docs/runbook/e2e-tier-strategy.md。

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Java 架构/约定守卫与 E2E 并发，保证手动全量回归也覆盖治理测试。
  java-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env
        with:
          cache-testcontainers: 'false'

      - name: Verify governance test inventory
        shell: bash
        run: python3 scripts/ci/check-java-governance-test-coverage.py

      - name: Run Java architecture and convention guards
        shell: bash
        run: bash scripts/ci/run-java-governance-tests.sh

      - name: Upload Java governance reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: staging-gate-java-governance-reports
          path: '**/target/surefire-reports/**'
          retention-days: 14

  # ===========================================================================
  # e2e-shard:全量 E2E 6 shard 并发,无 tag 过滤(smoke + critical + regression
  # 全跑)。分组沿用 full-ci-gate 的 2026-10-07 实测 LPT 均衡结果。
  # ===========================================================================
  e2e-shard-full:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /var/run/docker.sock
    strategy:
      fail-fast: false
      matrix:
        shard:
          - id: 1
            label: "158s baseline"
            tests: >-
              WorkerProcessRestartRecoveryE2eIT,
              ImportFailureE2eIT,
              FullChainTenantPropagationE2eIT
          - id: 2
            label: "179s baseline"
            tests: >-
              DeadLetterApprovalReplayE2eIT,
              AtomicSeedStrictVerifyE2eIT,
              AtomicTaskPipelineE2eIT,
              ImportFailurePipelineE2eIT,
              DedupJobLaunchE2eIT
          - id: 3
            label: "177s baseline"
            tests: >-
              ProcessPipelineE2eIT,
              TriggerAsyncLaunchFullChainE2eIT,
              DispatchFailurePipelineE2eIT,
              OutboxForwarderRetryE2eIT,
              SensorWaitFixtureE2eIT
          - id: 4
            label: "176s baseline"
            tests: >-
              AtomicMixedScenarioE2eIT,
              ImportPipelineE2eIT,
              WorkerDrainE2eIT,
              ExportPipelineE2eIT,
              OutboxPollMarginsYamlE2eIT
          - id: 5
            label: "159s baseline"
            tests: >-
              ExportStorageFailureE2eIT,
              ExportFailurePipelineE2eIT,
              ProcessFailurePipelineE2eIT,
              OutboxForwarderE2eIT,
              SdkAgainstStubOrchestratorE2eIT
          - id: 6
            label: "148s baseline"
            tests: >-
              ExportContentVerificationE2eIT,
              MultiTenantConcurrentE2eIT,
              DispatchPipelineE2eIT,
              AtomicTaskLoadE2eIT,
              FilesystemBackendPipelineE2eIT
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env

      - name: Cleanup orphan testcontainers (pre-IT)
        shell: bash
        run: |
          docker ps --filter "label=org.testcontainers=true" \
            --format '{{.ID}} {{.Labels}}' | \
            awk '$0 !~ /reuse-hash/ {print $1}' | \
            xargs -r docker rm -f >/dev/null 2>&1 || true

      - name: Install upstream modules to ~/.m2 (skip tests)
        shell: bash
        # 与 full-ci-gate 共用，避免依赖仓库临时 5xx 误报 staging/E2E 失败。
        run: bash scripts/ci/install-upstream-modules.sh

      - name: Run E2E shard ${{ matrix.shard.id }} (${{ matrix.shard.label }})
        shell: bash
        # **不加** -Pe2e-smoke,本 workflow 故意跑全量(含 regression tag)。
        # `-Dtest=` 指定 IT class 列表;-Dsurefire.failIfNoSpecifiedTests=false 防止
        # 某 shard 上没匹配类时空跑也成功而误报。
        run: |
          TESTS="${{ matrix.shard.tests }}"
          TESTS=$(echo "$TESTS" | tr -d ' \n')
          ./mvnw test -pl batch-e2e-tests \
            -Dtest="$TESTS" \
            -Dsurefire.failIfNoSpecifiedTests=false -B

      - name: Verify E2E shard ${{ matrix.shard.id }} run completeness
        shell: bash
        # 运行侧闭环:failIfNoSpecifiedTests=false 会把「清单列了但没真跑」吞成绿色。
        # 比对本 shard 实际产出的 surefire testsuite report 数 == 清单声明的类数,不等则 fail。
        run: |
          bash scripts/ci/run-gate.sh STAGING_E2E_RUN_COMPLETENESS "E2E shard 实际运行完整性" -- \
            bash scripts/ci/check-e2e-run-completeness.sh \
              "${{ matrix.shard.tests }}" \
              batch-e2e-tests/target/surefire-reports

      - name: Upload E2E shard ${{ matrix.shard.id }} reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: staging-gate-e2e-shard-${{ matrix.shard.id }}-reports
          path: |
            batch-e2e-tests/target/surefire-reports/**
          retention-days: 14
