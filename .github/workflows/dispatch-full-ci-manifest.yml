name: Backend / Dispatch Full CI for schema manifest review

# 一次性辅助：云代理令牌只有 actions:read，不能直接 workflow_dispatch。
# 其他 PR 的 head 分支不匹配时 job 跳过。

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: dispatch-full-ci-manifest-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dispatch-full-ci:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'cursor/dispatch-full-ci-manifest-387a'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      # 否定缓存删除已登记基线后，按分支名重新派发，解析当时的远端 HEAD。
      - name: Dispatch full-ci-gate on the schema manifest fix branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow run full-ci-gate.yml --repo "${GH_REPO}" --ref cursor/fix-rolling-month-schema-manifest-387a
