    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env

      - name: Setup Python for Spark recovery scenarios
        if: (contains(matrix.shard.tests, 'shouldStopAtomicSparkReplay') || matrix.shard.tests == 'WorkerReportLostAfterBusinessCommitE2eIT')
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      - name: Prepare verified Spark runtime
        if: (contains(matrix.shard.tests, 'shouldStopAtomicSparkReplay') || matrix.shard.tests == 'WorkerReportLostAfterBusinessCommitE2eIT')
        run: python3 scripts/local/spark-e2e-runtime.py --prepare

      - name: Install upstream modules to ~/.m2 (skip tests)
        shell: bash
        # 共享脚本保留原 reactor 范围，并对 Maven Central 临时 5xx 做有限重试。
        run: bash scripts/ci/install-upstream-modules.sh

      - name: Run E2E shard ${{ matrix.shard.id }} (${{ matrix.shard.label }})
        shell: bash
        run: |
          # `-Dtest=` 给 surefire 指定要跑的 IT class 列表(逗号分隔)。
          # batch-e2e-tests 用 surefire 而非 failsafe 跑 *E2eIT(见该 module pom)。
          TESTS="${{ matrix.shard.tests }}"
          # 去掉 YAML 折行引入的空白
          TESTS=$(echo "$TESTS" | tr -d ' \n')
          if [[ "$TESTS" == *shouldStopAtomicSparkReplay* || "$TESTS" == "WorkerReportLostAfterBusinessCommitE2eIT" ]]; then
            python3 scripts/local/spark-e2e-runtime.py -- ./mvnw test -pl batch-e2e-tests \
              -Dtest="$TESTS" -Dsurefire.failIfNoSpecifiedTests=false -B
          elif [[ "$TESTS" == "FilesystemBackendPipelineE2eIT" ]]; then
            ./mvnw test -pl batch-e2e-tests -Dbatch.test.storage.backend=filesystem \
              -Dtest="$TESTS" -Dsurefire.failIfNoSpecifiedTests=false -B
          else
            ./mvnw test -pl batch-e2e-tests \
              -Dtest="$TESTS" -Dsurefire.failIfNoSpecifiedTests=false -B
          fi

      - name: Verify E2E shard ${{ matrix.shard.id }} run completeness
        shell: bash
        # 运行侧闭环:failIfNoSpecifiedTests=false 会把「清单列了但没真跑」吞成绿色。
        # 校验类报告至少有执行用例；方法分片还需逐项匹配，不能仅以文件存在认定通过。
        run: |
          bash scripts/ci/check-e2e-run-completeness.sh \
            "${{ matrix.shard.tests }}" \
            batch-e2e-tests/target/surefire-reports

      - name: Upload catch-up child-process diagnostics
        if: failure() && contains(matrix.shard.tests, 'WorkflowOccurrenceCatchUpApprovalE2eIT')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: full-ci-catchup-process-diagnostics-${{ matrix.shard.id }}
          path: logs/verification/backend25-2026-10-30/batchday-process/*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload E2E shard ${{ matrix.shard.id }} reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: full-ci-e2e-shard-${{ matrix.shard.id }}-reports
          path: |
            batch-e2e-tests/target/surefire-reports/**
          retention-days: 14

  scheduled-test-quality:
    name: scheduled flaky quarantine and critical mutation
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env

      - name: Run flaky quarantine
        shell: bash
        run: bash scripts/ci/run-flaky-quarantine.sh

      - name: Run scoped critical mutation tests
        shell: bash
        run: bash scripts/ci/run-critical-mutation.sh

      - name: Upload scheduled test quality evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: scheduled-test-quality-evidence
          path: |
            **/target/pit-reports/**
            **/target/surefire-reports/**
          retention-days: 30
          if-no-files-found: warn

  quality-trend:
    name: CI and test quality trend
    if: always()
    needs: [unit-it-a, unit-it-a-main, unit-it-a-heavy, unit-it-b1, unit-it-b2-workers, unit-it-b2, java-governance, e2e-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download test reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: full-ci-*-reports
          path: build/ci-test-reports

      - name: Generate CI quality trend
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          mkdir -p build/ci-quality
          printf '%s' "$JOB_RESULTS" > build/ci-quality/jobs.json
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | .name' > build/ci-quality/artifact-names.txt
          gh api "repos/${REPO}/actions/workflows/full-ci-gate.yml/runs?per_page=30" \
            > build/ci-quality/workflow-runs.json
          python3 scripts/ci/report-ci-quality-trends.py \
            --reports-root build/ci-test-reports --artifact-names build/ci-quality/artifact-names.txt \
            --artifact-pattern 'full-ci-*-reports' \
            --workflow-runs-json build/ci-quality/workflow-runs.json \
            --jobs-json build/ci-quality/jobs.json \
            --expect-artifact unit-it-a-main=full-ci-unit-it-a-main-reports \
            --expect-artifact unit-it-a-heavy=full-ci-unit-it-a-heavy-reports \
            --expect-artifact unit-it-b1=full-ci-unit-it-b1-reports \
            --expect-artifact unit-it-b2-workers=full-ci-unit-it-b2-workers-reports \
            --expect-artifact unit-it-b2=full-ci-unit-it-b2-console-reports \
            --expect-artifact java-governance=full-ci-java-governance-reports \
            --expect-e2e-workflow .github/workflows/full-ci-gate.yml \
            --expect-e2e-job e2e-shard --expect-e2e-prefix full-ci \
            --json build/ci-quality/metrics.json \
            --markdown build/ci-quality/summary.md

      - name: Upload CI quality trend
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: full-ci-quality-trend
          path: build/ci-quality/**
          retention-days: 90

  main-failure-triage:
    name: main full-gate failure triage
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      (
        needs.static-checks.result == 'failure' ||
        needs.unit-it-a.result == 'failure' ||
        needs.unit-it-b1.result == 'failure' ||
        needs.unit-it-b2-workers.result == 'failure' ||
        needs.unit-it-b2.result == 'failure' ||
        needs.java-governance.result == 'failure' ||
        needs.security-scan.result == 'failure' ||
        needs.e2e-shard.result == 'failure' ||
        needs.scheduled-test-quality.result == 'failure' ||
        needs.quality-trend.result == 'failure'
      )
    needs:
      - static-checks
      - unit-it-a
      - unit-it-b1
      - unit-it-b2-workers
      - unit-it-b2
      - java-governance
      - security-scan
      - e2e-shard
      - scheduled-test-quality
      - quality-trend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Label and notify associated PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          create_label() {
            local name="$1"
            local color="$2"
            local description="$3"
            gh api "repos/${REPO}/labels/${name}" >/dev/null 2>&1 && return 0
            gh api "repos/${REPO}/labels" \
              -X POST \
              -f "name=${name}" \
              -f "color=${color}" \
              -f "description=${description}" >/dev/null
          }

          create_label "main-broken" "B60205" "main full-ci-gate is red after this change"
          create_label "needs-fix" "D93F0B" "requires a follow-up fix or revert"

          short_sha="${HEAD_SHA:0:12}"
          body_file="$(mktemp)"
          cat >"${body_file}" <<EOF
          <!-- main-full-gate-triage -->
          main 上的 \`full-ci-gate\` 已失败，当前主干不可发布。

          - full-gate run: ${RUN_URL}
          - head sha: \`${HEAD_SHA}\`
          - branch: \`main\`

          处理要求：
          1. 先暂停发布，不以单个 PR gate 绿作为上线依据。
          2. PR 作者或维护者确认失败根因。
          3. 小修走 follow-up PR；风险不清或影响上线窗口时优先 revert 原 PR。
          4. 等 main 最新 \`full-ci-gate\` 重新变绿后再恢复发布判断。
          EOF

          mapfile -t associated_prs < <(
            gh api "repos/${REPO}/commits/${HEAD_SHA}/pulls" \
              -H "Accept: application/vnd.github+json" \
              --jq '.[] | select(.base.ref == "main") | .number'
          )

          if ((${#associated_prs[@]} > 0)); then
            for pr in "${associated_prs[@]}"; do
              gh api "repos/${REPO}/issues/${pr}/labels" \
                -X POST \
                -f "labels[]=main-broken" \
                -f "labels[]=needs-fix" >/dev/null

              existing_comment_id="$(
                gh api "repos/${REPO}/issues/${pr}/comments" \
                  --paginate \
                  --jq ".[] | select(.body | contains(\"<!-- main-full-gate-triage -->\") and contains(\"${HEAD_SHA}\")) | .id" \
                  | head -1
              )"
              if [[ -z "${existing_comment_id}" ]]; then
                gh pr comment "${pr}" --repo "${REPO}" --body-file "${body_file}"
              fi
            done
            exit 0
          fi

          issue_title="[main-broken] full-ci-gate failed at ${short_sha}"
          existing_issue="$(
            gh issue list \
              --repo "${REPO}" \
              --state open \
              --label main-broken \
              --search "${short_sha} in:title" \
              --json number \
              --jq '.[0].number // empty'
          )"
          if [[ -z "${existing_issue}" ]]; then
            gh issue create \
              --repo "${REPO}" \
              --title "${issue_title}" \
              --body-file "${body_file}" \
              --label main-broken \
              --label needs-fix
          fi
