              WorkerReportLostAfterBusinessCommitE2eIT#shouldStopAtomicSqlReplay_whenWorkerCrashesAfterDatabaseCommit+shouldStopAtomicStoredProcReplay_whenWorkerCrashesAfterDatabaseCommit+shouldReuseExportArtifactAfterReclaimOnReplacementWorker_withoutDuplicateFileRecord
          - id: 19
            label: "filesystem storage backend"
            tests: >-
              FilesystemBackendPipelineE2eIT
          - id: 20
            label: "configuration and alert delivery boundaries"
