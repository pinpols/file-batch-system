          - id: 17
            label: "atomic HTTP, shell and Spark recovery"
            tests: >-
              WorkerReportLostAfterBusinessCommitE2eIT#shouldDeduplicateAtomicHttpSideEffect_whenWorkerIsReclaimedAfterDelivery+shouldStopAtomicReplayAfterNonIdempotentSideEffect_whenWorkerIsReclaimed+shouldStopAtomicShellReplay_whenWorkerCrashesAfterFilesystemSideEffect+shouldStopAtomicSparkReplay_whenWorkerCrashesAfterSparkOutputCommit+shouldStopAtomicSparkReplay_whenWorkerJvmCrashesDuringActiveSparkAction
          - id: 18
            label: "atomic database and export recovery"
