name: Backend / Full CI gate

on:
  workflow_dispatch:
  schedule:
    # 每周无条件运行一次，发现 paths-ignore 与范围路由漂移。
    - cron: '0 2 * * 0'
  push:
    branches:
      - main
    # 纯文档 / 许可证 / 编辑器配置改动不触发全量 reactor；各 job 独立设置超时。
    # 注意:docs/api/** 是契约文档(OpenAPI + protocol),不在 ignore 列表 — schema 漂移仍要 CI 回退。
    # 注意:db/migration/** / helm/** / scripts/** / pom.xml / .github/workflows/** 都不 ignore。
    paths-ignore:
      - 'docs/runbook/**'
      - 'docs/plans/**'
      - 'docs/architecture/**'
      - 'docs/design/**'
      - 'docs/review/**'
      - 'docs/changelog.md'
      - '*.md'
      - 'LICENSE'
      - 'NOTICE'
      - '.gitignore'
      - '.editorconfig'
      - '.agents/**'
      # BYO 多语言 SDK(sdk/{python,go,rust,typescript})不进 Java reactor,由
      # sdk-contract-parity.yml + sdk-python.yml 自验；纯 SDK 改动不触发 Java reactor + E2E。
      # 注意:Java SDK 模块 batch-worker-sdk* 是 reactor 模块,不在此列(照常跑)。
      - 'sdk/**'

permissions:
  contents: read

concurrency:
  group: full-ci-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Job 1: 静态检查(PMD + Spotless + dependency boundary + 脚本/契约守卫)。
  # 独立小 job(~3-5 min),跟 unit-it 测试并发跑。
  # ===========================================================================
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BATCH_GATE_COLLECT: '1'
      BATCH_GATE_GROUP: full-static
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # EmptyChecks guard 按 push event.before 做 diff；静态 job 需要可访问完整基线。
          fetch-depth: 0
          persist-credentials: false

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env
        with:
          cache-testcontainers: 'false'

      - name: Verify Console OpenAPI matches controllers
        run: bash scripts/ci/run-gate.sh --group contract FULL_CONSOLE_OPENAPI "Console controller 与 OpenAPI 路由同步" -- python3 scripts/ci/check-console-openapi-paths.py

      - name: Verify repository text encoding
        shell: bash
        run: bash scripts/ci/run-gate.sh FULL_UTF8_ENCODING "仓库文本 UTF-8 编码" -- python3 scripts/ci/check-utf8-encoding.py

      - name: Test repository text encoding checker
        shell: bash
        run: bash scripts/ci/run-gate.sh FULL_UTF8_ENCODING_TEST "UTF-8 编码门禁测试" -- python3 -m unittest scripts/ci/tests/test_check_utf8_encoding.py

      - name: Test gate failure aggregation
        shell: bash
        run: bash scripts/ci/run-gate.sh FULL_GATE_COLLECTION_TEST "门禁失败汇总自测" -- bash scripts/ci/tests/test-gate-result-collection.sh

      - name: Verify runtime UTF-8 configuration
        shell: bash
        run: bash scripts/ci/run-gate.sh FULL_INFRASTRUCTURE_UTF8 "基础设施 UTF-8 配置" -- python3 scripts/ci/check-infrastructure-utf8.py

      - name: Verify SQL/config placement boundaries
        shell: bash
        run: bash scripts/ci/run-gate.sh FULL_SQL_CONFIG_BOUNDARIES "SQL 与配置边界" -- bash scripts/ci/check-sql-config-boundaries.sh

      - name: Limit MyBatis generated keys to the id column
        shell: bash
        run: bash scripts/ci/run-gate.sh FULL_MYBATIS_GENERATED_KEYS "MyBatis generated key 列限制" -- python3 scripts/ci/check-mybatis-generated-key-columns.py

      - name: Verify yml ↔ docker-compose default sync
        shell: bash
        run: bash scripts/ci/run-gate.sh FULL_CONFIG_DEFAULTS_SYNC "配置默认值同步" -- python3 scripts/ci/check-config-defaults-sync.py --check

      - name: Verify tracked env files are shell-safe
        shell: bash
        run: bash scripts/ci/run-gate.sh FULL_ENV_FILE_SHELL_SAFETY "环境文件 Shell 安全" -- python3 scripts/ci/check-env-file-shell-safety.py

      - name: Verify hardcoded runtime configuration boundaries
        shell: bash
        run: bash scripts/ci/run-gate.sh FULL_RUNTIME_CONFIG_BOUNDARIES "运行时配置集中管理" -- bash scripts/ci/check-hardcoded-runtime-config.sh

      - name: Verify test configuration sources
        shell: bash
        run: bash scripts/ci/run-gate.sh FULL_TEST_CONFIG_SOURCES "测试配置事实来源" -- python3 scripts/ci/check-test-config-sources.py

      - name: Verify simulation Excel fixtures
        shell: bash
        run: |
          source scripts/lib/gate-result.sh
          gate_run FULL_SIM_XLSX_FIXTURES "Sim 配置包 Excel schema" python3 scripts/sim/fix-fixture-xlsx.py --check
          gate_run FULL_SIM_XLSX_FIXTURE_TEST "Sim 配置包 Excel schema 门禁测试" python3 -m unittest \
            scripts/ci/tests/test_fix_fixture_xlsx.py \
            scripts/ci/tests/test_sim_tenant_fixture.py \
            scripts/ci/tests/test_config_package_fixture_generators.py

      - name: Verify repository hygiene
        shell: bash
        run: bash scripts/ci/run-gate.sh FULL_REPOSITORY_HYGIENE "仓库卫生" -- python3 scripts/ci/check-repository-hygiene.py

      - name: Verify LOC snapshot
        shell: bash
        run: bash scripts/ci/run-gate.sh FULL_LOC_SNAPSHOT "代码量快照同步" -- python3 scripts/ci/check-loc-snapshot.py

      - name: Verify script governance and zero ShellCheck warnings
        shell: bash
        run: |
          source scripts/lib/gate-result.sh
          gate_run FULL_SCRIPT_GOVERNANCE "脚本治理" python3 scripts/ci/check-script-governance.py
          gate_run FULL_DESTRUCTIVE_OPS_GOVERNANCE "高风险操作清单" python3 scripts/ci/check-destructive-ops-governance.py
          gate_run FULL_SIM_RUNTIME_CLEANUP_TEST "Sim/容量/恢复脚本契约" python3 -m unittest scripts/ci/tests/test_sim_runtime_cleanup.py scripts/ci/tests/test_control_plane_benchmark_cleanup.py scripts/ci/tests/test_control_plane_mixed_pressure.py scripts/ci/tests/test_dr_drill_rls_rebuild.py
          gate_run FULL_SHELL_SCRIPTS "Shell 语法与 ShellCheck" bash scripts/ci/check-shell-scripts.sh
          gate_run FULL_SHELL_LINUX_PORTABILITY "Shell Linux 兼容性" python3 scripts/ci/check-shell-linux-portability.py
          gate_run FULL_TESTCONTAINERS_REUSE_LABEL "Testcontainers 复用标签判定" python3 scripts/ci/check-testcontainers-reuse-label.py
          gate_run FULL_POSTGRES_CLIENT_FALLBACK "PostgreSQL 客户端 fallback" bash scripts/ci/check-postgres-client-fallback.sh
          gate_run FULL_SDK_ORCHESTRATOR_E2E_SCRIPT_TEST "SDK 真栈 E2E 启动脚本回归测试" python3 -m unittest scripts/ci/tests/test_sdk_orchestrator_e2e_scripts.py
          gate_run FULL_SONAR_QUALITY_GATE_TEST "Sonar Quality Gate 评估回归测试" python3 -m unittest scripts.dev.tests.test_sonar_quality_gate

      - name: Verify GitHub Actions SHA pinning
        shell: bash
        run: |
          source scripts/lib/gate-result.sh
          gate_run FULL_ACTION_PINNING "GitHub Actions SHA 固定" python3 scripts/ci/check-github-action-pinning.py
          gate_run FULL_ACTION_PINNING_TEST "GitHub Actions SHA 固定门禁测试" python3 -m unittest scripts/ci/tests/test_check_github_action_pinning.py

      - name: Verify CI quality governance guards
        shell: bash
        run: |
          source scripts/lib/gate-result.sh
          gate_run FULL_SOFT_GATES "软门禁治理" python3 scripts/ci/check-soft-gate-governance.py
          gate_run FULL_FLAKY_QUARANTINE "flaky 测试隔离治理" python3 scripts/ci/check-flaky-test-governance.py
          gate_run FULL_CI_QUALITY_GUARD_TESTS "CI 质量治理门禁测试" python3 -m unittest \
            scripts/ci/tests/test_validate_flyway_schema.py \
            scripts/ci/tests/test_check_migration_safety.py \
            scripts/ci/tests/test_select_affected_tests.py \
            scripts/ci/tests/test_check_script_governance.py \
            scripts/ci/tests/test_check_docs_structure.py \
            scripts/ci/tests/test_document_naming_policy.py \
            scripts/ci/tests/test_sql_config_boundaries.py \
            scripts/ci/tests/test_detect_change_scope.py \
            scripts/ci/tests/test_check_flaky_test_governance.py \
            scripts/ci/tests/test_check_soft_gate_governance.py \
            scripts/ci/tests/test_check_diff_coverage.py \
            scripts/ci/tests/test_check_java_governance_test_coverage.py \
            scripts/ci/tests/test_java_worktree_source_inventory.py \
            scripts/ci/tests/test_sim_sftp_known_hosts.py \
            scripts/ci/tests/test_sim_export_partition_evidence.py \
            scripts/ci/tests/test_sim_fault_channel_cleanup.py \
            scripts/ci/tests/test_sim_worker_readiness.py \
            scripts/ci/tests/test_runtime_warning_audit.py \
            scripts/ci/tests/test_sim_profile_ownership.py \
            scripts/ci/tests/test_daily_validation_workflow.py \
            scripts/ci/tests/test_console_api_readiness.py \
            scripts/ci/tests/test_pre_push_module_selection.py \
            scripts/ci/tests/test_pre_push_environment.py \
            scripts/ci/tests/test_pr_coverage_integration.py \
            scripts/ci/tests/test_full_orchestrator_shards.py \
            scripts/ci/tests/test_report_ci_quality_trends.py \
            scripts/ci/tests/test_install_upstream_modules.py \
            scripts/ci/tests/test_capture_sdk_test.py \
            scripts/ci/tests/test_report_sdk_test_summary.py \
            scripts/ci/tests/test_check_sdk_runtime_alignment.py

      - name: Verify module dependency boundaries
        shell: bash
        run: bash scripts/ci/run-gate.sh FULL_DEPENDENCY_BOUNDARIES "模块依赖边界" -- python3 scripts/ci/check-dependency-boundaries.py

      - name: Verify direct client boundaries
        shell: bash
        run: bash scripts/ci/run-gate.sh FULL_DIRECT_CLIENT_BOUNDARIES "业务层直连客户端边界" -- python3 scripts/ci/check-direct-client-boundaries.py

      - name: Verify changelog synchronization
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          BASE="$BEFORE_SHA"
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            BASE="$(git rev-parse HEAD^)"
          fi
          bash scripts/ci/run-gate.sh FULL_CHANGELOG_SYNC "Changelog 同步" -- python3 scripts/ci/check-changelog-sync.py --base "$BASE"

      - name: Verify documentation structure and internal links
        shell: bash
        run: bash scripts/ci/run-gate.sh FULL_DOCS_STRUCTURE "文档结构与内部链接" -- python3 scripts/ci/check-docs-structure.py

      - name: Verify terminology documentation sync
        shell: bash
        run: bash scripts/ci/run-gate.sh FULL_TERMINOLOGY_DOC_SYNC "核心术语文档同步" -- python3 scripts/ci/check-terminology-doc-sync.py

      - name: Test terminology documentation sync guard
        shell: bash
        run: bash scripts/ci/run-gate.sh FULL_TERMINOLOGY_DOC_SYNC_TEST "核心术语文档同步门禁测试" -- python3 -m unittest scripts/ci/tests/test_check_terminology_doc_sync.py

      - name: Verify documentation timestamp policy
        shell: bash
        run: bash scripts/ci/run-gate.sh FULL_DOC_TIMESTAMP_POLICY "文档日期命名策略" -- python3 scripts/ci/check-doc-timestamp-policy.py

      - name: Validate feature switch registry
        shell: bash
        run: bash scripts/ci/run-gate.sh FULL_FEATURE_SWITCH_REGISTRY "功能开关注册表" -- python3 scripts/ci/check-feature-switch-registry.py

      - name: Verify environment variable governance
        shell: bash
        run: bash scripts/ci/run-gate.sh FULL_ENV_VARIABLE_GOVERNANCE "环境变量治理" -- python3 scripts/ci/check-env-variable-governance.py

      - name: Verify configuration governance registry
        shell: bash
        run: bash scripts/ci/run-gate.sh FULL_CONFIG_GOVERNANCE "配置治理注册表" -- python3 scripts/ci/check-config-governance.py

      - name: Report direct config key access inventory
        shell: bash
        # 阶段 0 报告模式：只输出直接配置 key 读取清单与分类，不阻断历史存量（脚本恒以 0 退出）。
        # 口径见 docs/runbook/config-key-access-governance.md；JSON 供治理看板 / 后续基线使用。
        run: |
          bash scripts/ci/run-gate.sh FULL_DIRECT_CONFIG_KEY_ACCESS "直接配置 Key 读取快照" -- python3 scripts/ci/check-direct-config-key-access.py --report
          python3 scripts/ci/check-direct-config-key-access.py --json build/config-key-access.json

      - name: Enforce no new direct config key access (baseline)
        shell: bash
        # 阶段 1（CFGKEY-3）：main push 也拦截新增高风险 PROJECT_CONFIG / SECRET_CONFIG 直接读取，
        # 防绕过 PR 直推 main。历史存量走 baseline，不阻断既有命中。
        run: bash scripts/ci/run-gate.sh FULL_DIRECT_CONFIG_KEY_BASELINE "直接配置 Key 增量拦截" -- python3 scripts/ci/check-direct-config-key-access.py --check-baseline docs/governance/direct-config-key-access-baseline.txt

      - name: Enforce approved governance baseline expansions
        shell: bash
        env:
          BASELINE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
        run: bash scripts/ci/run-gate.sh FULL_GOVERNANCE_BASELINE_EXPANSION "治理基线扩张审批" -- python3 scripts/ci/check-governance-baseline-expansion.py --base-ref "${BASELINE_BASE_REF}"

      - name: Upload direct config key access inventory
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: direct-config-key-access
          path: build/config-key-access.json
          retention-days: 30
          if-no-files-found: warn

      - name: Verify Helm env switch sync
        shell: bash
        run: bash scripts/ci/run-gate.sh FULL_HELM_ENV_SYNC "Helm 环境变量同步" -- python3 scripts/ci/check-helm-env-sync.py

      - name: Verify five-worker configuration parity
        shell: bash
        run: bash scripts/ci/run-gate.sh FULL_FIVE_WORKER_PARITY "五类 Worker 配置一致性" -- python3 scripts/ci/check-five-worker-parity.py

      - name: Verify KEDA autoscaling contracts
        shell: bash
        run: bash scripts/ci/run-gate.sh FULL_KEDA_AUTOSCALING "KEDA 自动伸缩契约" -- python3 scripts/ci/check-keda-autoscaling.py

      - name: Verify production Helm overlay safety
        shell: bash
        run: bash scripts/ci/run-gate.sh FULL_PRODUCTION_HELM_OVERLAY "生产 Helm overlay 安全" -- python3 scripts/ci/check-production-overlay-safety.py

      - name: Verify production capacity governance automation
        shell: bash
        run: bash scripts/ci/run-gate.sh FULL_PRODUCTION_CAPACITY_GOVERNANCE "生产容量治理自动化" -- python3 scripts/ci/check-production-capacity-governance.py

      - name: Verify application governance contract
        shell: bash
        run: bash scripts/ci/run-gate.sh FULL_APPLICATION_GOVERNANCE "应用治理契约" -- python3 scripts/ci/check-application-governance.py

      - name: Verify code documentation references
        shell: bash
        run: bash scripts/ci/run-gate.sh FULL_CODE_DOC_REFERENCES "代码文档引用" -- python3 scripts/ci/check-code-doc-references.py

      - name: Verify Java readability conventions
        shell: bash
        run: bash scripts/ci/run-gate.sh FULL_JAVA_READABILITY "Java 可读性约定" -- python3 scripts/ci/check-java-readability.py

      - name: Verify Java Lombok and injection conventions
        shell: bash
        run: bash scripts/ci/run-gate.sh FULL_JAVA_LOMBOK_INJECTION "Java Lombok 与依赖注入规约" -- python3 scripts/ci/check-java-lombok-injection.py

      - name: Test Java Lombok and injection checker
        shell: bash
        run: bash scripts/ci/run-gate.sh FULL_JAVA_LOMBOK_INJECTION_TEST "Java Lombok 与依赖注入门禁测试" -- python3 -m unittest scripts/ci/tests/test_check_java_lombok_injection.py

      - name: Verify Java logging governance
        shell: bash
        run: bash scripts/ci/run-gate.sh FULL_JAVA_LOGGING "Java 日志与异常输出治理" -- python3 scripts/ci/check-java-logging-governance.py

      - name: Verify Java fixed contracts and protocol values
        shell: bash
        run: bash scripts/ci/run-gate.sh FULL_JAVA_CONTRACT "Java 固定契约与协议值治理" -- python3 scripts/ci/check-java-contract-governance.py

      - name: Test Java contract governance checker
        shell: bash
        run: bash scripts/ci/run-gate.sh FULL_JAVA_CONTRACT_TEST "Java 契约治理门禁测试" -- python3 -m unittest scripts/ci/tests/test_check_java_contract_governance.py

      - name: Test Java logging governance checker
        shell: bash
        run: bash scripts/ci/run-gate.sh FULL_JAVA_LOGGING_TEST "Java 日志治理门禁测试" -- python3 -m unittest scripts/ci/tests/test_check_java_logging_governance.py

      - name: Verify pipeline summary key contract
        shell: bash
        run: bash scripts/ci/run-gate.sh FULL_PIPELINE_SUMMARY_KEYS "Pipeline 摘要键契约" -- python3 scripts/ci/check-pipeline-summary-keys.py

      - name: Test pipeline summary key contract checker
        shell: bash
        run: bash scripts/ci/run-gate.sh FULL_PIPELINE_SUMMARY_KEYS_TEST "Pipeline 摘要键契约门禁测试" -- python3 -m unittest scripts/ci/tests/test_check_pipeline_summary_keys.py

      - name: Verify test @DisplayName conventions
        shell: bash
        run: bash scripts/ci/run-gate.sh FULL_TEST_CONVENTIONS "测试 @DisplayName 约定" -- python3 scripts/ci/check-test-conventions.py --check-baseline docs/governance/test-conventions-baseline.txt

      - name: Test test-convention checker
        shell: bash
        run: bash scripts/ci/run-gate.sh FULL_TEST_CONVENTIONS_TEST "测试 @DisplayName 约定门禁测试" -- python3 -m unittest scripts/ci/tests/test_check_test_conventions.py

      - name: Verify Java text block style
        shell: bash
        run: bash scripts/ci/run-gate.sh FULL_JAVA_TEXT_BLOCK_STYLE "Java 文本块格式" -- python3 scripts/ci/check-java-text-block-style.py

      - name: Verify structured Java multiline strings
        shell: bash
        run: bash scripts/ci/run-gate.sh FULL_JAVA_STRUCTURED_STRING_CONCAT "Java 结构化多行字符串" -- python3 scripts/ci/check-java-structured-string-concat.py --base-ref origin/main

      - name: Test structured Java multiline string checker
        shell: bash
        run: bash scripts/ci/run-gate.sh FULL_JAVA_STRUCTURED_STRING_CONCAT_TEST "Java 结构化多行字符串门禁测试" -- python3 -m unittest scripts/ci/tests/test_check_java_structured_string_concat.py

      - name: Verify Java readability inventory
        shell: bash
        run: bash scripts/ci/run-gate.sh FULL_JAVA_READABILITY_INVENTORY "Java 可读性快照" -- python3 scripts/ci/report-java-readability-inventory.py --check docs/stats/java-readability-inventory.md

      - name: Enforce centralized empty checks
        shell: bash
        # main push 工作树干净，按本次 push 的前一提交检查新增生产 Java 行。
        run: |
          BASE="${{ github.event.before }}"
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            BASE="$(git rev-parse HEAD^)"
          fi
          bash scripts/ci/run-gate.sh FULL_EMPTY_CHECKS "集中式空值检查" -- python3 scripts/ci/check-empty-checks.py --base "$BASE"

      - name: Verify readiness contract documentation sync
        shell: bash
        # main push 工作树干净，按本次 push 的前一提交检查 readiness 契约触点是否同步文档/API/测试证据。
        run: |
          BASE="${{ github.event.before }}"
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            BASE="$(git rev-parse HEAD^)"
          fi
          bash scripts/ci/run-gate.sh FULL_READINESS_DOC_SYNC "Readiness 契约文档同步" -- python3 scripts/ci/check-readiness-doc-sync.py --base "$BASE"

      - name: Test readiness documentation sync guard
        run: bash scripts/ci/run-gate.sh --group docs FULL_READINESS_DOC_SYNC_TEST "Readiness 文档同步门禁测试" -- python3 -m unittest scripts/ci/tests/test_check_readiness_doc_sync.py

      - name: Verify Trivy ignore expiry metadata
        shell: bash
        run: bash scripts/ci/run-gate.sh FULL_TRIVY_IGNORE_EXPIRY "Trivy 忽略项有效期" -- python3 scripts/ci/check-trivy-ignore-expiry.py

      - name: SDK and frontend runtime alignment
        shell: bash
        run: bash scripts/ci/run-gate.sh FULL_SDK_RUNTIME_ALIGNMENT "SDK 与前端运行时版本对齐" -- python3 scripts/ci/check-sdk-runtime-alignment.py

      - name: Database comment coverage (diff-only)
        shell: bash
        run: |
          BASE="${{ github.event.before }}"
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            BASE="origin/main"
          fi
          bash scripts/ci/run-gate.sh FULL_DB_COMMENT_COVERAGE "数据库注释覆盖" -- bash scripts/ci/check-db-comment-coverage.sh "$BASE"

      - name: New table schema documentation and catalog integrity
        shell: bash
        run: |
          BASE="${{ github.event.before }}"
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            BASE="origin/main"
          fi
          bash scripts/ci/run-gate.sh FULL_NEW_TABLE_DOC_COVERAGE "新增数据库表文档登记" -- python3 scripts/ci/check-new-table-doc-coverage.py --base "$BASE"

      - name: Test new table documentation guard
        shell: bash
        run: bash scripts/ci/run-gate.sh --group docs FULL_NEW_TABLE_DOC_COVERAGE_TEST "新增数据库表文档门禁测试" -- python3 -m unittest scripts/ci/tests/test_check_new_table_doc_coverage.py

      - name: Required Java architecture documentation
        shell: bash
        run: bash scripts/ci/run-gate.sh FULL_REQUIRED_JAVA_DOCS "Java 架构文档完整性" -- bash scripts/ci/check-required-java-docs.sh

      - name: Verify e2e shard lists cover all *E2eIT
        shell: bash
        # full-ci-gate 自身也做静态侧守护,防绕过 PR 直推 main 时新增 / 重命名 E2E 漏挂 shard。
        run: bash scripts/ci/run-gate.sh FULL_E2E_SHARD_COVERAGE "E2E shard 覆盖" -- bash scripts/ci/check-e2e-shard-coverage.sh

      - name: Test E2E shard coverage guard
        run: bash scripts/ci/run-gate.sh --group governance FULL_E2E_SHARD_COVERAGE_TEST "E2E shard 覆盖守卫测试" -- python3 -m unittest scripts/ci/tests/test_e2e_shard_coverage.py scripts/ci/tests/test_e2e_method_completeness.py

      - name: Verify full-ci covers all integration test modules
        shell: bash
        # 主 reactor 里含 *IntegrationTest / *IT 的模块必须进入下方 unit-it 的
        # `mvn verify -DskipITs=false` shard;E2E 模块由上面的 shard 守护单独覆盖。
        run: bash scripts/ci/run-gate.sh FULL_INTEGRATION_TEST_COVERAGE "集成测试覆盖" -- python3 scripts/ci/check-integration-test-coverage.py

      - name: PMD + Spotless + dependency boundary
        shell: bash
        run: |
          bash scripts/ci/run-gate.sh FULL_JAVA_SUPPRESSION_REGISTRY "Java 抑制项注册表" -- python3 scripts/ci/check-java-suppression-registry.py
          bash scripts/ci/run-gate.sh FULL_JAVA_SUPPRESSION_REGISTRY_TEST "Java 抑制项注册表门禁测试" -- python3 -m unittest scripts/ci/tests/test_check_java_suppression_registry.py
          # test-compile 必要(PMD 需要 class 文件分析),不跑 surefire
          bash scripts/ci/run-gate.sh FULL_JAVA_STATIC_ANALYSIS "PMD、Spotless 与编译检查" -- ./mvnw -DskipTests test-compile pmd:check spotless:check -fae -B

      - name: Report all static check failures
        if: always()
        shell: bash
        run: |
          source scripts/lib/gate-result.sh
          gate_assert_collected

  # ===========================================================================
  # 5 个 unit/IT 执行分片并发；编排耗时类独立执行并合并覆盖率：
  #   a-main: orchestrator 其余测试 + worker-core + SDK
  #   a-heavy: 按最近一次 Full CI 耗时挑选的编排长类
  #   b1: common + trigger + worker-process + worker-dispatch  (~3.5 min)
  #   b2-workers: worker-import + worker-export + worker-atomic
  #   b2: console-api（保留历史 job 名称）
  # 总耗时以运行时长与 runner 排队为准。
  # ===========================================================================
  unit-it-a-main:
    name: 'Full tests / orchestration and SDK'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /var/run/docker.sock
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env

      - name: Cleanup orphan testcontainers (pre-IT)
        shell: bash
        run: |
          docker ps --filter "label=org.testcontainers=true" \
            --format '{{.ID}} {{.Labels}}' | \
            awk '$0 !~ /reuse-hash/ {print $1}' | \
            xargs -r docker rm -f >/dev/null 2>&1 || true

      - name: Run unit + IT (orchestrator + worker-core + sdk×3)
        shell: bash
        # 上游依赖只编译安装；测试仅在所属 shard 执行一次。
        run: |
          MODULES="batch-orchestrator,batch-worker/core,sdk/java/core,sdk/java/spring,sdk/java/testkit"
          ./mvnw install -pl "$MODULES" -am -DskipTests \
            -Dspotless.check.skip=true -Dpmd.skip=true -B
          heavy_excludes=$(sed 's/^/!/' scripts/ci/test-shards/full-orchestrator-heavy.txt | paste -sd, -)
          ./mvnw verify -pl batch-orchestrator,batch-worker/core,sdk/java/core,sdk/java/spring,sdk/java/testkit \
            "-Dtest=!*ArchTest,!*ConventionTest,!ArchiveDiagnosticCadenceProbeIT,$heavy_excludes" \
            -DskipITs=false -Dspotless.check.skip=true -Dpmd.skip=true \
            -fae -B
          # 覆盖率门禁(BUNDLE 25% LINE + 15 个核心类 80% lock-in 棘轮)。原仅本地 strict-verify 跑,
          # 现上 CI。只查本 shard 跑了测试的目标模块,不带 -am(否则上游模块 0% 覆盖误判失败)。
          ./mvnw jacoco:check@check -pl batch-worker/core,sdk/java/core,sdk/java/spring,sdk/java/testkit -B

      - name: Verify changed-line coverage
        shell: bash
        run: |
          ./mvnw jacoco:report -pl batch-worker/core,sdk/java/core,sdk/java/spring,sdk/java/testkit -B
          BASE="${{ github.event.before }}"
          [[ -n "$BASE" && ! "$BASE" =~ ^0+$ ]] || BASE="HEAD^"
          python3 scripts/ci/check-diff-coverage.py --base "$BASE" \
            --path batch-worker/core \
            --path sdk/java/core --path sdk/java/spring --path sdk/java/testkit

      - name: Upload orchestrator coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: full-ci-a-main-coverage
          path: batch-orchestrator/target/jacoco.exec
          if-no-files-found: error
          retention-days: 1

      - name: Upload Surefire Reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: full-ci-unit-it-a-main-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          retention-days: 14

  unit-it-a-heavy:
    name: 'Full tests / orchestration recovery and database'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /var/run/docker.sock
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup build environment
        uses: ./.github/actions/setup-build-env
      - name: Install orchestrator dependencies
        run: ./mvnw install -pl batch-orchestrator -am -DskipTests -Dspotless.check.skip=true -Dpmd.skip=true -B
      - name: Run long orchestrator integration classes
        shell: bash
        run: |
          tests=$(paste -sd, scripts/ci/test-shards/full-orchestrator-heavy.txt)
          ./mvnw test -pl batch-orchestrator "-Dtest=$tests" -Dsurefire.failIfNoSpecifiedTests=true \
            -Dspotless.check.skip=true -Dpmd.skip=true -fae -B
      - name: Verify selected orchestrator classes ran
        run: bash scripts/ci/check-e2e-run-completeness.sh "$(paste -sd, scripts/ci/test-shards/full-orchestrator-heavy.txt)" batch-orchestrator/target/surefire-reports
      - name: Upload orchestrator coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: full-ci-a-heavy-coverage
          path: batch-orchestrator/target/jacoco.exec
          if-no-files-found: error
          retention-days: 1
      - name: Upload Surefire Reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: full-ci-unit-it-a-heavy-reports
          path: '**/target/surefire-reports/**'
          retention-days: 14

  unit-it-a:
    name: unit-it-a
    if: always()
    needs: [unit-it-a-main, unit-it-a-heavy]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify orchestrator shard results
        env:
          MAIN_RESULT: ${{ needs.unit-it-a-main.result }}
          HEAVY_RESULT: ${{ needs.unit-it-a-heavy.result }}
        run: '[[ "$MAIN_RESULT" == "success" && "$HEAVY_RESULT" == "success" ]]'
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup build environment
        uses: ./.github/actions/setup-build-env
      - name: Build orchestrator classes for coverage
        run: ./mvnw install -pl batch-orchestrator -am -DskipTests -Dspotless.check.skip=true -Dpmd.skip=true -B
      - name: Download main coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: full-ci-a-main-coverage
          path: batch-orchestrator/target/ci-jacoco-shards/main
      - name: Download heavy coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: full-ci-a-heavy-coverage
          path: batch-orchestrator/target/ci-jacoco-shards/heavy
      - name: Merge and verify orchestrator coverage
        shell: bash
        run: |
          mkdir -p batch-orchestrator/target/ci-jacoco-shards
          mv batch-orchestrator/target/ci-jacoco-shards/main/jacoco.exec batch-orchestrator/target/ci-jacoco-shards/main.exec
          mv batch-orchestrator/target/ci-jacoco-shards/heavy/jacoco.exec batch-orchestrator/target/ci-jacoco-shards/heavy.exec
          ./mvnw jacoco:merge@merge-ci-shards -pl batch-orchestrator -B
          test -s batch-orchestrator/target/jacoco.exec
          ./mvnw jacoco:check@check jacoco:report -pl batch-orchestrator -B
          BASE="${{ github.event.before }}"
          [[ -n "$BASE" && ! "$BASE" =~ ^0+$ ]] || BASE="HEAD^"
          python3 scripts/ci/check-diff-coverage.py --base "$BASE" --path batch-orchestrator

  # ===========================================================================
  # Job 3: unit-it-b1 — common + trigger + worker-process + worker-dispatch
  # ===========================================================================
  unit-it-b1:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /var/run/docker.sock
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env

      - name: Cleanup orphan testcontainers (pre-IT)
        shell: bash
        run: |
          docker ps --filter "label=org.testcontainers=true" \
            --format '{{.ID}} {{.Labels}}' | \
            awk '$0 !~ /reuse-hash/ {print $1}' | \
            xargs -r docker rm -f >/dev/null 2>&1 || true

      - name: Run unit + IT (common + test-support + trigger + worker-process + worker-dispatch)
        shell: bash
        run: |
          MODULES="batch-common,batch-test-support,batch-trigger,batch-worker/process,batch-worker/dispatch"
          ./mvnw install -pl "$MODULES" -am -DskipTests \
            -Dspotless.check.skip=true -Dpmd.skip=true -B
          ./mvnw verify -pl batch-common,batch-test-support,batch-trigger,batch-worker/process,batch-worker/dispatch \
            -Dtest='!*ArchTest,!*ConventionTest' \
            -DskipITs=false -Dspotless.check.skip=true -Dpmd.skip=true \
            -fae -B
          # 覆盖率门禁(见 unit-it-a 注释);只查本 shard 的生产模块。
          # batch-test-support 是测试基础设施，执行自身测试但不纳入产品代码覆盖率。
          ./mvnw jacoco:check@check -pl batch-common,batch-trigger,batch-worker/process,batch-worker/dispatch -B

      - name: Verify changed-line coverage
        shell: bash
        run: |
          ./mvnw jacoco:report -pl batch-common,batch-test-support,batch-trigger,batch-worker/process,batch-worker/dispatch -B
          BASE="${{ github.event.before }}"
          [[ -n "$BASE" && ! "$BASE" =~ ^0+$ ]] || BASE="HEAD^"
          python3 scripts/ci/check-diff-coverage.py --base "$BASE" \
            --path batch-common --path batch-trigger \
            --path batch-worker/process --path batch-worker/dispatch

      - name: Upload Surefire Reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: full-ci-unit-it-b1-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          retention-days: 14

  # ===========================================================================
  # Job 4a: unit-it-b2-workers — worker-import + worker-export + worker-atomic
  # ===========================================================================
  unit-it-b2-workers:
    name: Full tests / import, export and atomic workers
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /var/run/docker.sock
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env

      - name: Cleanup orphan testcontainers (pre-IT)
        shell: bash
        run: |
          docker ps --filter "label=org.testcontainers=true" \
            --format '{{.ID}} {{.Labels}}' | \
            awk '$0 !~ /reuse-hash/ {print $1}' | \
            xargs -r docker rm -f >/dev/null 2>&1 || true

      - name: Run unit + IT (worker-import + worker-export + worker-atomic)
        shell: bash
        run: |
          MODULES="batch-worker/import,batch-worker/export,batch-worker/atomic"
          ./mvnw install -pl "$MODULES" -am -DskipTests \
            -Dspotless.check.skip=true -Dpmd.skip=true -B
          ./mvnw verify -pl batch-worker/import,batch-worker/export,batch-worker/atomic \
            -Dtest='!*ArchTest,!*ConventionTest' \
            -DskipITs=false -Dspotless.check.skip=true -Dpmd.skip=true \
            -fae -B
          # 覆盖率门禁(见 unit-it-a 注释);只查本 shard 目标模块。
          ./mvnw jacoco:check@check -pl batch-worker/import,batch-worker/export,batch-worker/atomic -B

      - name: Verify changed-line coverage
        shell: bash
        run: |
          ./mvnw jacoco:report -pl batch-worker/import,batch-worker/export,batch-worker/atomic -B
          BASE="${{ github.event.before }}"
          [[ -n "$BASE" && ! "$BASE" =~ ^0+$ ]] || BASE="HEAD^"
          python3 scripts/ci/check-diff-coverage.py --base "$BASE" \
            --path batch-worker/import --path batch-worker/export \
            --path batch-worker/atomic

      - name: Upload Surefire Reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: full-ci-unit-it-b2-workers-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          retention-days: 14

  # ===========================================================================
  # Job 4b: unit-it-b2 — Console API 独立分片，保留历史 job 名称用于趋势连续性。
  # ===========================================================================
  unit-it-b2:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /var/run/docker.sock
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env

      - name: Cleanup orphan testcontainers (pre-IT)
        shell: bash
        run: |
          docker ps --filter "label=org.testcontainers=true" \
            --format '{{.ID}} {{.Labels}}' | \
            awk '$0 !~ /reuse-hash/ {print $1}' | \
            xargs -r docker rm -f >/dev/null 2>&1 || true

      - name: Run unit + IT (console-api)
        shell: bash
        run: |
          MODULES="batch-console-api"
          ./mvnw install -pl "$MODULES" -am -DskipTests \
            -Dspotless.check.skip=true -Dpmd.skip=true -B
          ./mvnw verify -pl batch-console-api \
            -Dtest='!*ArchTest,!*ConventionTest' \
            -DskipITs=false -Dspotless.check.skip=true -Dpmd.skip=true \
            -fae -B
          ./mvnw jacoco:check@check -pl batch-console-api -B

      - name: Verify changed-line coverage
        shell: bash
        run: |
          ./mvnw jacoco:report -pl batch-console-api -B
          BASE="${{ github.event.before }}"
          [[ -n "$BASE" && ! "$BASE" =~ ^0+$ ]] || BASE="HEAD^"
          python3 scripts/ci/check-diff-coverage.py --base "$BASE" --path batch-console-api

      - name: Upload Surefire Reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: full-ci-unit-it-b2-console-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          retention-days: 14

  # ===========================================================================
  # Java 架构/约定守卫独立执行，与 unit/IT 并发；业务分片不重复运行。
  # ===========================================================================
  java-governance:
    name: Full tests / Java architecture and conventions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BATCH_GOVERNANCE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env
        with:
          cache-testcontainers: 'false'

      - name: Verify governance test inventory
        shell: bash
        run: bash scripts/ci/run-gate.sh --group governance FULL_JAVA_GOVERNANCE_INVENTORY "Java 治理测试清单" -- python3 scripts/ci/check-java-governance-test-coverage.py

      - name: Run Java architecture and convention guards
        shell: bash
        run: bash scripts/ci/run-java-governance-tests.sh

      - name: Upload Java governance reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: full-ci-java-governance-reports
          path: '**/target/surefire-reports/**'
          retention-days: 14

  # ===========================================================================
  # Job 2: security scans — 拆独立 job 跟 unit-it 并发跑,省 2-3 min wall-clock。
  # 扫描串行(单 job 内): gitleaks secret / hadolint / trivy fs / checkov。
  # 依赖漏洞由下方 Trivy fs(vuln) 覆盖——OWASP dependency-check 的 NVD 全量下载在 CI 上
  # 慢到不可控(实测 5 分钟超时仍只下到 70k/352k)且该步骤 continue-on-error 不拦门禁,
  # 已于 2026-08 从 CI 移除;--mode=deps 保留给本地按需使用。
  # 不依赖 unit-it 跑结果,失败独立报错不阻塞测试 job 上传 surefire。
  # ===========================================================================
  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env
        with:
          cache-testcontainers: 'false'

      - name: Install gitleaks
        shell: bash
        run: |
          GITLEAKS_VERSION=8.30.1
          curl -fsSL -o /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Security scan — secrets
        shell: bash
        # 独立模块不属于主 reactor；打包时执行其编排和报告单测，再运行密钥扫描。
        run: bash scripts/ci/run-gate.sh FULL_SECRET_SCAN "密钥泄漏扫描" -- bash scripts/ci/security-scan.sh -- --mode=secret

      - name: Install trivy
        shell: bash
        run: |
          TRIVY_VERSION=0.74.0
          curl -fsSL -o /tmp/trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          sudo mv /tmp/trivy /usr/local/bin/trivy
          trivy --version

      - name: License compliance + SBOM
        shell: bash
        # 生成 CycloneDX SBOM + 第三方许可证清单,并拦强 copyleft(AGPL/SSPL/CPAL/纯 GPL)。
        run: bash scripts/ci/run-gate.sh FULL_LICENSE_COMPLIANCE "开源许可证与 SBOM" -- bash scripts/ci/check-license-compliance.sh

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom-cyclonedx
          path: target/bom.json
          retention-days: 90
          if-no-files-found: warn

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: deploy/docker/Dockerfile.app
          failure-threshold: warning

      - name: Lint operations toolbox Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: deploy/docker/Dockerfile.ops-toolbox
          failure-threshold: warning

      - name: Repository security scan — Trivy fs
        shell: bash
        run: |
          trivy sbom --ignorefile .trivyignore --severity CRITICAL,HIGH --exit-code 1 target/bom.json
          trivy config --ignorefile .trivyignore.yaml --severity CRITICAL,HIGH --exit-code 1 .

      - name: K8s manifest security — Checkov
        uses: bridgecrewio/checkov-action@a76233b2c1d4a820a9dc68be350c473a4a9dceec # v12
        with:
          directory: helm/batch-platform
          framework: helm
          # 用生产形态的扫描 overlay，避免把 dev 默认值当成上线清单。
          var_file: helm/values-checkov.yaml
          # 21 是 Checkov 未传 --namespace 时产生的 default namespace 工具误报；
          # 35 是 Spring Boot 标准 envFrom Secret 注入，凭据仍由 Secret 管理；
          # 43 在扫描 overlay 中使用 digest；发布环境可通过 image.digest 同样固化。
          skip_check: CKV_K8S_21,CKV_K8S_35
          soft_fail: false
          output_format: cli

  # ===========================================================================
  # Job 3: e2e shard matrix。原六片保留历史基线；新增场景独立分片，避免集中形成长尾。
  #
  # 历史基线见 docs/verifications/ci-gate-runtime-optimization-2026-10-07.md；近期分片证据见 docs/plans/todo-master.md。
  # ===========================================================================
  e2e-shard:
    name: 'E2E ${{ matrix.shard.id }} / ${{ matrix.shard.label }}'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (contains(matrix.shard.tests, 'shouldStopAtomicSparkReplay') || matrix.shard.tests == 'WorkerReportLostAfterBusinessCommitE2eIT') && 30 || 25 }}
    env:
      TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /var/run/docker.sock
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        shard:
          - id: 1
            label: "worker restart, import failure and tenancy"
            tests: >-
              WorkerProcessRestartRecoveryE2eIT,
