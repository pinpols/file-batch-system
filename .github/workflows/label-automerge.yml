name: Label auto-merge

# 给同仓库 PR 打 `automerge` 标签后，登记 GitHub 原生 auto-merge。
#
# GitHub 原生 auto-merge 负责等待 required checks 和 branch protection，不监听高权限
# `workflow_run`，避免不可信 workflow 产物进入具备 contents:write 的执行上下文。
#
# 用法:
#   1) 开 PR
#   2) 自己 review 一下 + 觉得 OK,在 PR 页面贴 label 'automerge'
#   3) 本 workflow 登记 auto-merge；required checks 全绿后由 GitHub squash merge
#
# 安全性:
#   - **不** 跳过 required status checks(必须 unit-it-a/b1/b2 / static-checks / security-scan 全部通过)
#   - **不** 自动加 label(必须人手贴)
#   - 撤销:删 'automerge' label 即可,workflow 不会再 fire
#
# 仅处理本仓分支。fork PR 即使被误贴标签也不会获得写权限执行路径。

on:
  pull_request:
    types: [labeled, synchronize, reopened, ready_for_review]

permissions:
  pull-requests: write
  contents: write

# 同 PR 多事件并发触发,只保留最后一次
concurrency:
  group: label-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enable-auto-merge:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false &&
      contains(github.event.pull_request.labels.*.name, 'automerge')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enable squash auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh pr merge --auto --squash "${PR_NUMBER}" --repo "${REPO}"
