name: Setup Build Environment
description: Shared setup for CI workflows — Java, Maven cache, and optional testcontainer images

inputs:
  java-version:
    description: JDK version
    required: false
    default: "21"
  compile-load-tests:
    description: Whether to compile load-tests module
    required: false
    default: "false"
  cache-testcontainers:
    description: Whether to restore or populate the Testcontainers image cache
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Setup Python guard environment
      uses: ./.github/actions/setup-python-guard-env

    - name: Setup Java
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}
        cache: maven

    - name: Cache testcontainer Docker images
      if: inputs.cache-testcontainers == 'true'
      id: tc-image-cache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: /tmp/tc-images
        key: tc-images-${{ hashFiles('batch-test-support/src/main/java/io/github/pinpols/batch/testing/TestContainerImages.java', '.github/actions/setup-build-env/action.yml') }}

    - name: Restore testcontainer images from cache
      if: inputs.cache-testcontainers == 'true' && steps.tc-image-cache.outputs.cache-hit == 'true'
      shell: bash
      run: |
        for f in /tmp/tc-images/*.tar; do
          [ -f "$f" ] && docker load -i "$f" || true
        done

    - name: Pull and save testcontainer images
      if: inputs.cache-testcontainers == 'true' && steps.tc-image-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p /tmp/tc-images
        for img in apache/kafka:4.1.2 postgres:17.11 valkey/valkey:8.1.10 bitnamilegacy/minio:2025.7.23-debian-12-r1; do
          docker pull "$img"
          safe=$(echo "$img" | tr '/:' '__')
          docker save "$img" -o "/tmp/tc-images/${safe}.tar"
        done

    - name: Compile load-tests module
      if: inputs.compile-load-tests == 'true'
      shell: bash
      run: |
        mvn -q -f load-tests/pom.xml test-compile
