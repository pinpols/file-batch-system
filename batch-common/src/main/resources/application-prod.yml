# ==========================================================
# application-prod.yml — 生产环境配置覆盖
#
# 激活方式：SPRING_PROFILES_ACTIVE=prod
# 本文件只包含与 batch-defaults.yml 不同的生产特化值。
# ==========================================================

spring:
  lifecycle:
    # A-5.4: 生产环境优雅关闭超时加长
    timeout-per-shutdown-phase: ${BATCH_SHUTDOWN_TIMEOUT:180s}

management:
  # S-3.4: 生产环境管理端口隔离，不暴露到业务端口
  server:
    port: ${BATCH_MANAGEMENT_PORT:0}
  tracing:
    sampling:
      # Collector 负责 tail sampling；应用端必须全量上报，才能保留错误与慢链路。
      probability: ${OTEL_SAMPLING_PROBABILITY:1.0}

logging:
  structured:
    format:
      # 生产输出 ECS JSON 格式，便于 Loki / Elasticsearch 解析
      console: ${BATCH_LOG_FORMAT:ecs}

batch:
  security:
    # 生产环境强制关闭测试模式
    bypass-mode: false
