apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "batch-platform.configmapName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "batch-platform.labels" . | nindent 4 }}
data:
  # ── 平台库 ───────────────────────────────────────────────────────
  BATCH_PLATFORM_DB_URL: {{ .Values.postgresql.platform.url | quote }}
  BATCH_PLATFORM_DB_USERNAME: {{ .Values.postgresql.platform.username | quote }}

  # ── 业务库（workers 使用） ────────────────────────────────────────────
  BATCH_BUSINESS_DB_URL: {{ .Values.postgresql.business.url | quote }}
  BATCH_BUSINESS_DB_USERNAME: {{ .Values.postgresql.business.username | quote }}
  BATCH_BUSINESS_DB_SCHEMA: {{ .Values.postgresql.business.schema | quote }}

  # ── Kafka ──────────────────────────────────────────────────────────────────
  BATCH_KAFKA_BOOTSTRAP_SERVERS: {{ .Values.kafka.bootstrapServers | quote }}

  # ── Redis（用于 ShedLock / 配置缓存 / 实时 SSE Pub-Sub）─────────────────
  BATCH_REDIS_HOST: {{ .Values.redis.host | quote }}
  BATCH_REDIS_PORT: {{ .Values.redis.port | quote }}

  # ── 各模块 server.port 显式注入（Spring Boot 4 对 ${VAR:default} fallback
  #    处理变严，直接显式注入避免占位符解析失败）
  BATCH_CONSOLE_API_PORT: {{ .Values.consoleApi.port | quote }}
  BATCH_TRIGGER_PORT: {{ .Values.trigger.port | quote }}
  BATCH_ORCHESTRATOR_PORT: {{ .Values.orchestrator.port | quote }}
  BATCH_WORKER_IMPORT_PORT: {{ .Values.workerImport.port | quote }}
  BATCH_WORKER_EXPORT_PORT: {{ .Values.workerExport.port | quote }}
  BATCH_WORKER_PROCESS_PORT: {{ .Values.workerProcess.port | quote }}
  BATCH_WORKER_DISPATCH_PORT: {{ .Values.workerDispatch.port | quote }}

  # ── Object Storage (S3) ─────────────────────────────────────────────────────
  BATCH_S3_ENDPOINT: {{ .Values.objectStorage.endpoint | quote }}
  BATCH_S3_BUCKET: {{ .Values.objectStorage.bucket | quote }}
  BATCH_S3_REGION: {{ .Values.objectStorage.region | default "" | quote }}
  BATCH_ALERT_AM_EMIT_ENABLED: {{ (.Values.alertmanager).enabled | default false | quote }}
  BATCH_ALERT_AM_EMIT_ENDPOINT: {{ (.Values.alertmanager).endpoint | default "" | quote }}
  BATCH_CONSOLE_ALERTMANAGER_ENABLED: {{ ((.Values.alertmanager).console).enabled | default true | quote }}
  BATCH_CONSOLE_ALERTMANAGER_TENANT_ID: {{ ((.Values.alertmanager).console).tenantId | default "system" | quote }}
  BATCH_CONSOLE_ALERTMANAGER_SILENCE_ENABLED: {{ ((.Values.alertmanager).console).silenceEnabled | default false | quote }}
  BATCH_CONSOLE_ALERTMANAGER_API_BASE_URL: {{ ((.Values.alertmanager).console).apiBaseUrl | default "" | quote }}
  BATCH_STORAGE_BACKEND: {{ (.Values.storage).backend | default "s3" | quote }}
  BATCH_STORAGE_BACKEND_CUTOVER_ID: {{ (.Values.storage).backendCutoverId | default "" | quote }}
  BATCH_STORAGE_FILESYSTEM_ROOT: {{ (.Values.storage).filesystemRoot | default "" | quote }}
  BATCH_STORAGE_FILESYSTEM_DOWNLOAD_BASE_URL: {{ (.Values.storage).filesystemDownloadBaseUrl | default "" | quote }}
  BATCH_STORAGE_FILESYSTEM_DEFAULT_PRESIGN_TTL: {{ (.Values.storage).filesystemDefaultPresignTtl | default "5m" | quote }}
  BATCH_STORAGE_FILESYSTEM_MAX_LIST_SCAN_ENTRIES: {{ (.Values.storage).filesystemMaxListScanEntries | default 200000 | quote }}

  # ── 跨服务 ──────────────────────────────────────────────────────────
  BATCH_ORCHESTRATOR_BASE_URL: {{ .Values.orchestratorBaseUrl | quote }}

  # R7-A4-P0: orchestrator 限流 + DB 池规模（之前 .env.prod 写了但 Helm 漂移）。
  BATCH_ORCHESTRATOR_PLATFORM_DB_MAX_POOL_SIZE: {{ .Values.orchestrator.platformDb.maxPoolSize | default 30 | quote }}
  BATCH_TRIGGER_CONSUMER_CONCURRENCY: {{ .Values.orchestrator.triggerConsumer.concurrency | default 6 | quote }}
  # P1-8 (pre-launch audit 2026-05-18)：console 主/从库池暴露,默认 16+16 应对 2 replicas * 64 共 128 上限。
  {{- $consoleReadReplica := .Values.consoleApi.readReplica | default dict }}
  BATCH_CONSOLE_READ_REPLICA_ENABLED: {{ $consoleReadReplica.enabled | default true | quote }}
  BATCH_CONSOLE_PRIMARY_URL: {{ $consoleReadReplica.primaryUrl | default .Values.postgresql.platform.url | quote }}
  BATCH_CONSOLE_PRIMARY_USER: {{ $consoleReadReplica.primaryUsername | default .Values.postgresql.platform.username | quote }}
  BATCH_CONSOLE_REPLICA_URL: {{ $consoleReadReplica.replicaUrl | default .Values.postgresql.platform.url | quote }}
  BATCH_CONSOLE_REPLICA_USER: {{ $consoleReadReplica.replicaUsername | default .Values.postgresql.platform.username | quote }}
  BATCH_CONSOLE_PRIMARY_POOL: {{ .Values.consoleApi.primaryPool | default 16 | quote }}
  BATCH_CONSOLE_REPLICA_POOL: {{ .Values.consoleApi.replicaPool | default 16 | quote }}
  # 2026-05-18 console 登录加密总开关 / 严格模式(对应 ConsoleSecurityProperties.LoginEncryption)。
  BATCH_CONSOLE_SECURITY_LOGIN_ENCRYPTION_ENABLED: {{ (.Values.security.loginEncryption).enabled | default "true" | quote }}
  BATCH_CONSOLE_SECURITY_LOGIN_ENCRYPTION_REQUIRED: {{ (.Values.security.loginEncryption).required | default "false" | quote }}
  BATCH_CONSOLE_SECURITY_RATE_LIMIT_EXPENSIVE_OP_USER_LIMIT_PER_MINUTE: {{ (((.Values.consoleApi).security).rateLimit).expensiveOpUserLimitPerMinute | default 10 | quote }}
  BATCH_CONSOLE_SECURITY_RATE_LIMIT_FILE_OP_USER_LIMIT_PER_MINUTE: {{ (((.Values.consoleApi).security).rateLimit).fileOpUserLimitPerMinute | default 60 | quote }}
  BATCH_CONSOLE_SECURITY_RATE_LIMIT_REDIS_FAILURE_THRESHOLD: {{ (((.Values.consoleApi).security).rateLimit).redisFailureThreshold | default 3 | quote }}
  BATCH_CONSOLE_SECURITY_RATE_LIMIT_REDIS_CIRCUIT_OPEN_SECONDS: {{ (((.Values.consoleApi).security).rateLimit).redisCircuitOpenSeconds | default 15 | quote }}
  BATCH_CONSOLE_AI_ENABLED: {{ ((.Values.consoleApi).ai).enabled | default false | quote }}
  BATCH_CONSOLE_AI_PROVIDER: {{ ((.Values.consoleApi).ai).provider | default "anthropic" | quote }}
  BATCH_SCHEDULER_WORKER_CACHE_ENABLED: {{ (.Values.orchestrator.workerCache).enabled | default true | quote }}
  BATCH_MQ_ROUTING_MODE: {{ (.Values.orchestrator.mqRouting).mode | default "TENANT" | quote }}
  BATCH_QUOTA_RUNTIME_STORE: {{ (.Values.orchestrator.quota).runtimeStore | default "redis" | quote }}
  BATCH_QUOTA_REDIS_FAILURE_MODE: {{ (.Values.orchestrator.quota).redisFailureMode | default "FAIL_CLOSED" | quote }}
  BATCH_QUOTA_BACKEND_CUTOVER_ID: {{ (.Values.orchestrator.quota).backendCutoverId | default "" | quote }}
  BATCH_QUOTA_SNAPSHOT_ENABLED: {{ (.Values.orchestrator.quota).snapshotEnabled | default true | quote }}
  BATCH_WORKER_REPORT_OUTBOX_ENABLED: {{ (.Values.orchestrator.workerReportOutbox).enabled | default false | quote }}
  BATCH_WORKER_REPORT_OUTBOX_STORAGE: {{ (.Values.orchestrator.workerReportOutbox).storage | default "PLATFORM_PG" | quote }}
  BATCH_WORKER_REPORT_OUTBOX_CUTOVER_ID: {{ (.Values.orchestrator.workerReportOutbox).cutoverId | default "" | quote }}
  BATCH_WORKER_LEASE_RENEW_BATCH_MAX_ITEMS: {{ (.Values.orchestrator.workerLease).renewBatchMaxItems | default 256 | quote }}
  BATCH_WORKER_CHECKPOINT_ENABLED: {{ (.Values.orchestrator.workerCheckpoint).enabled | default true | quote }}
  BATCH_WORKER_CHECKPOINT_STAGE_SKIP_ENABLED: {{ (.Values.orchestrator.workerCheckpoint).stageSkipEnabled | default false | quote }}
  BATCH_DATASOURCE_BUSINESS_ROUTING_ENABLED: {{ (.Values.orchestrator.businessRouting).enabled | default false | quote }}
  BATCH_DATASOURCE_BUSINESS_ROUTING_PLACEMENT_SOURCE: {{ (.Values.orchestrator.businessRouting).placementSource | default "CONFIG" | quote }}
  BATCH_RESOURCE_SCHEDULER_DEFAULT_EXCEEDED_STRATEGY: {{ (.Values.orchestrator.resourceScheduler).defaultExceededStrategy | default "QUEUE_DEFER" | quote }}
  BATCH_RESOURCE_SCHEDULER_WAITING_DISPATCH_BATCH_SIZE: {{ (.Values.orchestrator.resourceScheduler).waitingDispatchBatchSize | default 100 | quote }}
  BATCH_RESOURCE_SCHEDULER_WAITING_DISPATCH_INTERVAL_MILLIS: {{ (.Values.orchestrator.resourceScheduler).waitingDispatchIntervalMillis | default 10000 | quote }}
  BATCH_RESOURCE_SCHEDULER_WAITING_DISPATCH_KICK_ENABLED: {{ (.Values.orchestrator.resourceScheduler).waitingDispatchKickEnabled | quote }}
  BATCH_RESOURCE_SCHEDULER_WAITING_DISPATCH_KICK_DELAY_MILLIS: {{ (.Values.orchestrator.resourceScheduler).waitingDispatchKickDelayMillis | default 250 | quote }}
  BATCH_TRIGGER_API_LAUNCH_MAX_CONCURRENCY: {{ (.Values.trigger.runtime).apiLaunchMaxConcurrency | default 64 | quote }}
  BATCH_TRIGGER_API_LAUNCH_ADAPTIVE_ENABLED: {{ (.Values.trigger.runtime).apiLaunchAdaptiveEnabled | quote }}
  BATCH_TRIGGER_API_LAUNCH_MIN_CONCURRENCY: {{ (.Values.trigger.runtime).apiLaunchMinConcurrency | default 16 | quote }}
  BATCH_TRIGGER_API_LAUNCH_SLOW_REQUEST_THRESHOLD_MILLIS: {{ (.Values.trigger.runtime).apiLaunchSlowRequestThresholdMillis | default 1000 | quote }}
  BATCH_TRIGGER_PLATFORM_DB_MAX_POOL_SIZE: {{ (.Values.trigger.platformDb).maxPoolSize | default 10 | quote }}
  BATCH_TRIGGER_PLATFORM_DB_CONNECTION_TIMEOUT_MS: {{ (.Values.trigger.platformDb).connectionTimeoutMillis | default 5000 | quote }}
  BATCH_TRIGGER_QUARTZ_DB_MAX_POOL_SIZE: {{ (.Values.trigger.quartzDb).maxPoolSize | default 5 | quote }}
  BATCH_TRIGGER_OUTBOX_POLL_INTERVAL_MILLIS: {{ (.Values.trigger.outbox).pollIntervalMillis | default 200 | quote }}
  BATCH_TRIGGER_OUTBOX_BATCH_SIZE: {{ (.Values.trigger.outbox).batchSize | default 256 | quote }}
  BATCH_TRIGGER_OUTBOX_PUBLISHING_TIMEOUT_SECONDS: {{ (.Values.trigger.outbox).publishingTimeoutSeconds | default 120 | quote }}
  BATCH_TRIGGER_OUTBOX_MAX_PUBLISH_ATTEMPTS: {{ (.Values.trigger.outbox).maxPublishAttempts | default 10 | quote }}
  BATCH_TRIGGER_OUTBOX_MAX_PUBLISH_EVENTS_PER_SECOND: {{ (.Values.trigger.outbox).maxPublishEventsPerSecond | default 40 | quote }}
  BATCH_WORKER_ATOMIC_ENABLED_TYPES: {{ (.Values.workerAtomic).enabledTaskTypes | default "" | quote }}
  BATCH_WORKER_IMPORT_SCANNER_DONE_FILE_FORMAT: {{ (.Values.orchestrator.importScanner).doneFileFormat | default "MARKER" | quote }}
  BATCH_WORKER_IMPORT_SCANNER_DONE_FILE_SUFFIX: {{ (.Values.orchestrator.importScanner).doneFileSuffix | default ".done" | quote }}
  BATCH_WORKER_IMPORT_SCANNER_BATCH_MANIFEST_ENABLED: {{ (.Values.orchestrator.importScanner).batchManifestEnabled | default false | quote }}
  BATCH_FILE_GOVERNANCE_ARRIVAL_REQUIRE_VERIFIED: {{ (((.Values.orchestrator).fileGovernance).arrival).requireVerified | default false | quote }}
  BATCH_SENSOR_ENABLED: {{ (.Values.orchestrator.sensor).enabled | default true | quote }}
  BATCH_RATE_LIMIT_ENABLED: {{ .Values.orchestrator.rateLimit.enabled | default false | quote }}
  BATCH_RATE_LIMIT_MAX_NEW_REQUESTS_PER_TENANT_PER_MINUTE: {{ .Values.orchestrator.rateLimit.maxNewPerTenantPerMinute | default 3000 | quote }}
  BATCH_RATE_LIMIT_MAX_REGISTER_REQUESTS_PER_TENANT_PER_MINUTE: {{ .Values.orchestrator.rateLimit.maxRegisterPerTenantPerMinute | default 300 | quote }}
  BATCH_RATE_LIMIT_MAX_RELEASE_REQUESTS_PER_TENANT_PER_MINUTE: {{ .Values.orchestrator.rateLimit.maxReleasePerTenantPerMinute | default 3000 | quote }}
  BATCH_RATE_LIMIT_MAX_CLAIM_REQUESTS_PER_TENANT_PER_MINUTE: {{ .Values.orchestrator.rateLimit.maxClaimPerTenantPerMinute | default 12000 | quote }}
  BATCH_RATE_LIMIT_MAX_REPORT_REQUESTS_PER_TENANT_PER_MINUTE: {{ .Values.orchestrator.rateLimit.maxReportPerTenantPerMinute | default 12000 | quote }}
  BATCH_REQUEST_SIGNING_ENABLED: {{ (.Values.orchestrator.requestSigning).enabled | default false | quote }}
  BATCH_CONSOLE_REALTIME_REPLAY_MAX_ENTRIES: {{ .Values.consoleApi.realtime.replayMaxEntries | quote }}
  BATCH_CONSOLE_REALTIME_REPLAY_TTL: {{ .Values.consoleApi.realtime.replayTtl | quote }}
  BATCH_TIMEZONE_DEFAULT_ZONE: {{ .Values.batchTimezoneDefaultZone | quote }}
  TZ: {{ .Values.batchTimezoneDefaultZone | quote }}
  BATCH_LOCALE: {{ .Values.batchLocale | quote }}
  LANG: {{ .Values.batchLocale | quote }}
  LC_ALL: {{ .Values.batchLocale | quote }}

  # ── OpenTelemetry ──────────────────────────────────────────────────────────
  # R7-A4-P1: 只在 otelCollector.enabled=true 时输出 endpoint，否则 OTLP exporter
  # 解析不到 service 持续报 "no such host" / 启动时 DNS 探测超时。日志格式与采样
  # 始终输出（即使 collector 关，logback JSON / 日志采样阈值仍要生效）。
  {{- if .Values.otelCollector.enabled }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.otel.endpoint | quote }}
  {{- end }}
  OTEL_SAMPLING_PROBABILITY: {{ .Values.otel.samplingProbability | quote }}
  BATCH_LOG_FORMAT: {{ .Values.otel.logFormat | quote }}

  # ── JVM ───────────────────────────────────────────────────────────────────
  JAVA_OPTS: {{ .Values.javaOpts | quote }}
